name: Physical Android ADB Probe

on:
  push:
    branches:
      - test/android-timeout-startup-20260909
    paths:
      - .github/workflows/adb-device-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Locate adb
        shell: bash
        run: |
          set -euo pipefail
          ADB="$(command -v adb || true)"
          if [ -z "$ADB" ]; then
            for sdk in \
              "${ANDROID_HOME:-}" \
              "${ANDROID_SDK_ROOT:-}" \
              "$HOME/Android/Sdk" \
              "$HOME/Android/sdk" \
              "$HOME/.android/sdk" \
              "/opt/android-sdk" \
              "/usr/local/lib/android/sdk"
            do
              if [ -n "$sdk" ] && [ -x "$sdk/platform-tools/adb" ]; then
                ADB="$(realpath "$sdk/platform-tools/adb")"
                break
              fi
            done
          fi
          if [ -z "$ADB" ]; then
            ADB="$(find "$HOME" /opt /usr/local -maxdepth 8 -type f -path '*/platform-tools/adb' -perm -u+x -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$ADB" ]; then
            echo "ADB_NOT_FOUND"
            exit 2
          fi
          echo "ADB=$ADB" >> "$GITHUB_ENV"
          "$ADB" version | head -n 2

      - name: Inspect USB layer safely
        shell: bash
        run: |
          set -euo pipefail
          echo "USB_LAYER_BEGIN"
          if command -v lsusb >/dev/null 2>&1; then
            # Show vendor/product descriptors only; do not print device serial numbers.
            lsusb | sed -E 's/Bus [0-9]+ Device [0-9]+: ID /USB ID /' || true
          else
            echo "LSUSB_NOT_AVAILABLE"
          fi
          echo "RUNNER_GROUPS=$(id -Gn)"
          echo "USB_LAYER_END"

      - name: Detect authorized physical device
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" kill-server >/dev/null 2>&1 || true
          "$ADB" start-server >/dev/null

          SERIAL=""
          for attempt in $(seq 1 10); do
            states="$($ADB devices | awk 'NR>1 && NF>=2 {print $2}' | sort | uniq -c | xargs || true)"
            echo "ADB_ATTEMPT_${attempt}_STATES=${states:-none}"
            SERIAL="$($ADB devices | awk 'NR>1 && $2=="device" {print $1; exit}')"
            if [ -n "$SERIAL" ]; then break; fi
            sleep 3
          done

          if [ -z "$SERIAL" ]; then
            echo "NO_AUTHORIZED_ANDROID_DEVICE"
            exit 3
          fi
          echo "SERIAL=$SERIAL" >> "$GITHUB_ENV"
          echo "AUTHORIZED_ANDROID_DEVICE_FOUND"

      - name: Read safe MR SCRAP runtime facts
        shell: bash
        run: |
          set -euo pipefail
          echo "APP_PACKAGE_INFO_BEGIN"
          "$ADB" -s "$SERIAL" shell dumpsys package com.mrscrap.socialradar 2>/dev/null \
            | grep -E 'versionName=|versionCode=|firstInstallTime=|lastUpdateTime=' \
            | head -n 12 || true
          echo "APP_PACKAGE_INFO_END"

          echo "WEBVIEW_PROVIDER_BEGIN"
          "$ADB" -s "$SERIAL" shell cmd webviewupdate getCurrentWebViewPackage 2>/dev/null || true
          echo "WEBVIEW_PROVIDER_END"

          echo "APP_PROCESS_BEGIN"
          if "$ADB" -s "$SERIAL" shell pidof com.mrscrap.socialradar >/dev/null 2>&1; then
            echo "APP_PROCESS_RUNNING"
          else
            echo "APP_PROCESS_NOT_RUNNING"
          fi
          echo "APP_PROCESS_END"

          echo "No cookies, credentials, DOM text, page content, or device serials are printed by this probe."
