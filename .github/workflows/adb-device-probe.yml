name: Physical Android ADB Probe

on:
  push:
    branches:
      - test/android-timeout-startup-20260909
    paths:
      - .github/workflows/adb-device-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Detect runner boundary and prepare adb backend
        shell: bash
        run: |
          set -euo pipefail
          if grep -qi microsoft /proc/version 2>/dev/null || [ -n "${WSL_DISTRO_NAME:-}" ]; then
            echo "RUNNER_ENV=WSL"
            is_wsl=1
          else
            echo "RUNNER_ENV=LINUX"
            is_wsl=0
          fi

          linux_adb="$(command -v adb || true)"
          if [ -z "$linux_adb" ]; then
            for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" "$HOME/Android/sdk" "$HOME/.android/sdk" "/opt/android-sdk" "/usr/local/lib/android/sdk"; do
              if [ -n "$sdk" ] && [ -x "$sdk/platform-tools/adb" ]; then linux_adb="$(realpath "$sdk/platform-tools/adb")"; break; fi
            done
          fi

          selected="$linux_adb"
          backend="linux"
          if [ "$is_wsl" = 1 ] && command -v cmd.exe >/dev/null 2>&1; then
            win_user="$(cmd.exe /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            win_adb="$(cmd.exe /c where adb 2>/dev/null | tr -d '\r' | head -n1 || true)"
            if [ -n "$win_adb" ] && command -v wslpath >/dev/null 2>&1; then
              win_adb="$(wslpath "$win_adb" 2>/dev/null || printf '%s' "$win_adb")"
            fi

            if [ -z "$win_adb" ] && [ -n "$win_user" ]; then
              candidate="/mnt/c/Users/${win_user}/AppData/Local/Android/Sdk/platform-tools/adb.exe"
              if [ -x "$candidate" ]; then win_adb="$candidate"; fi
            fi

            if [ -z "$win_adb" ] && [ -n "$win_user" ]; then
              cache="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-platform-tools"
              mkdir -p "$cache"
              if [ ! -x "$cache/platform-tools/adb.exe" ]; then
                echo "WINDOWS_ADB_BOOTSTRAP=download"
                zip="$cache/platform-tools.zip"
                curl -fsSL --retry 3 --retry-delay 2 \
                  https://dl.google.com/android/repository/platform-tools-latest-windows.zip \
                  -o "$zip"
                python3 - "$zip" "$cache" <<'PY'
import sys, zipfile
zip_path, target = sys.argv[1], sys.argv[2]
with zipfile.ZipFile(zip_path) as z:
    z.extractall(target)
PY
                rm -f "$zip"
              fi
              if [ -x "$cache/platform-tools/adb.exe" ]; then
                win_adb="$cache/platform-tools/adb.exe"
              fi
            fi

            if [ -n "$win_adb" ] && [ -x "$win_adb" ]; then
              selected="$win_adb"
              backend="windows"
            else
              echo "WINDOWS_ADB_NOT_AVAILABLE"
            fi
          fi

          if [ -z "$selected" ] || [ ! -x "$selected" ]; then
            echo "ADB_NOT_FOUND"
            exit 2
          fi
          echo "ADB=$selected" >> "$GITHUB_ENV"
          echo "ADB_BACKEND=$backend" >> "$GITHUB_ENV"
          echo "ADB_BACKEND=$backend"
          "$selected" version | head -n 2 | tr -d '\r'

      - name: Detect authorized physical device
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" kill-server >/dev/null 2>&1 || true
          "$ADB" start-server >/dev/null 2>&1 || true
          SERIAL=""
          for attempt in $(seq 1 30); do
            snapshot="$($ADB devices 2>/dev/null | tr -d '\r' || true)"
            states="$(printf '%s\n' "$snapshot" | awk 'NR>1 && NF>=2 {print $2}' | sort | uniq -c | xargs || true)"
            echo "ADB_ATTEMPT_${attempt}_STATES=${states:-none}"
            SERIAL="$(printf '%s\n' "$snapshot" | awk 'NR>1 && $2=="device" {print $1; exit}')"
            if [ -n "$SERIAL" ]; then break; fi
            sleep 3
          done
          if [ -z "$SERIAL" ]; then
            echo "NO_AUTHORIZED_ANDROID_DEVICE"
            exit 3
          fi
          echo "SERIAL=$SERIAL" >> "$GITHUB_ENV"
          echo "AUTHORIZED_ANDROID_DEVICE_FOUND"

      - name: Read safe MR SCRAP runtime facts
        shell: bash
        run: |
          set -euo pipefail
          echo "APP_PACKAGE_INFO_BEGIN"
          "$ADB" -s "$SERIAL" shell dumpsys package com.mrscrap.socialradar 2>/dev/null \
            | tr -d '\r' \
            | grep -E 'versionName=|versionCode=|firstInstallTime=|lastUpdateTime=' \
            | head -n 12 || true
          echo "APP_PACKAGE_INFO_END"

          echo "ANDROID_RUNTIME_BEGIN"
          android_release="$($ADB -s "$SERIAL" shell getprop ro.build.version.release 2>/dev/null | tr -d '\r' || true)"
          android_sdk="$($ADB -s "$SERIAL" shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"
          echo "ANDROID_RELEASE=${android_release:-unknown}"
          echo "ANDROID_SDK=${android_sdk:-unknown}"
          echo "ANDROID_RUNTIME_END"

          echo "WEBVIEW_PROVIDER_BEGIN"
          "$ADB" -s "$SERIAL" shell cmd webviewupdate getCurrentWebViewPackage 2>/dev/null | tr -d '\r' || true
          echo "WEBVIEW_PROVIDER_END"

          if "$ADB" -s "$SERIAL" shell pidof com.mrscrap.socialradar >/dev/null 2>&1; then
            echo "APP_PROCESS_RUNNING"
          else
            echo "APP_PROCESS_NOT_RUNNING"
          fi
          echo "No cookies, credentials, DOM text, page content, or device serials are printed by this probe."
