name: Verify Real Session Architecture

on:
  push:
    branches:
      - work/real-session-ai-provider
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build web and server bundle
        run: npm run build
        env:
          APP_MODE: demo
          VITE_API_BASE_URL: https://example.invalid

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Publish Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-scrap-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
