name: Verify Real Session Architecture

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-real-session-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  web-and-android:
    # Dedicated lanes already have their own controlled validation path. Skip this hosted duplicate
    # on the protected provider lane and on the isolated Android validation lane, where the
    # self-hosted Code Complete Gate is the executable source of truth. Manual dispatch stays available.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.ref != 'work/real-session-ai-provider' && github.event.pull_request.head.ref != 'test/android-headless-emulator-20260909') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web and server bundle
        run: npm run build
        env:
          APP_MODE: demo
          VITE_API_BASE_URL: https://example.invalid

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.13'

      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Publish Android debug APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mr-scrap-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
