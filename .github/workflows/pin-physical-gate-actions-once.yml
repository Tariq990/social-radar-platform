name: Pin physical gate actions once

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
    paths:
      - '.github/workflows/pin-physical-gate-actions-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false

      - name: Pin physical gate dependencies without running the physical gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-physical-adb-final-gate.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'uses: actions/checkout@v4': 'uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
              'uses: actions/setup-node@v4': 'uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4',
              'uses: actions/setup-java@v4': 'uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4',
              'npm install --no-audit --no-fund': 'npm ci --no-audit --no-fund',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'EXPECTED_ONE_MATCH:{old}:{count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/pin-physical-gate-actions-once.yml
          git add .github/workflows/android-physical-adb-final-gate.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: pin physical acceptance dependencies'
          git push origin HEAD:test/android-headless-emulator-20260909
