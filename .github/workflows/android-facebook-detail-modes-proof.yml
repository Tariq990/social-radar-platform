name: Android Facebook Detail Lifecycle v153 Workspace Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-facebook-detail-modes-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      PKG: com.mrscrap.socialradar
      ANDROID_VERSION_CODE: '153'
      ANDROID_VERSION_NAME: '0.1.153-emulator-test'
    steps:
      - name: Checkout test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 1
          clean: false

      - name: Apply workspace-only post-detail lifecycle experiment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedPostDetailCollector.java')
          s=p.read_text()
          reps={
            'import android.os.Looper;\nimport android.view.View;':'import android.os.Looper;\nimport android.util.Log;\nimport android.view.View;',
            'private static final long TIMEOUT_MS = 40_000;':'private static final long TIMEOUT_MS = 75_000;',
            'private static final int MAX_ALL_ATTEMPTS = 18;':'private static final int MAX_ALL_ATTEMPTS = 18;\n    private static final String TAG = "MRSCRAP_DETAIL";'
          }
          for old,new in reps.items():
              assert s.count(old)==1,(old,s.count(old)); s=s.replace(old,new)
          anchor='            settings.setOffscreenPreRaster(true);'
          assert s.count(anchor)==1,s.count(anchor)
          s=s.replace(anchor,anchor+'\n            settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36");\n            Log.i(TAG, "event=user_agent mode=desktop");')
          old='''            final Runnable[] runner = new Runnable[1];
            runner[0] = () -> {
                if (finished.get()) return;
                attempts[0]++;'''
          new='''            final Runnable[] runner = new Runnable[1];
            runner[0] = () -> {
                if (finished.get()) return;
                String currentUrl = webView.getUrl();
                if (currentUrl == null || !AuthenticatedWebCollector.isAllowedSocialUrl(currentUrl)) {
                    Log.i(TAG, "event=wait_for_social_page");
                    main.postDelayed(runner[0], RETRY_DELAY_MS);
                    return;
                }
                attempts[0]++;
                Log.i(TAG, "event=extract_start attempt=" + attempts[0] + " progress=" + webView.getProgress());'''
          assert s.count(old)==1,s.count(old); s=s.replace(old,new)
          old='''                                boolean hasMore = diagnostics != null && diagnostics.optBoolean("hasMoreControls", false);

                                if (count == lastCommentCount[0]) stablePasses[0]++;'''
          new='''                                boolean hasMore = diagnostics != null && diagnostics.optBoolean("hasMoreControls", false);
                                JSONArray media = result.optJSONArray("media");
                                int mediaCount = media == null ? 0 : media.length();
                                Log.i(TAG, "event=eval_result attempt=" + attempts[0] + " comments=" + count +
                                    " media=" + mediaCount + " hasMore=" + hasMore);

                                if (count == lastCommentCount[0]) stablePasses[0]++;'''
          assert s.count(old)==1,s.count(old); s=s.replace(old,new)
          old='''                private void schedule(long delay) {
                    if (finished.get()) return;
                    main.removeCallbacks(runner[0]);
                    main.postDelayed(runner[0], delay);
                }

                @Override
                public boolean shouldOverrideUrlLoading'''
          new='''                private void schedule(long delay) {
                    if (finished.get()) return;
                    main.postDelayed(runner[0], delay);
                }

                @Override
                public boolean shouldOverrideUrlLoading'''
          assert s.count(old)==1,s.count(old); s=s.replace(old,new)
          anchor='''                @Override
                public void onPageCommitVisible(WebView view, String loadedUrl) {'''
          insert='''                @Override
                public void onPageStarted(WebView view, String loadedUrl, android.graphics.Bitmap favicon) {
                    super.onPageStarted(view, loadedUrl, favicon);
                    if (!AuthenticatedWebCollector.isAllowedSocialUrl(loadedUrl) || finished.get()) return;
                    Log.i(TAG, "event=page_started progress=" + view.getProgress());
                    schedule(3_000);
                }

'''+anchor
          assert s.count(anchor)==1,s.count(anchor); s=s.replace(anchor,insert)
          old='''            webView.loadUrl(targetUrl);
        });'''
          new='''            Log.i(TAG, "event=load_start");
            webView.loadUrl(targetUrl);
            main.postDelayed(runner[0], 3_000);
        });'''
          assert s.count(old)==1,s.count(old); s=s.replace(old,new)
          p.write_text(s)
          for token in ['TIMEOUT_MS = 75_000','event=user_agent mode=desktop','event=page_started','event=wait_for_social_page','main.postDelayed(runner[0], 3_000)','MRSCRAP_DETAIL']:
              assert token in s,token
          print('V153_WORKSPACE_DETAIL_PATCH=PASS')
          PY
          git diff --check
          git diff -- android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedPostDetailCollector.java | sed -n '1,240p'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build workspace-only v153
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"; sdk="$(realpath "$sdk")"; test -d "$sdk/platforms/android-36"; test -d "$sdk/build-tools/36.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"; printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"; test -x "$gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo V153_BUILD_GATE=PASS

      - name: Install v153 preserving Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -s "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"; test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          tmp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MR-SCRAP-emulator-test-153.apk"; cp android/app/build/outputs/apk/debug/app-debug.apk "$tmp"
          out="$($adb -s "$serial" install -r "$(wslpath -w "$tmp")" 2>&1 | tr -d '\r')"; printf '%s\n' "$out"; printf '%s' "$out" | grep -q Success
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 153
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_AFTER_V153_INSTALL=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true; $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null; sleep 8
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"; echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo V153_INSTALL_SESSION_GATE=PASS

      - name: Prove one media-only post detail returns on v153
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"; [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true; $ADB -s "$SERIAL" forward tcp:9223 "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v153-detail-one.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets { for($i=0;$i -lt 30;$i++){ try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{}; Start-Sleep -Milliseconds 250 }; throw 'targets unavailable' }
          function AppTarget { $a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1);if($a.Count-eq 0){throw 'app target missing'};$a[0] }
          function Eval([string]$raw,[string]$expr,[int]$seconds=120){$u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]('ws://127.0.0.1:9223'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id-ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}}
          $app=AppTarget
          $expr=@'
          (async()=>{const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;if(!cap)return{plugin:false};const sr=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(!sr.ok)return{plugin:true,source:false,http:sr.status};const ss=await sr.json();const s=(Array.isArray(ss)?ss:[]).find(x=>x&&x.platform==='facebook'&&!Boolean(x.is_paused??x.isPaused)&&(x.connector_type||x.connectorType||'device_session')==='device_session');if(!s)return{plugin:true,source:false};let col;try{col=await cap.collectSource({sourceId:s.id,url:s.url,platform:'facebook',limit:1})}catch(e){return{plugin:true,source:true,collect:false}}const p=Array.isArray(col?.posts)?col.posts[0]:null;if(!p)return{plugin:true,source:true,collect:true,posts:0};try{const r=await cap.collectPostDetails({url:p.originalUrl,sourceUrl:s.url,platform:'facebook',publisherName:p.authorName||'',commentsMode:'none',commentLimit:1,includeReplies:true});const m=Array.isArray(r?.media)?r.media:[];return{plugin:true,source:true,collect:true,posts:1,detail:true,media:m.length,images:m.filter(x=>x?.type==='image').length,videos:m.filter(x=>x?.type==='video').length,videoPresent:r?.videoPresent===true,commentArticles:Number(r?.diagnostics?.commentArticles||0)}}catch(e){const x=String(e?.message||'');return{plugin:true,source:true,collect:true,posts:1,detail:false,timeout:/timed out/i.test(x),session:/SESSION_REQUIRED|SESSION_CHECKPOINT/i.test(x)}}})()
          '@
          $r=Eval ([string]$app.webSocketDebuggerUrl) $expr 120
          Write-Output ('DETAIL_PLUGIN_AVAILABLE='+$(if($r.plugin){'1'}else{'0'}));Write-Output ('FACEBOOK_DEVICE_SOURCE_FOUND='+$(if($r.source){'1'}else{'0'}));Write-Output ('COLLECT_ONE_OK='+$(if($r.collect){'1'}else{'0'}));Write-Output ('COLLECT_ONE_POSTS='+[int]$r.posts);Write-Output ('DETAIL_NONE_OK='+$(if($r.detail){'1'}else{'0'}))
          if(!$r.detail){Write-Output ('DETAIL_NONE_TIMEOUT='+$(if($r.timeout){'1'}else{'0'}));Write-Output ('DETAIL_NONE_SESSION_ERROR='+$(if($r.session){'1'}else{'0'}));exit 180}
          Write-Output ('DETAIL_NONE_MEDIA='+[int]$r.media);Write-Output ('DETAIL_NONE_IMAGES='+[int]$r.images);Write-Output ('DETAIL_NONE_VIDEOS='+[int]$r.videos);Write-Output ('DETAIL_NONE_VIDEO_PRESENT='+$(if($r.videoPresent){'1'}else{'0'}));Write-Output ('DETAIL_NONE_COMMENT_ARTICLES='+[int]$r.commentArticles);Write-Output V153_DETAIL_MEDIA_BASELINE_GATE=PASS
          PS
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          echo '=== SAFE DETAIL TRACE ==='
          $ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR|DETAIL)' | tail -n 220 || true

      - name: Preserve session and clean forwarding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADB:-}" ] || [ -z "${SERIAL:-}" ]; then exit 0; fi
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_AFTER_V153_PROOF=1
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v153-detail-one.ps1" 2>/dev/null || true
          echo FACEBOOK_DETAIL_SESSION_GATE=PASS
