name: Android Facebook Detail Media Baseline v152

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-facebook-detail-modes-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar
      EXPECTED_VERSION_CODE: '152'
    steps:
      - name: Checkout test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 1
          clean: false

      - name: Resolve existing v152 session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -s "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"; test "$version" = "$EXPECTED_VERSION_CODE"
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 8
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"; echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo EXISTING_V152_SESSION_GATE=PASS

      - name: Prove one post-detail media-only call returns
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:9223 "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v152-detail-one.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets { for($i=0;$i -lt 30;$i++){ try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{}; Start-Sleep -Milliseconds 250 }; throw 'targets unavailable' }
          function AppTarget { $a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1); if($a.Count -eq 0){throw 'app target missing'}; $a[0] }
          function Eval([string]$raw,[string]$expr,[int]$seconds=150){ $u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]('ws://127.0.0.1:9223'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v} }
          $app=AppTarget
          $expr=@'
          (async()=>{
            const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;
            if(!cap)return{plugin:false};
            const sr=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});
            if(!sr.ok)return{plugin:true,source:false,http:sr.status};
            const ss=await sr.json();
            const s=(Array.isArray(ss)?ss:[]).find(x=>x&&x.platform==='facebook'&&!Boolean(x.is_paused??x.isPaused)&&(x.connector_type||x.connectorType||'device_session')==='device_session');
            if(!s)return{plugin:true,source:false};
            let col;try{col=await cap.collectSource({sourceId:s.id,url:s.url,platform:'facebook',limit:1});}catch(e){return{plugin:true,source:true,collect:false,error:'collect'}}
            const p=Array.isArray(col?.posts)?col.posts[0]:null;if(!p)return{plugin:true,source:true,collect:true,posts:0};
            try{
              const r=await cap.collectPostDetails({url:p.originalUrl,sourceUrl:s.url,platform:'facebook',publisherName:p.authorName||'',commentsMode:'none',commentLimit:1,includeReplies:true});
              const media=Array.isArray(r?.media)?r.media:[];
              return{plugin:true,source:true,collect:true,posts:1,detail:true,media:media.length,images:media.filter(x=>x?.type==='image').length,videos:media.filter(x=>x?.type==='video').length,videoPresent:r?.videoPresent===true,commentArticles:Number(r?.diagnostics?.commentArticles||0)};
            }catch(e){return{plugin:true,source:true,collect:true,posts:1,detail:false,error:String(e?.message||'detail').replace(/https?:\/\/\S+/g,'[url]').slice(0,80)}}
          })()
          '@
          $r=Eval ([string]$app.webSocketDebuggerUrl) $expr 150
          Write-Output ('DETAIL_PLUGIN_AVAILABLE='+$(if($r.plugin){'1'}else{'0'}));if(!$r.plugin){exit 170}
          Write-Output ('FACEBOOK_DEVICE_SOURCE_FOUND='+$(if($r.source){'1'}else{'0'}));if(!$r.source){if($null-ne$r.http){Write-Output ('SOURCES_HTTP='+$r.http)};exit 171}
          Write-Output ('COLLECT_ONE_OK='+$(if($r.collect){'1'}else{'0'}));if(!$r.collect){exit 172}
          Write-Output ('COLLECT_ONE_POSTS='+[int]$r.posts);if([int]$r.posts -ne 1){exit 173}
          Write-Output ('DETAIL_NONE_OK='+$(if($r.detail){'1'}else{'0'}));if(!$r.detail){Write-Output 'DETAIL_NONE_ERROR=1';exit 174}
          Write-Output ('DETAIL_NONE_MEDIA='+[int]$r.media);Write-Output ('DETAIL_NONE_IMAGES='+[int]$r.images);Write-Output ('DETAIL_NONE_VIDEOS='+[int]$r.videos);Write-Output ('DETAIL_NONE_VIDEO_PRESENT='+$(if($r.videoPresent){'1'}else{'0'}));Write-Output ('DETAIL_NONE_COMMENT_ARTICLES='+[int]$r.commentArticles)
          Write-Output FACEBOOK_DETAIL_MEDIA_BASELINE_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Preserve session and clean forwarding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADB:-}" ] || [ -z "${SERIAL:-}" ]; then exit 0; fi
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_AFTER_DETAIL_PROOF=1
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v152-detail-one.ps1" 2>/dev/null || true
          echo FACEBOOK_DETAIL_SESSION_GATE=PASS
