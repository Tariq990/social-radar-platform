name: Meta Live DOM Diagnostic

on:
  push:
    branches:
      - work/real-session-ai-provider
    paths:
      - .github/workflows/meta-live-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-live-dom-diagnostic
  cancel-in-progress: true

jobs:
  inspect-live-facebook:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify local Chrome DevTools session
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 3 http://127.0.0.1:9222/json/version \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Chrome:", d.get("Browser","unknown")); print("CDP:", d.get("Protocol-Version","unknown")); assert d.get("webSocketDebuggerUrl")'

      - name: Inspect authenticated Facebook DOM safely
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const BASE = 'http://127.0.0.1:9222';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          const targetsResponse = await fetch(`${BASE}/json/list`);
          if (!targetsResponse.ok) throw new Error(`CDP target listing failed: HTTP ${targetsResponse.status}`);
          const targets = await targetsResponse.json();
          const pages = targets.filter(t => t.type === 'page' && typeof t.url === 'string');
          const facebookPages = pages.filter(t => {
            try {
              const h = new URL(t.url).hostname.toLowerCase();
              return h === 'facebook.com' || h.endsWith('.facebook.com');
            } catch { return false; }
          });

          if (!facebookPages.length) {
            const safeHosts = [...new Set(pages.map(t => {
              try { return new URL(t.url).hostname; } catch { return 'unknown'; }
            }))];
            console.error('NO_FACEBOOK_TAB');
            console.error('Open page hosts:', JSON.stringify(safeHosts));
            process.exit(2);
          }

          const target = facebookPages[0];
          if (!target.webSocketDebuggerUrl) throw new Error('Facebook page has no DevTools websocket target');

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('CDP websocket open timeout')), 5000);
            socket.addEventListener('open', () => { clearTimeout(timer); resolve(); }, { once: true });
            socket.addEventListener('error', () => { clearTimeout(timer); reject(new Error('CDP websocket error')); }, { once: true });
          });

          let nextId = 1;
          const pending = new Map();
          socket.addEventListener('message', event => {
            let message;
            try { message = JSON.parse(event.data); } catch { return; }
            if (!message.id || !pending.has(message.id)) return;
            const { resolve, reject } = pending.get(message.id);
            pending.delete(message.id);
            if (message.error) reject(new Error(message.error.message || 'CDP command failed'));
            else resolve(message.result);
          });

          function cdp(method, params = {}) {
            const id = nextId++;
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => {
                pending.delete(id);
                reject(new Error(`CDP timeout: ${method}`));
              }, 8000);
              pending.set(id, {
                resolve: value => { clearTimeout(timer); resolve(value); },
                reject: error => { clearTimeout(timer); reject(error); }
              });
              socket.send(JSON.stringify({ id, method, params }));
            });
          }

          async function evaluate(expression) {
            const result = await cdp('Runtime.evaluate', {
              expression,
              returnByValue: true,
              awaitPromise: true
            });
            if (result.exceptionDetails) throw new Error('DOM evaluation raised an exception');
            return result.result?.value;
          }

          const diagnosticExpression = `(() => {
            const abs = u => { try { return new URL(u, location.href).href; } catch { return ''; } };
            const rawLink = a => a?.getAttribute?.('href') || a?.getAttribute?.('data-href') || a?.getAttribute?.('data-url') || a?.getAttribute?.('ajaxify') || '';
            const normalize = raw => {
              let full = abs(raw);
              if (!full) return '';
              try {
                const x = new URL(full);
                const wrapped = x.searchParams.get('u');
                if ((x.pathname === '/l.php' || x.hostname === 'l.facebook.com' || x.hostname === 'lm.facebook.com') && wrapped) {
                  const inner = abs(wrapped);
                  const ih = new URL(inner).hostname.toLowerCase();
                  if (ih === 'facebook.com' || ih.endsWith('.facebook.com')) full = inner;
                }
              } catch {}
              return full;
            };
            const isPostUrl = u => {
              try {
                const x = new URL(u);
                const h = x.hostname.toLowerCase();
                if (!(h === 'facebook.com' || h.endsWith('.facebook.com'))) return false;
                const p = x.pathname.toLowerCase();
                const parts = p.split('/').filter(Boolean);
                const markers = ['posts','permalink','reel','reels','p','tv','videos'];
                const pathMatch = parts.some((part, index) => markers.includes(part) && index < parts.length - 1);
                const scriptMatch = p.endsWith('/story.php') || p.endsWith('/permalink.php') || p.endsWith('/photo.php') || p.endsWith('/photo');
                const shareMatch = parts[0] === 'share' && ['p','r','v'].includes(parts[1] || '') && Boolean(parts[2]);
                return pathMatch || scriptMatch || shareMatch ||
                  (p.includes('/watch') && x.searchParams.has('v')) ||
                  x.searchParams.has('story_fbid') || x.searchParams.has('fbid');
              } catch { return false; }
            };
            const anchors = [...document.querySelectorAll('a[href],a[data-href],a[data-url],a[ajaxify]')];
            const postLinks = new Set();
            for (const a of anchors) {
              const u = normalize(rawLink(a));
              if (u && isPostUrl(u)) postLinks.add(u);
            }
            const path = location.pathname.toLowerCase();
            const loginForm = Boolean(document.querySelector('form[action*="/login"],input[name="email"],input[name="pass"]'));
            const checkpoint = path.includes('/checkpoint');
            return {
              surface: location.hostname,
              path,
              loginForm,
              checkpoint,
              authenticatedLikely: !loginForm && !checkpoint,
              bodyTextLength: (document.body?.innerText || '').length,
              anchors: anchors.length,
              postLinks: postLinks.size,
              timestamps: document.querySelectorAll('time,abbr[data-utime],[data-utime],abbr').length,
              containers: {
                roleArticle: document.querySelectorAll('[role="article"]').length,
                article: document.querySelectorAll('article').length,
                feedUnit: document.querySelectorAll('[data-pagelet*="FeedUnit"]').length,
                profileTimeline: document.querySelectorAll('[data-pagelet*="ProfileTimeline"]').length,
                dataTestPost: document.querySelectorAll('[data-testid*="post"]').length,
                topLevelPostId: document.querySelectorAll('[data-ft*="top_level_post_id"]').length
              },
              scrollY: Math.round(window.scrollY || 0),
              viewportHeight: Math.round(window.innerHeight || 0),
              scrollHeight: Math.round(Math.max(document.body?.scrollHeight || 0, document.documentElement?.scrollHeight || 0))
            };
          })()`;

          await cdp('Runtime.enable');
          const snapshots = [];
          for (let i = 0; i < 4; i++) {
            snapshots.push(await evaluate(diagnosticExpression));
            if (i < 3) {
              await evaluate(`(() => { const h=Math.max(window.innerHeight||700,700); window.scrollBy(0,Math.round(h*1.7)); return window.scrollY; })()`);
              await sleep(1200);
            }
          }

          socket.close();
          console.log('META_LIVE_DIAGNOSTIC');
          console.log(JSON.stringify(snapshots, null, 2));

          if (snapshots.some(s => s.loginForm || s.checkpoint || !s.authenticatedLikely)) {
            console.error('SESSION_NOT_USABLE');
            process.exit(3);
          }

          const maxPostLinks = Math.max(...snapshots.map(s => Number(s.postLinks || 0)));
          const maxContainers = Math.max(...snapshots.map(s => Object.values(s.containers || {}).reduce((a, b) => a + Number(b || 0), 0)));
          console.log(`MAX_POST_LINKS=${maxPostLinks}`);
          console.log(`MAX_KNOWN_CONTAINERS=${maxContainers}`);
          if (maxPostLinks === 0) {
            console.error('LIVE_DOM_NO_POST_LINKS');
            process.exit(4);
          }
          console.log('LIVE_DOM_POST_LINKS_FOUND');
          NODE
