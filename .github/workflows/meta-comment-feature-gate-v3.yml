name: Meta Comment Feature Gate V3

on:
  push:
    branches:
      - test/meta-comment-dom-20260909
    paths:
      - .github/workflows/meta-comment-feature-gate-v3.yml

permissions:
  contents: write

concurrency:
  group: meta-comment-feature-gate-v3
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout temp feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic production patch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/apply-comment-grab-feature.py > /tmp/comment-patch.log 2>&1
          status=$?
          set -e
          cat /tmp/comment-patch.log
          if [[ $status -ne 0 ]] && ! grep -q 'SmartGrabPanel.tsx: expected exactly one match, got 0' /tmp/comment-patch.log; then exit "$status"; fi
          python3 scripts/finish-comment-grab-feature.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/tests/architectureRegression.test.ts')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
          git diff --check
          git status --short

      - name: Verify shared extractor against live authenticated Facebook DOM
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 3 http://127.0.0.1:9222/json/version >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const BASE = 'http://127.0.0.1:9222';
          const TEST_URL = 'https://www.facebook.com/StoneMountain64/videos/1062741033206907/';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const targets = await (await fetch(`${BASE}/json/list`)).json();
          const target = targets.find(t => t.type === 'page' && (() => { try { const h = new URL(t.url).hostname.toLowerCase(); return h === 'facebook.com' || h.endsWith('.facebook.com'); } catch { return false; } })());
          if (!target?.webSocketDebuggerUrl) throw new Error('NO_FACEBOOK_TAB');
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => { const timer = setTimeout(() => reject(new Error('CDP websocket timeout')), 5000); ws.addEventListener('open', () => { clearTimeout(timer); resolve(); }, { once: true }); ws.addEventListener('error', () => reject(new Error('CDP websocket error')), { once: true }); });
          let nextId = 1; const pending = new Map();
          ws.addEventListener('message', event => { let message; try { message = JSON.parse(event.data); } catch { return; } if (!message.id || !pending.has(message.id)) return; const item = pending.get(message.id); pending.delete(message.id); if (message.error) item.reject(new Error(message.error.message || 'CDP command failed')); else item.resolve(message.result); });
          function cdp(method, params = {}) { const id = nextId++; return new Promise((resolve, reject) => { const timer = setTimeout(() => { pending.delete(id); reject(new Error(`CDP timeout ${method}`)); }, 10000); pending.set(id, { resolve: value => { clearTimeout(timer); resolve(value); }, reject: error => { clearTimeout(timer); reject(error); } }); ws.send(JSON.stringify({ id, method, params })); }); }
          async function evaluate(expression) { const result = await cdp('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true }); if (result.exceptionDetails) throw new Error('DOM evaluation exception'); return result.result?.value; }
          await cdp('Runtime.enable'); await cdp('Page.enable'); await cdp('Page.navigate', { url: TEST_URL }); await sleep(3500);
          const script = fs.readFileSync('android/app/src/main/res/raw/mrscrap_post_detail_extractor.js', 'utf8');
          if (await evaluate(script) !== true) throw new Error('Shared extractor did not initialize');
          for (let i = 0; i < 4; i++) { await evaluate('globalThis.__MR_SCRAP_EXPAND_POST_DETAIL__()'); await sleep(900); }
          const raw = await evaluate(`globalThis.__MR_SCRAP_EXTRACT_POST_DETAIL__(${JSON.stringify({ commentsMode: 'top', commentLimit: 20, includeReplies: true, publisherName: 'StoneMountain64' })})`);
          const detail = JSON.parse(raw); if (detail.error) throw new Error(detail.error);
          const comments = Array.isArray(detail.comments) ? detail.comments : [];
          const publisherComments = comments.filter(comment => comment?.isPublisher === true).length;
          const mediaCount = Array.isArray(detail.media) ? detail.media.length : 0;
          console.log(JSON.stringify({ comments: comments.length, publisherComments, mediaCount, videoPresent: detail.videoPresent === true, commentsTruncated: detail.commentsTruncated === true, commentArticles: Number(detail.diagnostics?.commentArticles || 0) }));
          ws.close();
          if (comments.length < 5) throw new Error(`Expected at least 5 real comments, got ${comments.length}`);
          if (publisherComments < 1) throw new Error('Publisher comment identification failed');
          if (detail.videoPresent !== true) throw new Error('Known video post was not recognized as video');
          console.log('LIVE_COMMENT_PARITY_OK');
          NODE

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Typecheck
        shell: bash
        run: npm run lint

      - name: Unit and architecture tests
        shell: bash
        run: npm test

      - name: Build production web bundle
        shell: bash
        env:
          VITE_API_BASE_URL: https://mr-scrap-api-live.onrender.com
          APP_MODE: production
        run: npm run build

      - name: Sync Capacitor Android
        shell: bash
        run: npx cap sync android

      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/.android/sdk"
          test -d "$SDK/platforms/android-36"
          test -d "$SDK/build-tools/36.0.0"
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          JAVA_CANDIDATE="$HOME/actions-runnerr/_work/_tool/Java_Temurin-Hotspot_jdk/21.0.12-101.0.LTS/x64"
          if [[ -d "$JAVA_CANDIDATE" ]]; then export JAVA_HOME="$JAVA_CANDIDATE"; export PATH="$JAVA_HOME/bin:$PATH"; fi
          java -version
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleDebug --stacktrace

      - name: Commit validated temp implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/res/raw/mrscrap_post_detail_extractor.js android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedPostDetailCollector.java android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedSocialSessionPlugin.java src/types/index.ts src/connectors/deviceSessionConnector.ts src/services/explore.ts src/components/SmartGrabPanel.tsx server/worker/deviceExplore.ts server/ai/aiService.ts server/tests/architectureRegression.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No production changes to commit.'; exit 1; fi
          git commit -m 'feat: add authenticated comment and media grab'
          git push origin HEAD:test/meta-comment-dom-20260909
