name: Android v158 Virtualized Feed Accumulator Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v158-virtualized-feed-accumulator-proof.yml]

permissions:
  contents: write

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  patch-build-install-prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      PKG: com.mrscrap.socialradar
      ANDROID_VERSION_CODE: '158'
      ANDROID_VERSION_NAME: '0.1.158-emulator-test'
    steps:
      - name: Checkout exact test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 0
          clean: false

      - name: Apply virtualized-feed accumulator fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          collector = Path('android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java')
          text = collector.read_text()
          if '__mrscrapCollectedFeedPostsV1' in text:
              raise SystemExit('accumulator already present unexpectedly')
          needle = "              const bodyText = (document.body?.innerText || '').trim();\n"
          block = """              // Facebook virtualizes feed units while scrolling. Preserve distinct posts observed\n              // across extraction polls so a requested multi-post grab does not collapse to only the\n              // few units still mounted in the final DOM viewport. This state stays inside the local\n              // authenticated WebView and is discarded with the WebView.\n              const accumulatorKey = '__mrscrapCollectedFeedPostsV1';\n              const accumulator = Array.isArray(window[accumulatorKey]) ? window[accumulatorKey] : [];\n              const accumulatedIndex = new Map();\n              accumulator.forEach((post, index) => {\n                const key = canonicalPostKey(post?.originalUrl || '', post?.externalPostId || '');\n                if (key) accumulatedIndex.set(key, index);\n              });\n              for (const post of posts) {\n                const key = canonicalPostKey(post.originalUrl || '', post.externalPostId || '');\n                if (!key) continue;\n                const existingIndex = accumulatedIndex.get(key);\n                if (existingIndex === undefined) {\n                  accumulatedIndex.set(key, accumulator.length);\n                  accumulator.push(post);\n                  continue;\n                }\n                const existing = accumulator[existingIndex];\n                const richerText = String(post.text || '').length > String(existing?.text || '').length;\n                const richerMedia = (post.media?.length || 0) > (existing?.media?.length || 0);\n                if (richerText || richerMedia) accumulator[existingIndex] = { ...existing, ...post };\n              }\n              const accumulatedPosts = accumulator.slice(0, Math.max(LIMIT * 3, 30));\n              window[accumulatorKey] = accumulatedPosts;\n\n"""
          if text.count(needle) != 1:
              raise SystemExit('bodyText insertion point mismatch')
          text = text.replace(needle, block + needle, 1)
          old = '                posts: posts.slice(0, LIMIT),\n'
          new = '                posts: accumulatedPosts.slice(0, LIMIT),\n'
          if text.count(old) != 1:
              raise SystemExit('posts output replacement mismatch')
          text = text.replace(old, new, 1)
          diag = '                  postLinks,\n                  bodyTextLength: bodyText.length\n'
          diag_new = '                  postLinks,\n                  accumulatedPosts: accumulatedPosts.length,\n                  bodyTextLength: bodyText.length\n'
          if text.count(diag) != 1:
              raise SystemExit('diagnostic insertion mismatch')
          text = text.replace(diag, diag_new, 1)
          collector.write_text(text)

          tests = Path('server/tests/architectureRegression.test.ts')
          t = tests.read_text()
          marker = "test('native collector accumulates virtualized feed posts across extraction polls'"
          if marker not in t:
              t += """\n\ntest('native collector accumulates virtualized feed posts across extraction polls', () => {\n  const collector = read('android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java');\n  assert.match(collector, /__mrscrapCollectedFeedPostsV1/);\n  assert.match(collector, /const accumulatedPosts = accumulator\\.slice/);\n  assert.match(collector, /posts: accumulatedPosts\\.slice\\(0, LIMIT\\)/);\n});\n"""
              tests.write_text(t)
          print('V158_ACCUMULATOR_PATCH_APPLIED=1')
          PY
          git diff --check
          grep -q '__mrscrapCollectedFeedPostsV1' android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java
          grep -q 'posts: accumulatedPosts.slice(0, LIMIT)' android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java
          echo V158_PATCH_GATE=PASS

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test and commit v158 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x node_modules/.bin/tsc ] || [ ! -x node_modules/.bin/tsx ]; then npm install --no-audit --no-fund; fi
          npm run lint
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java server/tests/architectureRegression.test.ts
          git diff --cached --check
          git diff --cached --quiet && { echo NO_V158_SOURCE_CHANGES=1; exit 1; }
          git commit -m 'fix: accumulate virtualized Facebook feed posts across polls'
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:test/android-headless-emulator-20260909
          echo "V158_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "V158_SOURCE_COMMIT=$source_sha"
          echo V158_SOURCE_TEST_GATE=PASS

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build v158
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x node_modules/.bin/vite ] || [ ! -x node_modules/.bin/cap ]; then npm install --no-audit --no-fund; fi
          npx vite build
          npx cap sync android
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          sdk="$(realpath "$sdk")"
          test -d "$sdk/platforms/android-36"
          test -d "$sdk/build-tools/36.0.0"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"
          test -x "$gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK_SIZE=$(stat -c '%s' "$apk")"
          echo V158_BUILD_GATE=PASS

      - name: Install v158 preserving Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"
          test -n "$serial"
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_BEFORE_V158_INSTALL=1
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          tmp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MR-SCRAP-emulator-test-158.apk"
          cp "$apk" "$tmp"
          out="$($adb -s "$serial" install -r "$(wslpath -w "$tmp")" 2>&1 | tr -d '\r')"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q Success
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"
          test "$version" = 158
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_V158_INSTALL=1
          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          echo V158_INSTALL_GATE=PASS

      - name: Reboot emulator and prove cold v158 collection reaches requested 10
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" reboot >/dev/null 2>&1 || true
          boot=0
          for i in $(seq 1 180); do
            state="$($ADB devices 2>/dev/null | tr -d '\r' | awk -v s="$SERIAL" '$1==s {print $2}')"
            if [ "$state" = device ]; then
              value="$($ADB -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
              if [ "$value" = 1 ]; then boot=1; break; fi
            fi
            sleep 1
          done
          echo "EMULATOR_BOOT_AFTER_V158_REBOOT=$boot"
          test "$boot" = 1
          version="$($ADB -s "$SERIAL" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_AFTER_REBOOT=$version"
          test "$version" = 158
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_AFTER_V158_REBOOT=1
          curl -fsS --max-time 30 https://mr-scrap-api-live.onrender.com/api/health >/dev/null || true
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 15
          pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"
          test -n "$pid"
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "(_|^)${pid}$" | head -n1 || true)"
          test -n "$socket"
          port=9233
          $ADB -s "$SERIAL" forward --remove tcp:$port >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:$port "localabstract:$socket" >/dev/null
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v158-cold-proof.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9233
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=300){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 12;$bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}}
          $expr=@'
          (async()=>{
            const out={facebook:false,appAuth:false,source:false,count:0,media:false,error:false};const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;if(!cap)return out;
            try{const s=await cap.status();out.facebook=s?.facebookConnected===true||s?.connected===true}catch{}
            let rows=[];for(let i=0;i<10;i++){try{const a=await fetch('https://mr-scrap-api-live.onrender.com/api/auth/me',{credentials:'include'});if(a.ok){const j=await a.json().catch(()=>null);out.appAuth=j?.authenticated===true}const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(r.ok){rows=await r.json();if(Array.isArray(rows)&&rows.length)break}}catch{};await new Promise(r=>setTimeout(r,600))}
            const src=(Array.isArray(rows)?rows:[]).find(x=>x&&x.platform==='facebook'&&((x.connector_type||x.connectorType||'device_session')==='device_session')&&!(x.is_paused===true||x.isPaused===true))||null;out.source=Boolean(src);if(!src)return out;
            try{const r=await cap.collectSource({sourceId:src.id,url:src.url,platform:'facebook',limit:10});const p=Array.isArray(r?.posts)?r.posts:[];out.count=p.length;out.media=p.some(x=>Array.isArray(x?.media)&&x.media.some(m=>m&&/^https?:\/\//i.test(String(m.url||''))))}catch{out.error=true}return out;
          })()
          '@
          $r=Eval $expr 300
          Write-Output ('FACEBOOK_CONNECTED_AFTER_REBOOT='+$(if($r.facebook){'1'}else{'0'}));Write-Output ('APP_AUTHENTICATED_AFTER_REBOOT='+$(if($r.appAuth){'1'}else{'0'}));Write-Output ('ACTIVE_FACEBOOK_SOURCE_AFTER_REBOOT='+$(if($r.source){'1'}else{'0'}));Write-Output ('COLD_COLLECT_ERROR='+$(if($r.error){'1'}else{'0'}));Write-Output ('COLD_COLLECT_COUNT='+[int]$r.count);Write-Output ('COLD_COLLECT_MEDIA='+$(if($r.media){'1'}else{'0'}))
          if(!$r.facebook -or !$r.appAuth -or !$r.source -or $r.error -or [int]$r.count -lt 10 -or !$r.media){exit 232}
          Write-Output V158_COLD_REBOOT_COLLECTION_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          logs="$($ADB -s "$SERIAL" logcat -d -v brief MRSCRAP_FLOW:I MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' || true)"
          echo "COLD_COLLECT_SUCCESS_COUNT=$(printf '%s\n' "$logs" | grep -c 'event=collect_source_success' || true)"
          echo "COLD_COLLECT_ERROR_COUNT=$(printf '%s\n' "$logs" | grep -c 'event=collect_source_error' || true)"
          printf '%s\n' "$logs" | grep 'event=eval_result' | tail -n 8 | sed -E 's/body=[0-9]+/body=<count>/' || true
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_FINAL=1
          rm -f "$ps1" 2>/dev/null || true
          $ADB -s "$SERIAL" forward --remove tcp:$port >/dev/null 2>&1 || true
