name: Android v158 Extracted Posts UI Final Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v158-extracted-posts-ui-final-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar
      EXPECTED_VERSION_CODE: '158'
    steps:
      - name: Resolve existing v158 emulator and preserve session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          sdk="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          adb="$sdk/platform-tools/adb.exe"; test -x "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"; test "$version" = "$EXPECTED_VERSION_CODE"
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_BEFORE_UI_PROOF=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 12
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"; echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo V158_EXISTING_APP_GATE=PASS

      - name: Prove real source identity and extracted post cards in UI
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          port=9238
          $ADB -s "$SERIAL" forward --remove tcp:$port >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:$port "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v158-ui-final.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9238
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=360){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 12;$bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}}
          $expr=@'
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const out={radar:false,button:false,modal:false,loadingEnded:false,error:false,cards:0,images:0,videos:0,mediaCards:0,count:0,sourceFound:false,sourceNameReal:false,sourceAvatarReal:false,facebookConnected:false};
            const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;
            try{const s=await cap?.status?.();out.facebookConnected=s?.facebookConnected===true||s?.connected===true}catch{}
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));
            for(let i=0;i<60;i++){const b=document.getElementById('btn-extracted-posts-home');if(b){out.radar=true;out.button=true;b.click();break}await sleep(250)}
            for(let i=0;i<80;i++){if(document.getElementById('modal-extracted-posts')){out.modal=true;break}await sleep(250)}
            if(!out.modal)return out;
            for(let i=0;i<360;i++){
              const loading=document.getElementById('extracted-posts-loading');
              if(!loading){out.loadingEnded=true;break}
              await sleep(1000);
            }
            out.error=Boolean(document.getElementById('extracted-posts-error'));
            const cards=[...document.querySelectorAll('[data-extracted-post="1"]')];
            out.cards=cards.length;
            out.images=document.querySelectorAll('[data-extracted-image="1"]').length;
            out.videos=document.querySelectorAll('[data-extracted-video="1"]').length;
            out.mediaCards=cards.filter(c=>Number(c.getAttribute('data-media-count')||'0')>0).length;
            out.count=Number(document.getElementById('extracted-post-count')?.getAttribute('data-count')||out.cards||0);
            try{
              const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});
              const rows=r.ok?await r.json():[];
              const src=(Array.isArray(rows)?rows:[]).find(x=>x?.platform==='facebook');
              if(src){out.sourceFound=true;const handle=String(src.handle||'').replace(/^@/,'').trim().toLowerCase();const name=String(src.displayName||'').trim();out.sourceNameReal=Boolean(name)&&name.replace(/^@/,'').trim().toLowerCase()!==handle;out.sourceAvatarReal=/^https?:\/\//i.test(String(src.avatarUrl||''));}
            }catch{}
            return out;
          })()
          '@
          $r=Eval $expr 390
          Write-Output ('FACEBOOK_CONNECTED='+$(if($r.facebookConnected){'1'}else{'0'}))
          Write-Output ('RADAR_VISIBLE='+$(if($r.radar){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_BUTTON='+$(if($r.button){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_MODAL='+$(if($r.modal){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_LOADING_ENDED='+$(if($r.loadingEnded){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_ERROR='+$(if($r.error){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_COUNT='+[int]$r.count)
          Write-Output ('EXTRACTED_POST_CARDS='+[int]$r.cards)
          Write-Output ('EXTRACTED_IMAGE_ELEMENTS='+[int]$r.images)
          Write-Output ('EXTRACTED_VIDEO_ELEMENTS='+[int]$r.videos)
          Write-Output ('EXTRACTED_MEDIA_CARDS='+[int]$r.mediaCards)
          Write-Output ('SOURCE_FOUND='+$(if($r.sourceFound){'1'}else{'0'}))
          Write-Output ('SOURCE_REAL_NAME='+$(if($r.sourceNameReal){'1'}else{'0'}))
          Write-Output ('SOURCE_REAL_AVATAR='+$(if($r.sourceAvatarReal){'1'}else{'0'}))
          if(!$r.facebookConnected -or !$r.radar -or !$r.button -or !$r.modal -or !$r.loadingEnded -or $r.error -or [int]$r.cards -lt 1 -or [int]$r.mediaCards -lt 1 -or !$r.sourceFound -or !$r.sourceNameReal -or !$r.sourceAvatarReal){exit 230}
          Write-Output V158_EXTRACTED_POSTS_UI_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Reconfirm session and cleanup forwarding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADB:-}" ] || [ -z "${SERIAL:-}" ]; then exit 0; fi
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_AFTER_UI_PROOF=1
          $ADB -s "$SERIAL" forward --remove tcp:9238 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v158-ui-final.ps1" 2>/dev/null || true
          echo V158_UI_SESSION_GATE=PASS
