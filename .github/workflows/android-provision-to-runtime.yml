name: Android Provision To Runtime

on:
  workflow_run:
    workflows: ["Android Headless Emulator Provision"]
    types: [completed]
    branches: [test/android-headless-emulator-20260909]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-runtime:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch persistent emulator runtime
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/android-persistent-emulator-runtime.yml/dispatches" \
            -d '{"ref":"test/android-headless-emulator-20260909","inputs":{"headless":"true"}}'
          echo RUNTIME_DISPATCHED=1
