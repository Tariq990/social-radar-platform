name: Current Android Context Resolver Probe

on:
  push:
    branches: [test/android-physical-fix-20260909]
    paths: [.github/workflows/android-current-target-diagnostic.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 4
    steps:
      - name: Invoke installed context resolver safely
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-platform-tools/platform-tools/adb.exe"
          serial=""
          for i in $(seq 1 30); do
            serial="$($adb devices 2>/dev/null | tr -d '\r' | awk 'NR>1 && $2=="device" {print $1; exit}')"
            [ -n "$serial" ] && break
            sleep 1
          done
          test -n "$serial"
          echo "::add-mask::$serial"
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_FLOW I || true
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_COLLECTOR I || true
          "$adb" -s "$serial" shell am start -n com.mrscrap.socialradar/.MainActivity >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell dumpsys package com.mrscrap.socialradar | tr -d '\r' | grep -E 'versionCode=|versionName=' | head -n4
          "$adb" -s "$serial" logcat -c

          pid=""
          socket_name=""
          for i in $(seq 1 30); do
            pid="$($adb -s "$serial" shell pidof com.mrscrap.socialradar 2>/dev/null | tr -d '\r' | awk '{print $1}')"
            if [ -n "$pid" ]; then
              socket_name="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | grep -o "webview_devtools_remote_${pid}" | head -n1 || true)"
              [ -n "$socket_name" ] && break
            fi
            sleep 1
          done
          test -n "$socket_name"
          "$adb" -s "$serial" forward --remove tcp:19222 >/dev/null 2>&1 || true
          "$adb" -s "$serial" forward tcp:19222 "localabstract:${socket_name}" >/dev/null

          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-context-ready-probe.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          $main=$null
          $deadline=[DateTime]::UtcNow.AddSeconds(25)
          while([DateTime]::UtcNow -lt $deadline -and -not $main){
            try{
              $targets=@(Invoke-RestMethod -Uri 'http://127.0.0.1:19222/json' -TimeoutSec 3)
              $main=$targets|Where-Object {
                $_.type -eq 'page' -and
                (([string]$_.url).StartsWith('https://localhost') -or ([string]$_.url).StartsWith('http://localhost'))
              }|Select-Object -First 1
            }catch{}
            if(-not $main){Start-Sleep -Milliseconds 500}
          }
          if(-not $main){throw 'LOCALHOST_TARGET_NOT_READY'}
          Write-Output LOCALHOST_TARGET_READY
          $u=([string]$main.webSocketDebuggerUrl) -replace '^ws://localhost:','ws://127.0.0.1:'
          $ws=[System.Net.WebSockets.ClientWebSocket]::new();$ws.Options.Proxy=$null
          [void]$ws.ConnectAsync([Uri]$u,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          $expr="(() => { window.Capacitor.nativePromise('AuthenticatedSocialSession','collectSource',{sourceId:'context-ready-diagnostic',url:'https://www.facebook.com/tarik.ziad.3914',platform:'facebook',limit:10}).catch(()=>null); return 'started'; })()"
          $payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true}}|ConvertTo-Json -Depth 10 -Compress
          $bytes=[Text.Encoding]::UTF8.GetBytes($payload);$seg=[ArraySegment[byte]]::new($bytes)
          [void]$ws.SendAsync($seg,[Net.WebSockets.WebSocketMessageType]::Text,$true,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          Start-Sleep -Milliseconds 350
          $ws.Dispose()
          Write-Output CONTEXT_RESOLVER_INVOKED
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\\Users\\${win_user}\\AppData\\Local\\Temp\\mrscrap-context-ready-probe.ps1"

          terminal=0
          logs=""
          for i in $(seq 1 65); do
            logs="$($adb -s "$serial" logcat -d -v brief -s MRSCRAP_FLOW:I MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' || true)"
            if printf '%s\n' "$logs" | grep -Eq 'event=collect_source_(success|error) platform=facebook'; then terminal=1; break; fi
            sleep 1
          done
          echo CONTEXT_READY_SAFE_TRACE_BEGIN
          printf '%s\n' "$logs" | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' | grep -E 'collect_source_|graphql_(load_start|page_started|page_finished|stage|result|error|timeout)' | tail -n180 || true
          echo CONTEXT_READY_SAFE_TRACE_END
          "$adb" -s "$serial" forward --remove tcp:19222 >/dev/null 2>&1 || true
          test "$terminal" = 1
          if printf '%s\n' "$logs" | grep -Eq 'event=graphql_result posts=[1-9][0-9]*'; then
            printf '%s\n' "$logs" | grep -q 'event=collect_source_success platform=facebook'
            echo CONTEXT_READY_PHYSICAL_COLLECTOR_PASS
          else
            echo CONTEXT_READY_NO_POSTS
            exit 1
          fi
