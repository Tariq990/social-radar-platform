name: Current Android Collector Surface Trace

on:
  push:
    branches: [test/android-physical-fix-20260909]
    paths: [.github/workflows/android-current-target-diagnostic.yml]

permissions:
  contents: read

jobs:
  trace:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 4
    steps:
      - name: Invoke collector and trace safe WebView surface categories
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-platform-tools/platform-tools/adb.exe"
          serial=""
          for i in $(seq 1 30); do
            serial="$($adb devices 2>/dev/null | tr -d '\r' | awk 'NR>1 && $2=="device" {print $1; exit}')"
            [ -n "$serial" ] && break
            sleep 1
          done
          test -n "$serial"
          echo "::add-mask::$serial"
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_FLOW I || true
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_COLLECTOR I || true
          "$adb" -s "$serial" shell am start -n com.mrscrap.socialradar/.MainActivity >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell dumpsys package com.mrscrap.socialradar | tr -d '\r' | grep -E 'versionCode=|versionName=' | head -n4
          "$adb" -s "$serial" logcat -c

          pid=""
          socket_name=""
          for i in $(seq 1 30); do
            pid="$($adb -s "$serial" shell pidof com.mrscrap.socialradar 2>/dev/null | tr -d '\r' | awk '{print $1}')"
            if [ -n "$pid" ]; then
              socket_name="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | grep -o "webview_devtools_remote_${pid}" | head -n1 || true)"
              [ -n "$socket_name" ] && break
            fi
            sleep 1
          done
          test -n "$socket_name"
          "$adb" -s "$serial" forward --remove tcp:19222 >/dev/null 2>&1 || true
          "$adb" -s "$serial" forward tcp:19222 "localabstract:${socket_name}" >/dev/null

          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-surface-trace.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Get-Targets {
            try { return @(Invoke-RestMethod -Uri 'http://127.0.0.1:19222/json' -TimeoutSec 3) } catch { return @() }
          }
          function Category([string]$raw) {
            if([string]::IsNullOrWhiteSpace($raw)){return 'blank'}
            try {
              $uri=[Uri]$raw
              $h=[string]$uri.Host
              if($uri.Scheme -eq 'about' -or [string]::IsNullOrWhiteSpace($h)){return 'blank'}
              if($h -eq 'localhost' -or $h -eq '127.0.0.1'){return 'localhost'}
              if($h -match '(^|\.)facebook\.com$'){return 'facebook'}
              if($h -match '(^|\.)instagram\.com$'){return 'instagram'}
              return 'other'
            } catch { return 'other' }
          }
          $main=$null
          $deadline=[DateTime]::UtcNow.AddSeconds(25)
          while([DateTime]::UtcNow -lt $deadline -and -not $main){
            $targets=Get-Targets
            $main=$targets|Where-Object {
              $_.type -eq 'page' -and (Category([string]$_.url)) -eq 'localhost'
            }|Select-Object -First 1
            if(-not $main){Start-Sleep -Milliseconds 500}
          }
          if(-not $main){throw 'LOCALHOST_TARGET_NOT_READY'}
          Write-Output LOCALHOST_TARGET_READY
          $wsurl=([string]$main.webSocketDebuggerUrl) -replace '^ws://localhost:','ws://127.0.0.1:'
          $ws=[System.Net.WebSockets.ClientWebSocket]::new();$ws.Options.Proxy=$null
          [void]$ws.ConnectAsync([Uri]$wsurl,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          $expr="(() => { window.Capacitor.nativePromise('AuthenticatedSocialSession','collectSource',{sourceId:'surface-trace-diagnostic',url:'https://www.facebook.com/tarik.ziad.3914',platform:'facebook',limit:10}).catch(()=>null); return 'started'; })()"
          $payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true}}|ConvertTo-Json -Depth 10 -Compress
          $bytes=[Text.Encoding]::UTF8.GetBytes($payload);$seg=[ArraySegment[byte]]::new($bytes)
          [void]$ws.SendAsync($seg,[Net.WebSockets.WebSocketMessageType]::Text,$true,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          Start-Sleep -Milliseconds 350
          $ws.Dispose()
          Write-Output COLLECTOR_INVOKED

          $traceDeadline=[DateTime]::UtcNow.AddSeconds(34)
          $last=''
          $states=0
          $maxTargets=0
          $sawFacebook=$false
          $sawBlank=$false
          $sawOther=$false
          while([DateTime]::UtcNow -lt $traceDeadline){
            $targets=Get-Targets
            if($targets.Count -gt $maxTargets){$maxTargets=$targets.Count}
            $cats=@()
            foreach($t in $targets){
              if($t.type -ne 'page'){continue}
              $c=Category([string]$t.url)
              $cats += $c
              if($c -eq 'facebook'){$sawFacebook=$true}
              elseif($c -eq 'blank'){$sawBlank=$true}
              elseif($c -eq 'other'){$sawOther=$true}
            }
            $signature=(($cats|Sort-Object) -join ',')
            if($signature -ne $last -and $states -lt 20){
              $states++
              Write-Output ('TARGET_STATE_' + $states + '=' + $(if($signature){$signature}else{'none'}))
              $last=$signature
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Output ('TARGET_MAX=' + $maxTargets)
          Write-Output ('TARGET_SAW_FACEBOOK=' + $(if($sawFacebook){1}else{0}))
          Write-Output ('TARGET_SAW_BLANK=' + $(if($sawBlank){1}else{0}))
          Write-Output ('TARGET_SAW_OTHER=' + $(if($sawOther){1}else{0}))
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\\Users\\${win_user}\\AppData\\Local\\Temp\\mrscrap-surface-trace.ps1"

          echo NATIVE_SAFE_TRACE_BEGIN
          "$adb" -s "$serial" logcat -d -v brief -s MRSCRAP_FLOW:I MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' | grep -E 'collect_source_|graphql_(load_start|page_started|page_finished|stage|result|error|timeout)' | tail -n200 || true
          echo NATIVE_SAFE_TRACE_END
          "$adb" -s "$serial" forward --remove tcp:19222 >/dev/null 2>&1 || true
