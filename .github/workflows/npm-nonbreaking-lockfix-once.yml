name: NPM nonbreaking lockfix once

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
    paths:
      - '.github/workflows/npm-nonbreaking-lockfix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 1
          clean: true

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Apply nonbreaking lockfile-only audit fixes
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.before.json"
          python3 - <<'PY' > "$RUNNER_TEMP/cap-major-before"
          import json
          d=json.load(open('package-lock.json', encoding='utf-8'))
          v=((d.get('packages') or {}).get('node_modules/@capacitor/cli') or {}).get('version','')
          print(v.split('.',1)[0])
          PY

          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          audit_fix_rc=$?
          set -e

          cmp -s package.json "$RUNNER_TEMP/package.before.json"
          python3 - <<'PY'
          import json
          before=open(__import__('os').environ['RUNNER_TEMP']+'/cap-major-before', encoding='utf-8').read().strip()
          d=json.load(open('package-lock.json', encoding='utf-8'))
          v=((d.get('packages') or {}).get('node_modules/@capacitor/cli') or {}).get('version','')
          after=v.split('.',1)[0]
          assert before and after and before == after, (before, after)
          print('CAPACITOR_CLI_MAJOR_UNCHANGED=1')
          PY

          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo LOCKFILE_CHANGED=0
          else
            test "$changed" = "package-lock.json"
            echo LOCKFILE_CHANGED=1
          fi
          echo "NPM_AUDIT_FIX_EXIT=$audit_fix_rc"

          set +e
          npm audit --json > "$RUNNER_TEMP/mrscrap-audit-after.json" 2>/dev/null
          audit_rc=$?
          set -e
          python3 - "$RUNNER_TEMP/mrscrap-audit-after.json" "$audit_rc" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('error'):
              print('NPM_AUDIT_FETCH=FAIL')
              raise SystemExit(2)
          counts=((data.get('metadata') or {}).get('vulnerabilities') or {})
          for sev in ('low','moderate','high','critical','total'):
              print(f'NPM_AUDIT_{sev.upper()}={int(counts.get(sev,0) or 0)}')
          print(f'NPM_AUDIT_COMMAND_EXIT={int(sys.argv[2])}')
          print('NPM_AUDIT_FETCH=PASS')
          PY

          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git diff --cached --check
            git commit -m 'fix: apply nonbreaking npm audit lockfile updates'
            git push origin HEAD:test/android-headless-emulator-20260909
          fi
