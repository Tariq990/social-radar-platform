name: Android v157 Collection State Diagnostic

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v157-collection-state-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar
    steps:
      - name: Diagnose source state and direct collection safely
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"
          test -n "$serial"
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"
          test "$version" = 157
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_PRESENT=1
          curl -fsS --max-time 30 https://mr-scrap-api-live.onrender.com/api/health >/dev/null || true
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 12
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"
          test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "(_|^)${pid}$" | head -n1 || true)"
          test -n "$socket"
          port=9230
          $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true
          $adb -s "$serial" forward tcp:$port "localabstract:$socket" >/dev/null
          $adb -s "$serial" logcat -c >/dev/null 2>&1 || true
          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-v157-state.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          $port=9230
          function Target {
            for($i=0;$i -lt 120;$i++){
              try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{}
              Start-Sleep -Milliseconds 250
            }
            throw 'app target missing'
          }
          function Eval([string]$expr,[int]$seconds=300){
            $t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds))
            $ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null
            $payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 12
            $bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null
            $buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new()
            while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}
          }
          $expr=@'
          (async()=>{
            const safe=v=>String(v||'').split('|')[0].replace(/[^A-Za-z0-9_.: -]/g,'_').slice(0,100);
            const out={connected:false,source:false,paused:false,backendNameGeneric:false,backendAvatar:false,direct:{ok:false,count:0,media:false,error:''}};
            const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;if(!cap)return out;
            try{const s=await cap.status();out.connected=s?.facebookConnected===true||s?.connected===true;}catch{}
            let rows=[];for(let i=0;i<10;i++){try{const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(r.ok){rows=await r.json();if(Array.isArray(rows)&&rows.length)break}}catch{};await new Promise(r=>setTimeout(r,600))}
            const src=(Array.isArray(rows)?rows:[]).find(x=>x&&x.platform==='facebook'&&((x.connector_type||x.connectorType||'device_session')==='device_session'))||null;
            out.source=Boolean(src);if(!src)return out;
            out.paused=src.is_paused===true||src.isPaused===true;
            const external=String(src.external_id||src.externalId||'').trim().replace(/^@/,'').toLowerCase();const handle=String(src.handle||'').trim().replace(/^@/,'').toLowerCase();const name=String(src.name||src.displayName||'').trim().replace(/^@/,'').toLowerCase();
            out.backendNameGeneric=!name||['facebook','instagram','page','profile',external,handle].filter(Boolean).includes(name);out.backendAvatar=Boolean(String(src.avatar_url||src.avatarUrl||'').trim());
            try{const r=await cap.collectSource({sourceId:src.id,url:src.url,platform:'facebook',limit:10});const p=Array.isArray(r?.posts)?r.posts:[];out.direct={ok:true,count:p.length,media:p.some(x=>Array.isArray(x?.media)&&x.media.some(m=>m&&/^https?:\/\//i.test(String(m.url||'')))),error:''};}catch(e){out.direct={ok:false,count:0,media:false,error:safe(e?.message||e)}}
            return out;
          })()
          '@
          $r=Eval $expr 300
          Write-Output ('FACEBOOK_CONNECTED='+$(if($r.connected){'1'}else{'0'}))
          Write-Output ('FACEBOOK_DEVICE_SOURCE='+$(if($r.source){'1'}else{'0'}))
          Write-Output ('FACEBOOK_SOURCE_PAUSED='+$(if($r.paused){'1'}else{'0'}))
          Write-Output ('BACKEND_SOURCE_NAME_GENERIC='+$(if($r.backendNameGeneric){'1'}else{'0'}))
          Write-Output ('BACKEND_SOURCE_HAS_AVATAR='+$(if($r.backendAvatar){'1'}else{'0'}))
          Write-Output ('DIRECT_COLLECT_OK='+$(if($r.direct.ok){'1'}else{'0'}))
          Write-Output ('DIRECT_COLLECT_COUNT='+[int]$r.direct.count)
          Write-Output ('DIRECT_COLLECT_MEDIA='+$(if($r.direct.media){'1'}else{'0'}))
          if($r.direct.error){Write-Output ('DIRECT_COLLECT_ERROR='+[string]$r.direct.error)}
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          logs="$($adb -s "$serial" logcat -d -v brief MRSCRAP_FLOW:I MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' || true)"
          echo "COLLECT_SUCCESS_COUNT=$(printf '%s\n' "$logs" | grep -c 'event=collect_source_success' || true)"
          echo "COLLECT_ERROR_COUNT=$(printf '%s\n' "$logs" | grep -c 'event=collect_source_error' || true)"
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_DIAGNOSTIC=1
          rm -f "$ps1" 2>/dev/null || true
          $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true
          echo V157_COLLECTION_STATE_DIAGNOSTIC_COMPLETE=1
