name: Android WorkManager Process-Death Emulator Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-workmanager-process-death-final-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 18
    env:
      PKG: com.mrscrap.socialradar
      EXPECTED_VERSION_CODE: '154'
      BACKEND: https://mr-scrap-api-live.onrender.com

    steps:
      - name: Checkout exact test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 1
          clean: false

      - name: Fail closed on WorkManager privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          worker='android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedSourceWorker.java'
          plugin='android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedSocialSessionPlugin.java'
          grep -q 'DeviceCredentialStore.token(getApplicationContext())' "$worker"
          grep -q 'new URL(base + "/api/device/ingest")' "$worker"
          grep -q 'setRequestProperty("Authorization", "Bearer " + authToken)' "$worker"
          grep -q 'MINIMUM_INTERVAL_MINUTES = 15' "$plugin"
          if grep -q 'CookieManager' "$worker"; then exit 250; fi
          if grep -E -q 'KEY_.*TOKEN|putString\([^)]*[Tt]oken' "$plugin"; then exit 251; fi
          echo WORKMANAGER_PRIVACY_BOUNDARY=PASS

      - name: Resolve v154 emulator and launch app
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -s "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = "$EXPECTED_VERSION_CODE"
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 8
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"; echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo FACEBOOK_SESSION_METADATA_PRESENT=1

      - name: Attach safe CDP bridge
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9227 >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:9227 "localabstract:$socket" >/dev/null
          echo CDP_BRIDGE=PASS

      - name: Clean stale probe fail-closed
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-wm-final-clean-first.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets { for($i=0;$i -lt 40;$i++){ try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9227/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'targets unavailable' }
          function AppTarget { $a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1);if($a.Count -eq 0){throw 'app target missing'};return $a[0] }
          function Eval([string]$raw,[string]$expr,[int]$seconds=90){$u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]('ws://127.0.0.1:9227'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 65536;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};return $m.result.result.value}}
          $app=AppTarget
          $expr=@'
          (async()=>{const base='https://mr-scrap-api-live.onrender.com';const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;const r=await fetch(base+'/api/sources',{credentials:'include'});let s=null;try{s=await r.json()}catch{};if(!r.ok||!Array.isArray(s))return{ok:false,stage:'sources'};const probes=s.filter(x=>typeof x?.external_id==='string'&&x.external_id.startsWith('wmprobe_emulator_'));const id=localStorage.getItem('mrscrap_wm_probe_source_id')||'';if(probes.length>0&&!id)return{ok:false,stage:'orphan_without_id',before:probes.length};if(probes.length>1)return{ok:false,stage:'multiple_orphans',before:probes.length};let cancelled=true,deleted=true;if(id){if(cap){try{const c=await cap.cancelSource({sourceId:id});cancelled=c?.cancelled===true}catch{cancelled=false}}const d=await fetch(base+'/api/sources/'+encodeURIComponent(id),{method:'DELETE',credentials:'include'});deleted=d.ok||d.status===404;if(cancelled&&deleted){localStorage.removeItem('mrscrap_wm_probe_source_id');localStorage.removeItem('mrscrap_wm_probe_first_checked')}}const vr=await fetch(base+'/api/sources',{credentials:'include'});let v=null;try{v=await vr.json()}catch{};const left=vr.ok&&Array.isArray(v)?v.filter(x=>typeof x?.external_id==='string'&&x.external_id.startsWith('wmprobe_emulator_')).length:-1;return{ok:cancelled&&deleted&&left===0,stage:'done',before:probes.length,hadId:Boolean(id),left}})()
          '@
          $r=Eval ([string]$app.webSocketDebuggerUrl) $expr 90
          Write-Output ('STALE_PROBE_STAGE='+[string]$r.stage);if($null-ne$r.before){Write-Output ('STALE_PROBE_COUNT_BEFORE='+[int]$r.before)};if($null-ne$r.left){Write-Output ('STALE_PROBE_COUNT_AFTER='+[int]$r.left)}
          if(!$r.ok){exit 252};Write-Output STALE_PROBE_CLEAN=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Snapshot jobs and local check baseline
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" shell dumpsys jobscheduler 2>/dev/null | tr -d '\r' > "$RUNNER_TEMP/wm-jobs-before.txt"
          grep -E "${PKG}/androidx\.work\.impl\.background\.systemjob\.SystemJobService" "$RUNNER_TEMP/wm-jobs-before.txt" | sed -n 's/.*\/\([0-9][0-9]*\):.*/\1/p' | sort -un > "$RUNNER_TEMP/wm-job-ids-before.txt"
          line="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' | grep 'last_checked_at' | head -n1 || true)"
          if [ -n "$line" ]; then h="$(printf '%s' "$line"|sha256sum|awk '{print $1}')"; else h=NONE; fi
          echo "WM_INITIAL_HASH=$h" >> "$GITHUB_ENV"
          echo "WORKMANAGER_SYSTEM_JOBS_BEFORE=$(wc -l < "$RUNNER_TEMP/wm-job-ids-before.txt"|tr -d ' ')"
          echo LOCAL_CHECK_BASELINE_CAPTURED=1

      - name: Create isolated rule-free probe and schedule WorkManager
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-wm-final-create.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets { for($i=0;$i -lt 40;$i++){try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9227/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'targets unavailable'}
          function AppTarget{$a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1);if($a.Count -eq 0){throw 'app target missing'};$a[0]}
          function Eval([string]$raw,[string]$expr,[int]$seconds=120){$u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]('ws://127.0.0.1:9227'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 65536;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};return $m.result.result.value}}
          $app=AppTarget
          $expr=@'
          (async()=>{const base='https://mr-scrap-api-live.onrender.com';const j=async r=>{try{return await r.json()}catch{return null}};const[rr,ar,sr]=await Promise.all([fetch(base+'/api/rules',{credentials:'include'}),fetch(base+'/api/alerts',{credentials:'include'}),fetch(base+'/api/sources',{credentials:'include'})]);if(!rr.ok||!ar.ok||!sr.ok)return{stage:'backend'};const rules=await j(rr),alerts=await j(ar),sources=await j(sr);const enabled=(Array.isArray(rules)?rules:[]).filter(x=>x&&Boolean(x.enabled));const globalEnabled=enabled.filter(x=>{const ids=Array.isArray(x.source_ids)?x.source_ids:Array.isArray(x.sourceIds)?x.sourceIds:[];return ids.length===0}).length;const alertCount=Array.isArray(alerts)?alerts.length:-1;const source=(Array.isArray(sources)?sources:[]).find(x=>x&&x.platform==='facebook'&&!Boolean(x.is_paused??x.isPaused)&&(x.connector_type||x.connectorType||'device_session')==='device_session');const leftovers=(Array.isArray(sources)?sources:[]).filter(x=>typeof x?.external_id==='string'&&x.external_id.startsWith('wmprobe_emulator_')).length;const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;if(!source||!cap)return{stage:'prereq'};const st=await cap.status();const facebook=st?.facebookConnected===true||(st?.facebookConnected==null&&st?.connected===true);const auth=await cap.getBackendAuth();const authConfigured=auth?.configured===true&&typeof auth?.token==='string'&&auth.token.length>=24;if(globalEnabled!==0||alertCount!==0||leftovers!==0)return{stage:'unsafe',enabledRules:enabled.length,globalEnabled,alertCount,leftovers,facebook,authConfigured};if(!facebook||!authConfigured)return{stage:'auth',facebook,authConfigured};const externalId='wmprobe_emulator_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);const cr=await fetch(base+'/api/sources',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'facebook',externalId,url:source.url,name:'WorkManager Emulator Probe',handle:'',avatarUrl:'',visibilityType:'authenticated',connectorType:'device_session'})});const created=await j(cr);if(!cr.ok||typeof created?.id!=='string')return{stage:'create',status:cr.status};localStorage.setItem('mrscrap_wm_probe_source_id',created.id);localStorage.removeItem('mrscrap_wm_probe_first_checked');const sch=await cap.scheduleSource({sourceId:created.id,url:source.url,platform:'facebook',backendBaseUrl:base,locale:'en'});return{stage:'scheduled',enabledRules:enabled.length,globalEnabled,alertCount,facebook,authConfigured,created:true,scheduled:sch?.scheduled===true,interval:Number(sch?.minimumIntervalMinutes||0)}})()
          '@
          $r=Eval ([string]$app.webSocketDebuggerUrl) $expr 120
          Write-Output ('PROBE_STAGE='+[string]$r.stage);if($null-ne$r.enabledRules){Write-Output ('ENABLED_RULES='+[int]$r.enabledRules)};if($null-ne$r.globalEnabled){Write-Output ('GLOBAL_ENABLED_RULES='+[int]$r.globalEnabled)};if($null-ne$r.alertCount){Write-Output ('ALERTS_BEFORE='+[int]$r.alertCount)};Write-Output ('FACEBOOK_SESSION_CONNECTED='+$(if($r.facebook){'1'}else{'0'}));Write-Output ('DEVICE_AUTH_CONFIGURED='+$(if($r.authConfigured){'1'}else{'0'}));Write-Output ('WORKMANAGER_SCHEDULED='+$(if($r.scheduled){'1'}else{'0'}));if($null-ne$r.interval){Write-Output ('WORKMANAGER_MIN_INTERVAL='+[int]$r.interval)}
          if([string]$r.stage -ne 'scheduled' -or !$r.created -or !$r.scheduled -or [int]$r.interval -ne 15){exit 253};Write-Output WORKMANAGER_ISOLATED_SCHEDULE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Wait for first probe worker 2xx without using WebView
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for i in $(seq 1 150); do
            line="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' | grep 'last_checked_at' | head -n1 || true)"
            if [ -n "$line" ]; then now="$(printf '%s' "$line"|sha256sum|awk '{print $1}')"; else now=NONE; fi
            if [ "$now" != NONE ] && [ "$now" != "$WM_INITIAL_HASH" ]; then changed=1; break; fi
            sleep 1
          done
          echo "INITIAL_LOCAL_LAST_CHECKED_CHANGED=$changed"; test "$changed" -eq 1
          echo INITIAL_WORKER_LOCAL_2XX_MARKER=PASS

      - name: Reopen clean UI and pin first probe backend checkpoint
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 9
          pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"; [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9227 >/dev/null 2>&1 || true; $ADB -s "$SERIAL" forward tcp:9227 "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-wm-final-pin.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets{for($i=0;$i -lt 40;$i++){try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9227/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'targets unavailable'}
          function AppTarget{$a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1);if($a.Count -eq 0){throw 'app target missing'};$a[0]}
          function Eval([string]$raw,[string]$expr){$u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(60));$ws.ConnectAsync([Uri]('ws://127.0.0.1:9227'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 65536;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};return $m.result.result.value}}
          $app=AppTarget
          $r=Eval ([string]$app.webSocketDebuggerUrl) "(async()=>{const id=localStorage.getItem('mrscrap_wm_probe_source_id')||'';if(!id)return{ok:false};const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});let s=null;try{s=await r.json()}catch{};const p=(Array.isArray(s)?s:[]).find(x=>x?.id===id);const c=p?.last_checked_at||p?.lastCheckedAt||'';if(!r.ok||!c)return{ok:false};localStorage.setItem('mrscrap_wm_probe_first_checked',String(c));return{ok:true}})()"
          Write-Output ('PROBE_FIRST_BACKEND_CHECKPOINT='+$(if($r.ok){'1'}else{'0'}));if(!$r.ok){exit 254};Write-Output FIRST_PROBE_BACKEND_CHECKPOINT=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          echo "APP_PID=$pid" >> "$GITHUB_ENV"

      - name: Resolve exact probe periodic job and second-run baseline
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" shell dumpsys jobscheduler 2>/dev/null | tr -d '\r' > "$RUNNER_TEMP/wm-jobs-after.txt"
          grep -E "${PKG}/androidx\.work\.impl\.background\.systemjob\.SystemJobService" "$RUNNER_TEMP/wm-jobs-after.txt" | sed -n 's/.*\/\([0-9][0-9]*\):.*/\1/p' | sort -un > "$RUNNER_TEMP/wm-job-ids-after.txt"
          mapfile -t ids < <(comm -13 "$RUNNER_TEMP/wm-job-ids-before.txt" "$RUNNER_TEMP/wm-job-ids-after.txt")
          echo "NEW_WORKMANAGER_SYSTEM_JOB_COUNT=${#ids[@]}"; test "${#ids[@]}" -eq 1
          echo "WM_JOB_ID=${ids[0]}" >> "$GITHUB_ENV"
          line="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' | grep 'last_checked_at' | head -n1 || true)"; test -n "$line"
          echo "WM_SECOND_BASE_HASH=$(printf '%s' "$line"|sha256sum|awk '{print $1}')" >> "$GITHUB_ENV"
          echo PROBE_PERIODIC_JOB_RESOLVED=PASS

      - name: Kill app process then force exact probe WorkManager job
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" shell input keyevent 3 >/dev/null 2>&1 || true; sleep 4
          absent=0
          for i in $(seq 1 20); do
            pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
            if [ -z "$pid" ]; then absent=1; break; fi
            $ADB -s "$SERIAL" shell am kill "$PKG" >/dev/null 2>&1 || true; sleep 1
          done
          if [ "$absent" -ne 1 ]; then pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; if [ -n "$pid" ]; then $ADB -s "$SERIAL" shell "run-as $PKG kill -9 $pid" >/dev/null 2>&1 || true; sleep 3; fi; pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; [ -z "$pid" ] && absent=1; fi
          echo "APP_PROCESS_ABSENT_BEFORE_FORCED_JOB=$absent"; test "$absent" -eq 1
          $ADB -s "$SERIAL" shell cmd jobscheduler run -f "$PKG" "$WM_JOB_ID" >/dev/null
          echo EXACT_PROBE_JOB_FORCE_REQUESTED=1

      - name: Prove process restart and second local 2xx marker
        shell: bash
        run: |
          set -euo pipefail
          started=0; changed=0
          for i in $(seq 1 150); do
            pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; [ -n "$pid" ] && started=1
            line="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' | grep 'last_checked_at' | head -n1 || true)"
            if [ -n "$line" ]; then now="$(printf '%s' "$line"|sha256sum|awk '{print $1}')"; else now=NONE; fi
            if [ "$now" != NONE ] && [ "$now" != "$WM_SECOND_BASE_HASH" ]; then changed=1; break; fi
            sleep 1
          done
          echo "APP_PROCESS_STARTED_BY_WORKMANAGER=$started"; echo "SECOND_LOCAL_LAST_CHECKED_CHANGED=$changed"
          test "$started" -eq 1; test "$changed" -eq 1
          echo WORKMANAGER_PROCESS_DEATH_RESTART_LOCAL_GATE=PASS

      - name: Verify second backend checkpoint zero alerts and cleanup probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADB:-}" ] || [ -z "${SERIAL:-}" ]; then exit 0; fi
          $ADB -s "$SERIAL" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
          sleep 9
          pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"; [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
