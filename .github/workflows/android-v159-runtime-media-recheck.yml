name: Android v159 Persisted Identity Recheck

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v159-runtime-media-recheck.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    env:
      PKG: com.mrscrap.socialradar
    steps:
      - name: Verify persisted identity on installed v159
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -x "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 159
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_PRESENT=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true; $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null; sleep 10
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"; [ -n "$socket" ] || socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          port=9241; $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true; $adb -s "$serial" forward tcp:$port "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-v159-identity-recheck.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9241
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=150){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 10;$bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id-ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}}
          $expr=@'
          (async()=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms));const norm=v=>String(v||'').normalize('NFKC').trim().replace(/^@/,'').toLowerCase();const generic=(name,s)=>{const n=norm(name);return !n||['facebook','instagram','page','profile','home',norm(s?.handle),norm(s?.external_id),norm(s?.externalId)].filter(Boolean).includes(n)};let rows=[];for(let i=0;i<30;i++){try{const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(r.ok){rows=await r.json();if(Array.isArray(rows)&&rows.length)break}}catch{}await sleep(500)}const s=(Array.isArray(rows)?rows:[]).find(x=>x?.platform==='facebook');if(!s)return{source:false};const rawName=String(s.name||s.displayName||'');const rawAvatar=String(s.avatar_url||s.avatarUrl||'');window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'watchlist'}}));let uiName=false,uiAvatar=false;for(let i=0;i<180;i++){const card=document.getElementById('source-card-'+s.id);if(card){const n=String(card.querySelector('h3')?.textContent||'');const img=card.querySelector('img');uiName=!generic(n,s);uiAvatar=Boolean(img&&img.complete&&img.naturalWidth>0);if(uiName&&uiAvatar)break}await sleep(500)}return{source:true,rawName:!generic(rawName,s),rawAvatar:/^https?:\/\//i.test(rawAvatar),uiName,uiAvatar}})()
          '@
          $r=Eval $expr 150
          Write-Output ('SOURCE_FOUND='+$(if($r.source){'1'}else{'0'}));Write-Output ('BACKEND_PERSISTED_REAL_NAME='+$(if($r.rawName){'1'}else{'0'}));Write-Output ('BACKEND_PERSISTED_AVATAR='+$(if($r.rawAvatar){'1'}else{'0'}));Write-Output ('SOURCE_UI_REAL_NAME_AFTER_RESTART='+$(if($r.uiName){'1'}else{'0'}));Write-Output ('SOURCE_UI_AVATAR_AFTER_RESTART='+$(if($r.uiAvatar){'1'}else{'0'}))
          if(!$r.source -or !$r.rawName -or !$r.rawAvatar -or !$r.uiName -or !$r.uiAvatar){exit 252}
          Write-Output V159_PERSISTED_SOURCE_IDENTITY_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true; rm -f "$ps1" 2>/dev/null || true
