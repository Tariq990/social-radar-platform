name: Patch Android DOM Navigation Lifecycle

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-patch-dom-navigation-lifecycle.yml]

permissions:
  contents: write

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 2
          clean: false

      - name: Apply exact lifecycle patch and push test lane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java')
          s=p.read_text()
          replacements={
            'private static final long PAGE_STARTED_EXTRACTION_DELAY_MS = 900;':
              'private static final long PAGE_STARTED_EXTRACTION_DELAY_MS = 3_000;',
            '''                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                    return !isAllowedSocialUrl(request.getUrl().toString());
                }
''':
            '''                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                    boolean blocked = !isAllowedSocialUrl(request.getUrl().toString());
                    if (blocked && request.isForMainFrame()) {
                        Log.w(TAG, "event=navigation_blocked class=" + safeUrlClass(request.getUrl().toString()) + " mainFrame=true");
                    }
                    return blocked;
                }
''',
            '''                public void onPageStarted(WebView view, String loadedUrl, android.graphics.Bitmap favicon) {
                    super.onPageStarted(view, loadedUrl, favicon);
                    if (!isAllowedSocialUrl(loadedUrl) || finished.get()) return;
                    Log.i(TAG, "event=page_started progress=" + view.getProgress() +
                        " attached=" + view.isAttachedToWindow());
''':
            '''                public void onPageStarted(WebView view, String loadedUrl, android.graphics.Bitmap favicon) {
                    super.onPageStarted(view, loadedUrl, favicon);
                    Log.i(TAG, "event=page_started class=" + safeUrlClass(loadedUrl) +
                        " progress=" + view.getProgress() + " attached=" + view.isAttachedToWindow());
                    if (!isAllowedSocialUrl(loadedUrl) || finished.get()) return;
''',
            '''                public void onPageFinished(WebView view, String loadedUrl) {
                    super.onPageFinished(view, loadedUrl);
                    if (!isAllowedSocialUrl(loadedUrl) || finished.get()) return;
                    Log.i(TAG, "event=page_finished progress=" + view.getProgress() +
                        " attached=" + view.isAttachedToWindow());
''':
            '''                public void onPageFinished(WebView view, String loadedUrl) {
                    super.onPageFinished(view, loadedUrl);
                    Log.i(TAG, "event=page_finished class=" + safeUrlClass(loadedUrl) +
                        " progress=" + view.getProgress() + " attached=" + view.isAttachedToWindow());
                    if (!isAllowedSocialUrl(loadedUrl) || finished.get()) return;
''',
            '''            Log.i(TAG, "event=load_start attached=" + webView.isAttachedToWindow());
            webView.loadUrl(desktopUrl);
''':
            '''            Log.i(TAG, "event=load_start class=" + safeUrlClass(desktopUrl) +
                " attached=" + webView.isAttachedToWindow());
            webView.loadUrl(desktopUrl);
''',
            '''    private static boolean isBlank(String value) {
''':
            '''    private static String safeUrlClass(String rawUrl) {
        if (rawUrl == null || rawUrl.isBlank() || "about:blank".equalsIgnoreCase(rawUrl)) return "blank";
        try {
            Uri uri = Uri.parse(rawUrl);
            String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
            String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
            if (host.equals("facebook.com") || host.endsWith(".facebook.com") ||
                host.equals("fb.com") || host.endsWith(".fb.com") || host.equals("fb.watch")) return "facebook";
            if (host.equals("instagram.com") || host.endsWith(".instagram.com") ||
                host.equals("instagr.am") || host.endsWith(".instagr.am")) return "instagram";
            if ("http".equals(scheme) || "https".equals(scheme)) return "other_web";
            return scheme.isBlank() ? "other" : "other_scheme";
        } catch (Exception ignored) {
            return "other";
        }
    }

    private static boolean isBlank(String value) {
'''
          }
          for old,new in replacements.items():
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'preimage mismatch count={count}: {old[:80]!r}')
              s=s.replace(old,new,1)
          p.write_text(s)
          print('DOM_INITIAL_EVAL_DELAY_MS=3000')
          print('SAFE_NAVIGATION_LOGGING=1')
          PY
          git diff --check
          git diff -- android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java
          git config user.name 'Tariq Ziad'
          git config user.email '102293222+Tariq990@users.noreply.github.com'
          git add android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java
          git commit -m 'fix: wait for Facebook navigation before DOM extraction'
          git push origin HEAD:test/android-headless-emulator-20260909
          echo DOM_LIFECYCLE_PATCH_PUSHED=1
