name: Android v159 Source Identity Cache Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v159-source-identity-cache-proof.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  patch-build-prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      PKG: com.mrscrap.socialradar
      ANDROID_VERSION_CODE: '159'
      ANDROID_VERSION_NAME: '0.1.159-emulator-test'
    steps:
      - name: Checkout exact test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 0
          clean: false

      - name: Patch UI state to consume safe persisted identity cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          radar=Path('src/context/RadarContext.tsx')
          s=radar.read_text()
          imp="import { extractSupportedSocialUrl } from '../lib/socialUrl';\n"
          add="import { isGenericSourceIdentityName, mergeCachedSourceIdentity, rememberSourceIdentity } from '../lib/sourceIdentityCache';\n"
          if add not in s:
              assert s.count(imp)==1
              s=s.replace(imp,imp+add,1)

          old="""function isGenericVisibleSourceName(value: string | undefined, source: Pick<Source, 'externalId' | 'handle'>): boolean {
  const normalize = (input?: string) => (input || '').trim().replace(/^@/, '').toLowerCase();
  const name = normalize(value);
  const generic = new Set(['facebook', 'instagram', 'page', 'profile', normalize(source.externalId), normalize(source.handle)].filter(Boolean));
  return !name || generic.has(name);
}
"""
          new="""function isGenericVisibleSourceName(value: string | undefined, source: Pick<Source, 'externalId' | 'handle'>): boolean {
  return isGenericSourceIdentityName(value, source);
}
"""
          if old in s:
              s=s.replace(old,new,1)

          old="""  return {
    ...source,
    displayName: metadata.displayName?.trim() || source.displayName,
    avatarUrl: metadata.avatarUrl?.trim() || source.avatarUrl,
    handle: metadata.handle?.trim() || source.handle
  };
}
"""
          new="""  const healed = {
    ...source,
    displayName: metadata.displayName?.trim() || source.displayName,
    avatarUrl: metadata.avatarUrl?.trim() || source.avatarUrl,
    handle: metadata.handle?.trim() || source.handle
  };
  rememberSourceIdentity(healed);
  return healed;
}
"""
          if old in s:
              s=s.replace(old,new,1)

          old="""        setSources(previous => previous.map(item => item.id === source.id ? {
          ...item,
          displayName: realName || item.displayName,
          avatarUrl: avatarUrl || item.avatarUrl,
          handle: resolved.handle?.trim() || item.handle,
          connectorStatus: 'authenticated_monitoring'
        } : item));
"""
          new="""        const healedIdentity: Source = {
          ...source,
          displayName: realName || source.displayName,
          avatarUrl: avatarUrl || source.avatarUrl,
          handle: resolved.handle?.trim() || source.handle,
          connectorStatus: 'authenticated_monitoring'
        };
        rememberSourceIdentity(healedIdentity);
        setSources(previous => previous.map(item => item.id === source.id ? {
          ...item,
          displayName: realName || item.displayName,
          avatarUrl: avatarUrl || item.avatarUrl,
          handle: resolved.handle?.trim() || item.handle,
          connectorStatus: 'authenticated_monitoring'
        } : item));
"""
          if old in s:
              s=s.replace(old,new,1)

          old="""      const hydratedSources = dbSources.map(source => ({
"""
          new="""      const cachedSources = dbSources.map(mergeCachedSourceIdentity);
      const hydratedSources = cachedSources.map(source => ({
"""
          if old in s:
              s=s.replace(old,new,1)

          old="""    const persistedSource = await apiCreateSource({
      platform: sourceData.platform, externalId: sourceData.externalId, url: sourceData.url, name: sourceData.displayName,
      handle: sourceData.handle, avatarUrl: sourceData.avatarUrl, bio: sourceData.bio, visibilityType: sourceData.visibilityType, connectorType: sourceData.connectorType
    });
"""
          new="""    let persistedSource = await apiCreateSource({
      platform: sourceData.platform, externalId: sourceData.externalId, url: sourceData.url, name: sourceData.displayName,
      handle: sourceData.handle, avatarUrl: sourceData.avatarUrl, bio: sourceData.bio, visibilityType: sourceData.visibilityType, connectorType: sourceData.connectorType
    });
    rememberSourceIdentity({ ...persistedSource, ...sourceData });
    persistedSource = mergeCachedSourceIdentity(persistedSource);
"""
          if old in s:
              s=s.replace(old,new,1)

          required=[add.strip(),'return isGenericSourceIdentityName(value, source);','rememberSourceIdentity(healed);','const healedIdentity: Source = {','const cachedSources = dbSources.map(mergeCachedSourceIdentity);','rememberSourceIdentity({ ...persistedSource, ...sourceData });','persistedSource = mergeCachedSourceIdentity(persistedSource);']
          for token in required:
              assert token in s, token
          radar.write_text(s)

          modal=Path('src/components/ExtractedPostsModal.tsx')
          m=modal.read_text()
          imp2="import { apiFetchSources } from '../services/api';\n"
          add2="import { mergeCachedSourceIdentity } from '../lib/sourceIdentityCache';\n"
          if add2 not in m:
              assert m.count(imp2)==1
              m=m.replace(imp2,imp2+add2,1)
          m=m.replace("const [runtimeSources, setRuntimeSources] = useState<Source[]>(sources);","const [runtimeSources, setRuntimeSources] = useState<Source[]>(() => sources.map(mergeCachedSourceIdentity));",1)
          m=m.replace("useEffect(() => { if (sources.length > 0) setRuntimeSources(sources); }, [sources]);","useEffect(() => { if (sources.length > 0) setRuntimeSources(sources.map(mergeCachedSourceIdentity)); }, [sources]);",1)
          m=m.replace("if (Array.isArray(fresh) && fresh.length > 0) availableSources = fresh;","if (Array.isArray(fresh) && fresh.length > 0) availableSources = fresh.map(mergeCachedSourceIdentity);",1)
          m=m.replace("if (Array.isArray(retry) && retry.length > 0) availableSources = retry;","if (Array.isArray(retry) && retry.length > 0) availableSources = retry.map(mergeCachedSourceIdentity);",1)
          m=m.replace("setRuntimeSources(availableSources);","setRuntimeSources(availableSources.map(mergeCachedSourceIdentity));",1)
          for token in [add2.strip(),'sources.map(mergeCachedSourceIdentity)','fresh.map(mergeCachedSourceIdentity)','retry.map(mergeCachedSourceIdentity)','availableSources.map(mergeCachedSourceIdentity)']:
              assert token in m, token
          modal.write_text(m)

          tests=Path('server/tests/architectureRegression.test.ts')
          t=tests.read_text()
          marker="test('safe source identity cache heals legacy placeholder metadata across Android restarts'"
          if marker not in t:
              t += r'''

test('safe source identity cache heals legacy placeholder metadata across Android restarts', () => {
  const cache = read('src/lib/sourceIdentityCache.ts');
  const radar = read('src/context/RadarContext.tsx');
  const modal = read('src/components/ExtractedPostsModal.tsx');
  assert.match(cache, /mrscrap_source_identity_cache_v1/);
  assert.match(cache, /interface CachedSourceIdentity[\s\S]*displayName\?: string;[\s\S]*avatarUrl\?: string;[\s\S]*handle\?: string;[\s\S]*updatedAt: number;/);
  assert.match(cache, /rememberSourceIdentity/);
  assert.match(cache, /mergeCachedSourceIdentity/);
  assert.doesNotMatch(cache, /token\s*\?:\s*string/);
  assert.doesNotMatch(cache, /cookie\s*\?:\s*string/i);
  assert.match(radar, /dbSources\.map\(mergeCachedSourceIdentity\)/);
  assert.match(radar, /rememberSourceIdentity\(healedIdentity\)/);
  assert.match(radar, /rememberSourceIdentity\(\{ \.\.\.persistedSource, \.\.\.sourceData \}\)/);
  assert.match(modal, /fresh\.map\(mergeCachedSourceIdentity\)/);
});
'''
          tests.write_text(t)
          print('V159_IDENTITY_CACHE_PATCH=PASS')
          PY
          git diff --check

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint test and commit v159 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x node_modules/.bin/tsc ] || [ ! -x node_modules/.bin/tsx ]; then npm install --no-audit --no-fund; fi
          npm run lint
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/sourceIdentityCache.ts src/context/RadarContext.tsx src/components/ExtractedPostsModal.tsx server/tests/architectureRegression.test.ts
          git diff --cached --check
          git diff --cached --quiet && { echo NO_V159_SOURCE_CHANGES=1; exit 1; }
          git commit -m 'fix: persist resolved source identity across Android restarts'
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:test/android-headless-emulator-20260909
          echo "V159_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "V159_SOURCE_COMMIT=$source_sha"
          echo V159_SOURCE_TEST_GATE=PASS

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build v159 from committed source
        shell: bash
        run: |
          set -euo pipefail
          npx vite build
          npx cap sync android
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"; sdk="$(realpath "$sdk")"
          test -d "$sdk/platforms/android-36"; test -d "$sdk/build-tools/36.0.0"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"; test -x "$gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"; test -s "$apk"
          test "$(git rev-parse HEAD)" = "$V159_SOURCE_SHA"
          echo "APK_SIZE=$(stat -c '%s' "$apk")"
          echo V159_BUILD_GATE=PASS

      - name: Install v159 preserving Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -x "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_BEFORE_V159_INSTALL=1
          tmp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MR-SCRAP-emulator-test-159.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$tmp"
          out="$($adb -s "$serial" install -r "$(wslpath -w "$tmp")" 2>&1 | tr -d '\r')"; printf '%s\n' "$out"; printf '%s' "$out" | grep -q Success
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 159
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_V159_INSTALL=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true; $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 12
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"; echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo V159_INSTALL_GATE=PASS

      - name: Prove real source identity plus extracted post media in actual UI
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"; [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          port=9239; $ADB -s "$SERIAL" forward --remove tcp:$port >/dev/null 2>&1 || true; $ADB -s "$SERIAL" forward tcp:$port "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v159-ui-proof.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9239
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=360){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 12;$bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}}
          $expr=@'
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const out={source:false,realName:false,realAvatar:false,cache:false,button:false,modal:false,error:false,cards:0,mediaCards:0,images:0,videos:0};
            let backend=[];for(let i=0;i<20;i++){try{const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(r.ok){backend=await r.json();if(Array.isArray(backend)&&backend.length)break}}catch{}await sleep(500)}
            const src=(Array.isArray(backend)?backend:[]).find(x=>x?.platform==='facebook');if(!src)return out;out.source=true;
            const handle=String(src.handle||'').replace(/^@/,'').trim().toLowerCase();
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'watchlist'}}));
            for(let i=0;i<180;i++){
              const card=document.getElementById('source-card-'+src.id);
              if(card){const name=String(card.querySelector('h3')?.textContent||'').trim();const img=card.querySelector('img');out.realName=Boolean(name)&&name.replace(/^@/,'').trim().toLowerCase()!==handle;out.realAvatar=Boolean(img&&/^https?:\/\//i.test(String(img.getAttribute('src')||'')));if(out.realName&&out.realAvatar)break}
              await sleep(500);
            }
            try{const c=JSON.parse(localStorage.getItem('mrscrap_source_identity_cache_v1')||'{}');out.cache=Boolean(c&&typeof c==='object'&&Object.keys(c).length>0)}catch{}
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));
            for(let i=0;i<60;i++){const b=document.getElementById('btn-extracted-posts-home');if(b){out.button=true;b.click();break}await sleep(250)}
            for(let i=0;i<80;i++){if(document.getElementById('modal-extracted-posts')){out.modal=true;break}await sleep(250)}
            if(out.modal){for(let i=0;i<300;i++){if(!document.getElementById('extracted-posts-loading'))break;await sleep(1000)}out.error=Boolean(document.getElementById('extracted-posts-error'));const cards=[...document.querySelectorAll('[data-extracted-post="1"]')];out.cards=cards.length;out.mediaCards=cards.filter(c=>Number(c.getAttribute('data-media-count')||'0')>0).length;out.images=document.querySelectorAll('[data-extracted-image="1"]').length;out.videos=document.querySelectorAll('[data-extracted-video="1"]').length;}
            return out;
          })()
          '@
          $r=Eval $expr 390
          Write-Output ('SOURCE_FOUND='+$(if($r.source){'1'}else{'0'}));Write-Output ('SOURCE_UI_REAL_NAME='+$(if($r.realName){'1'}else{'0'}));Write-Output ('SOURCE_UI_REAL_AVATAR='+$(if($r.realAvatar){'1'}else{'0'}));Write-Output ('SOURCE_IDENTITY_CACHE_PRESENT='+$(if($r.cache){'1'}else{'0'}));Write-Output ('EXTRACTED_POSTS_BUTTON='+$(if($r.button){'1'}else{'0'}));Write-Output ('EXTRACTED_POSTS_MODAL='+$(if($r.modal){'1'}else{'0'}));Write-Output ('EXTRACTED_POSTS_ERROR='+$(if($r.error){'1'}else{'0'}));Write-Output ('EXTRACTED_POST_CARDS='+[int]$r.cards);Write-Output ('EXTRACTED_MEDIA_CARDS='+[int]$r.mediaCards);Write-Output ('EXTRACTED_IMAGES='+[int]$r.images);Write-Output ('EXTRACTED_VIDEOS='+[int]$r.videos)
          if(!$r.source -or !$r.realName -or !$r.realAvatar -or !$r.cache -or !$r.button -or !$r.modal -or $r.error -or [int]$r.cards -lt 1 -or [int]$r.mediaCards -lt 1){exit 240}
          Write-Output V159_PRODUCT_UI_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Prove cached identity and Facebook session survive app restart
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 10
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          $ADB -s "$SERIAL" forward --remove tcp:9239 >/dev/null 2>&1 || true
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"; [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $ADB -s "$SERIAL" forward tcp:9239 "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v159-cache-restart.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9239
          function T {for($i=0;$i-lt 80;$i++){try{$r=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$r|Where-Object{$_.type-eq'page'-and[string]$_.url-like'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'target'}
          $t=T;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[Net.WebSockets.ClientWebSocket]::new();$ct=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(30));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$ct.Token).GetAwaiter().GetResult()|Out-Null;$e="(()=>{try{const c=JSON.parse(localStorage.getItem('mrscrap_source_identity_cache_v1')||'{}');return Boolean(c&&typeof c==='object'&&Object.keys(c).length>0)}catch{return false}})()";$p=@{id=1;method='Runtime.evaluate';params=@{expression=$e;returnByValue=$true}}|ConvertTo-Json -Compress -Depth 6;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[Net.WebSockets.WebSocketMessageType]::Text,$true,$ct.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 32768;while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$ct.Token).GetAwaiter().GetResult();$m=([Text.Encoding]::UTF8.GetString($buf,0,$r.Count)|ConvertFrom-Json);if($m.id-eq 1){$ok=[bool]$m.result.result.value;break}};Write-Output ('SOURCE_IDENTITY_CACHE_AFTER_RESTART='+$(if($ok){'1'}else{'0'}));if(!$ok){exit 241}
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          echo FACEBOOK_SESSION_AFTER_V159_RESTART=1
          echo V159_RESTART_PERSISTENCE_GATE=PASS

      - name: Cleanup probe files only
        if: always()
        shell: bash
        run: |
          if [ -n "${ADB:-}" ] && [ -n "${SERIAL:-}" ]; then $ADB -s "$SERIAL" forward --remove tcp:9239 >/dev/null 2>&1 || true; fi
          rm -f "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v159-ui-proof.ps1" "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v159-cache-restart.ps1" 2>/dev/null || true
