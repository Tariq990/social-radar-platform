name: Apply Exact Facebook Page ID Fix

on:
  push:
    branches: [test/android-physical-fix-20260909]
    paths: [.github/workflows/apply-facebook-exact-page-id-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Port reference get_page_id semantics exactly
        shell: bash
        env:
          OLD_DESKTOP_B64: 
          NEW_DESKTOP_B64: 
          RESOLVER_B64: 
          OLD_LOG_B64: 
          NEW_LOG_B64: 
        run: |
          set -euo pipefail
          git fetch origin test/android-physical-local-recovery-20260909
          git checkout -B physical-code-fix FETCH_HEAD
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('android/app/src/main/java/com/mrscrap/socialradar/FacebookGraphqlWebViewCollector.java')
          s=p.read_text(encoding='utf-8')
          old=base64.b64decode(os.environ['OLD_DESKTOP_B64']).decode()
          new=base64.b64decode(os.environ['NEW_DESKTOP_B64']).decode()
          if s.count(old)!=1: raise SystemExit('DESKTOP_URL_ANCHOR_MISMATCH')
          s=s.replace(old,new,1)
          start="              let sourceId = '';\n"
          end="              const cleanTitle = "
          a=s.index(start); b=s.index(end,a)
          s=s[:a]+base64.b64decode(os.environ['RESOLVER_B64']).decode()+s[b:]
          old_diag="diagnostics:{collector:'graphql', surface:host, pages, nodes, candidatesTried, winningCandidate}"
          new_diag="diagnostics:{collector:'graphql', surface:host, pages, nodes, candidatesTried, winningCandidate, resolverPattern}"
          if s.count(old_diag)!=1: raise SystemExit('DIAGNOSTIC_ANCHOR_MISMATCH')
          s=s.replace(old_diag,new_diag,1)
          old_log=base64.b64decode(os.environ['OLD_LOG_B64']).decode()
          new_log=base64.b64decode(os.environ['NEW_LOG_B64']).decode()
          if s.count(old_log)!=1: raise SystemExit('LOG_ANCHOR_MISMATCH')
          s=s.replace(old_log,new_log,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          export JAVA_HOME=/home/tarik/actions-runnerr/_work/_tool/Java_Temurin-Hotspot_jdk/21.0.12-101.0.LTS/x64
          export PATH="$JAVA_HOME/bin:/home/tarik/actions-runnerr/_work/_tool/node/22.23.2/x64/bin:$PATH"
          python3 scripts/verify-facebook-script.py
          git config user.name 'MR SCRAP Physical Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/java/com/mrscrap/socialradar/FacebookGraphqlWebViewCollector.java
          git commit -m 'fix: mirror reference Facebook page ID resolver'
          git push origin HEAD:test/android-physical-local-recovery-20260909
