name: Android Product v155 Runtime Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-product-v155-runtime-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  build-install-prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      PKG: com.mrscrap.socialradar
      PRODUCT_SOURCE_SHA: dd901ce6aa2d42790ae6a31add543db40f03acf0
      ANDROID_VERSION_CODE: '155'
      ANDROID_VERSION_NAME: '0.1.155-emulator-test'
    steps:
      - name: Checkout exact test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 0
          clean: false

      - name: Fail closed on committed product source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_SOURCE_SHA" HEAD
          grep -q 'btn-extracted-posts-home' src/screens/RadarHomeScreen.tsx
          grep -q 'data-extracted-post="1"' src/components/ExtractedPostsModal.tsx
          grep -q 'data-extracted-image="1"' src/components/ExtractedPostsModal.tsx
          grep -q 'data-extracted-video="1"' src/components/ExtractedPostsModal.tsx
          grep -q 'INCOMPLETE_SOURCE_METADATA' src/components/AddSourceModal.tsx
          grep -q 'includeMedia?: boolean' src/connectors/deviceSessionConnector.ts
          grep -q 'ForegroundWebViewHost.attachIfPossible' android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedSourceMetadataResolver.java
          grep -q 'AuthenticatedSourceMetadataResolver.resolve(foregroundContext()' android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedSocialSessionPlugin.java
          echo V155_COMMITTED_PRODUCT_SOURCE_GATE=PASS

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build v155 from committed source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x node_modules/.bin/vite ] || [ ! -x node_modules/.bin/cap ]; then npm install --no-audit --no-fund; fi
          npm run lint
          npm run build
          npx cap sync android
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          sdk="$(realpath "$sdk")"
          test -d "$sdk/platforms/android-36"
          test -d "$sdk/build-tools/36.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"
          test -x "$gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK_SIZE=$(stat -c '%s' "$apk")"
          echo V155_BUILD_GATE=PASS

      - name: Install v155 preserving app and Facebook data
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          test -s "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"
          test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_BEFORE_V155_INSTALL=1
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          tmp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MR-SCRAP-emulator-test-155.apk"
          cp "$apk" "$tmp"
          out="$($adb -s "$serial" install -r "$(wslpath -w "$tmp")" 2>&1 | tr -d '\r')"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q Success
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"
          test "$version" = 155
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_V155_INSTALL=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 8
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
          test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo V155_INSTALL_SESSION_GATE=PASS

      - name: Prove real source metadata and extracted posts media UI
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"
          test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:9223 "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v155-runtime-proof.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets {
            for($i=0;$i -lt 40;$i++){
              try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{}
              Start-Sleep -Milliseconds 250
            }
            throw 'targets unavailable'
          }
          function AppTarget {
            $a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1)
            if($a.Count -eq 0){throw 'app target missing'}
            return $a[0]
          }
          function Eval([string]$raw,[string]$expr,[int]$seconds=360){
            $u=[Uri]$raw
            $ws=[System.Net.WebSockets.ClientWebSocket]::new()
            $cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds))
            $ws.ConnectAsync([Uri]('ws://127.0.0.1:9223'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null
            $payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8
            $bytes=[Text.Encoding]::UTF8.GetBytes($payload)
            $ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null
            $buf=New-Object byte[] 262144
            $sb=[Text.StringBuilder]::new()
            while($true){
              $r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult()
              [void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count))
              if(!$r.EndOfMessage){continue}
              $m=$sb.ToString()|ConvertFrom-Json
              $sb.Clear()|Out-Null
              if($m.id -ne 1){continue}
              if($m.result.exceptionDetails){throw 'runtime eval exception'}
              $v=$m.result.result.value
              try{$ws.Abort()}catch{}
              return $v
            }
          }
          $app=AppTarget
          $expr=@'
          (async()=>{
            const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;
            if(!cap)return{plugin:false};
            const sr=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});
            if(!sr.ok)return{plugin:true,sources:false,http:sr.status};
            const rows=await sr.json();
            const source=(Array.isArray(rows)?rows:[]).find(x=>x&&x.platform==='facebook'&&(x.connector_type||x.connectorType||'device_session')==='device_session');
            if(!source)return{plugin:true,sources:true,source:false};
            let meta;
            try{meta=await cap.resolveSource({url:source.url});}catch(e){return{plugin:true,sources:true,source:true,meta:false};}
            const handle=String(meta?.handle||meta?.externalId||'').trim().replace(/^@/,'').toLowerCase();
            const name=String(meta?.displayName||'').trim();
            const normalized=name.replace(/^@/,'').toLowerCase();
            const realName=Boolean(name)&&!['facebook','instagram','page','profile'].includes(normalized)&&Boolean(!handle||normalized!==handle);
            const avatar=/^https?:\/\//i.test(String(meta?.avatarUrl||''));
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));
            for(let i=0;i<60&&!document.getElementById('btn-extracted-posts-home');i++)await new Promise(r=>setTimeout(r,200));
            const button=document.getElementById('btn-extracted-posts-home');
            if(!button)return{plugin:true,sources:true,source:true,meta:true,realName,avatar,button:false};
            button.click();
            for(let i=0;i<1200;i++){
              const modal=document.getElementById('modal-extracted-posts');
              const loading=document.getElementById('extracted-posts-loading');
              const error=document.getElementById('extracted-posts-error');
              const cards=document.querySelectorAll('[data-extracted-post="1"]');
              if(modal&&!loading&&(error||cards.length>0)){
                return{plugin:true,sources:true,source:true,meta:true,realName,avatar,button:true,modal:true,error:Boolean(error),cards:cards.length,mediaGrids:document.querySelectorAll('[data-extracted-media-grid="1"]').length,images:document.querySelectorAll('[data-extracted-image="1"]').length,videos:document.querySelectorAll('[data-extracted-video="1"]').length};
              }
              await new Promise(r=>setTimeout(r,250));
            }
            return{plugin:true,sources:true,source:true,meta:true,realName,avatar,button:true,modal:true,timeout:true};
          })()
          '@
          $r=Eval ([string]$app.webSocketDebuggerUrl) $expr 360
          Write-Output ('NATIVE_PLUGIN='+$(if($r.plugin){'1'}else{'0'}))
          Write-Output ('SOURCE_API_OK='+$(if($r.sources){'1'}else{'0'}))
          Write-Output ('FACEBOOK_DEVICE_SOURCE_FOUND='+$(if($r.source){'1'}else{'0'}))
          Write-Output ('SOURCE_METADATA_RESOLVED='+$(if($r.meta){'1'}else{'0'}))
          Write-Output ('SOURCE_REAL_NAME='+$(if($r.realName){'1'}else{'0'}))
          Write-Output ('SOURCE_REAL_AVATAR='+$(if($r.avatar){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_BUTTON='+$(if($r.button){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_MODAL='+$(if($r.modal){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_ERROR='+$(if($r.error){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_TIMEOUT='+$(if($r.timeout){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POST_CARDS='+[int]$r.cards)
          Write-Output ('EXTRACTED_MEDIA_GRIDS='+[int]$r.mediaGrids)
          Write-Output ('EXTRACTED_IMAGES='+[int]$r.images)
          Write-Output ('EXTRACTED_VIDEOS='+[int]$r.videos)
          if(!$r.plugin -or !$r.sources -or !$r.source -or !$r.meta -or !$r.realName -or !$r.avatar -or !$r.button -or !$r.modal -or $r.error -or $r.timeout -or [int]$r.cards -lt 1 -or [int]$r.mediaGrids -lt 1){exit 226}
          Write-Output PRODUCT_V155_REAL_IDENTITY_MEDIA_UI_GATE=PASS
          PS
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Reconfirm Facebook session and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ADB:-}" ] && [ -n "${SERIAL:-}" ]; then
            marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
            printf '%s' "$marker" | grep -q facebook_connected_at
            echo FACEBOOK_SESSION_AFTER_V155_PROOF=1
            $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
            rm -f "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v155-runtime-proof.ps1" 2>/dev/null || true
          fi
          echo V155_SESSION_CLEANUP_GATE=PASS
