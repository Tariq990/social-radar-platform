name: Android Facebook DOM Navigation Probe

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-facebook-dom-navigation-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar
    steps:
      - name: Resolve installed v148 and preserved Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          test -s "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"
          test -n "$serial"
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 148
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 7
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"
          test -n "$socket"
          $adb -s "$serial" forward --remove tcp:9223 >/dev/null 2>&1 || true
          $adb -s "$serial" forward tcp:9223 "localabstract:$socket" >/dev/null
          $adb -s "$serial" logcat -c >/dev/null 2>&1 || true
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          echo DOM_NAV_PROBE_PREP=PASS

      - name: Trigger real Grab and inspect page targets safely
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-dom-nav-probe.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets {
            for($i=0;$i -lt 20;$i++){
              try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{}
              Start-Sleep -Milliseconds 250
            }
            throw 'targets unavailable'
          }
          function AppTarget {$a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1);if($a.Count -eq 0){throw 'app target missing'};$a[0]}
          function Eval([string]$raw,[string]$expr,[int]$seconds=7){
            $u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));
            $ws.ConnectAsync([Uri]('ws://127.0.0.1:9223'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null
            $p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8
            $b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null
            $buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new()
            while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}
          }
          function ClassifyUrl([string]$raw){
            if([string]::IsNullOrWhiteSpace($raw) -or $raw -eq 'about:blank'){return 'blank'}
            try{$u=[Uri]$raw;$h=$u.Host.ToLowerInvariant();if($h -eq 'localhost'){return 'app'};if($h -eq 'facebook.com' -or $h.EndsWith('.facebook.com')){return 'facebook'};if($h -eq 'fb.com' -or $h.EndsWith('.fb.com') -or $h -eq 'fb.watch'){return 'facebook_alias'};return 'other_https'}catch{return 'other'}
          }
          $app=AppTarget
          $null=Eval ([string]$app.webSocketDebuggerUrl) "(()=>{window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));return true})()" 7
          $find=@'
          (()=>{const n=s=>String(s||'').replace(/\s+/g,' ').trim();const b=[...document.querySelectorAll('button')].find(x=>{const t=n(x.innerText||x.textContent);return t.includes('\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627')||/Grab latest 10 and analyze/i.test(t)});return{found:Boolean(b),enabled:Boolean(b&&!b.disabled)}})()
          '@
          $s=$null
          for($i=0;$i -lt 60;$i++){Start-Sleep -Milliseconds 350;$app=AppTarget;$s=Eval ([string]$app.webSocketDebuggerUrl) $find 7;if($s.found -and $s.enabled){break}}
          Write-Output ('GRAB_FOUND='+$(if($s.found){'1'}else{'0'}));Write-Output ('GRAB_ENABLED='+$(if($s.enabled){'1'}else{'0'}));if(!$s.found -or !$s.enabled){exit 150}
          $click=@'
          (()=>{const n=s=>String(s||'').replace(/\s+/g,' ').trim();const b=[...document.querySelectorAll('button')].find(x=>{const t=n(x.innerText||x.textContent);return t.includes('\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627')||/Grab latest 10 and analyze/i.test(t)});if(!b||b.disabled)return false;b.click();return true})()
          '@
          $clicked=Eval ([string]$app.webSocketDebuggerUrl) $click 7;Write-Output ('REAL_GRAB_CLICKED='+$(if($clicked){'1'}else{'0'}));if(!$clicked){exit 151}

          $seenFacebook=0;$seenBlank=0;$maxBody=0;$maxPageTargets=0
          $diag="(()=>{let c='other';const h=String(location.hostname||'').toLowerCase();const href=String(location.href||'');if(h==='localhost')c='app';else if(h==='facebook.com'||h.endsWith('.facebook.com')||h==='fb.com'||h.endsWith('.fb.com')||h==='fb.watch')c='facebook';else if(href==='about:blank'||!href)c='blank';return{class:c,ready:String(document.readyState||''),body:(document.body?.innerText||'').length,html:(document.documentElement?.innerHTML||'').length}})()"
          for($sample=1;$sample -le 24;$sample++){
            Start-Sleep -Milliseconds 500
            $pages=@(Targets|Where-Object{$_.type -eq 'page'})
            if($pages.Count -gt $maxPageTargets){$maxPageTargets=$pages.Count}
            $classes=@{}
            foreach($t in $pages){
              $cls=ClassifyUrl ([string]$t.url);if(!$classes.ContainsKey($cls)){$classes[$cls]=0};$classes[$cls]++
              if($cls -eq 'facebook'){$seenFacebook=1};if($cls -eq 'blank'){$seenBlank=1}
              try{$d=Eval ([string]$t.webSocketDebuggerUrl) $diag 4;if([int]$d.body -gt $maxBody){$maxBody=[int]$d.body};if($d.class -eq 'facebook'){$seenFacebook=1};if($d.class -eq 'blank'){$seenBlank=1}}catch{}
            }
            $appCount=if($classes.ContainsKey('app')){$classes['app']}else{0};$fbCount=if($classes.ContainsKey('facebook')){$classes['facebook']}else{0};$blankCount=if($classes.ContainsKey('blank')){$classes['blank']}else{0};$otherCount=$pages.Count-$appCount-$fbCount-$blankCount
            Write-Output ("TARGET_SAMPLE=$sample pages=$($pages.Count) app=$appCount facebook=$fbCount blank=$blankCount other=$otherCount maxBody=$maxBody")
          }
          Write-Output "SEEN_FACEBOOK_PAGE_TARGET=$seenFacebook"
          Write-Output "SEEN_BLANK_PAGE_TARGET=$seenBlank"
          Write-Output "MAX_PAGE_TARGETS=$maxPageTargets"
          Write-Output "MAX_NONAPP_BODY_LENGTH=$maxBody"
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          echo DOM_NAVIGATION_CDP_PROBE=PASS

      - name: Capture safe collector trace and preserve session
        if: always()
        shell: bash
        run: |
          set +e
          echo '=== SAFE COLLECTOR TRACE ==='
          $ADB -s "$SERIAL" logcat -b all -d -v threadtime 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' | tail -n 220 || true
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          if printf '%s' "$marker" | grep -q facebook_connected_at; then echo FACEBOOK_SESSION_METADATA_FINAL=1; else echo FACEBOOK_SESSION_METADATA_FINAL=0; fi
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-dom-nav-probe.ps1" 2>/dev/null || true
