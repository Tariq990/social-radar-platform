name: Apply Final Frontend Diagnostic Hardening

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/apply-final-frontend-log-hardening.yml]

permissions:
  contents: write

concurrency:
  group: scrap-app-final-frontend-diagnostic-hardening
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          clean: false
          fetch-depth: 1
      - name: Apply exact frontend diagnostic replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replacements = [
            ("      console.warn('[RadarProvider] Backend state load failed', error);\n", "      if (import.meta.env.DEV) console.warn('[RadarProvider] Backend state load failed');\n"),
            ("          } catch (error) { console.warn('[addSourceWithRule] Initial authenticated collection did not complete', error); }\n", "          } catch { if (import.meta.env.DEV) console.warn('[addSourceWithRule] Initial authenticated collection did not complete'); }\n"),
            ("      console.warn('Failed to toggle source pause', error);\n", "      if (import.meta.env.DEV) console.warn('[Radar] Source pause update failed');\n"),
            ("        console.warn('Source pause state persisted but background scheduling did not reconcile', error);\n", "        if (import.meta.env.DEV) console.warn('[Radar] Source pause persisted; background scheduling did not reconcile');\n"),
            ("        catch (error) { console.warn('Source deleted but local background cleanup did not complete', error); }\n", "        catch { if (import.meta.env.DEV) console.warn('[Radar] Source deleted; local background cleanup did not complete'); }\n"),
            ("      console.warn('Failed to delete source', error);\n", "      if (import.meta.env.DEV) console.warn('[Radar] Source deletion failed');\n"),
            ("          } catch (error) {\n            console.warn(`[Radar] Authenticated scan failed for ${source.id}`, error);\n          }\n", "          } catch {\n            if (import.meta.env.DEV) console.warn('[Radar] Authenticated source scan failed');\n          }\n"),
            ("    } catch (error) {\n      setBackendStatus('offline');\n      console.warn('[Radar] Scan failed', error);\n", "    } catch {\n      setBackendStatus('offline');\n      if (import.meta.env.DEV) console.warn('[Radar] Scan failed');\n")
          ]
          for old, new in replacements:
              replace_once('src/context/RadarContext.tsx', old, new)

          replace_once(
            'src/screens/SettingsScreen.tsx',
            "      if (!connected) throw new Error(locale === 'ar' ? 'لم يكتمل تسجيل الدخول.' : 'Login was not completed.');\n",
            "      if (!connected) {\n        setError(locale === 'ar' ? 'لم يكتمل تسجيل الدخول.' : 'Login was not completed.');\n        return;\n      }\n"
          )
          replace_once(
            'src/screens/SettingsScreen.tsx',
            "    } catch (err: any) {\n      setError(err?.message || (locale === 'ar' ? 'تعذر ربط الحساب.' : 'Could not connect the account.'));\n",
            "    } catch {\n      setError(locale === 'ar' ? 'تعذر ربط الحساب.' : 'Could not connect the account.');\n"
          )
          replace_once(
            'src/screens/SettingsScreen.tsx',
            "    } catch (err: any) {\n      setError(err?.message || (locale === 'ar' ? 'تعذر قطع الاتصال.' : 'Could not disconnect.'));\n",
            "    } catch {\n      setError(locale === 'ar' ? 'تعذر قطع الاتصال.' : 'Could not disconnect.');\n"
          )
          PY

          git rm .github/workflows/apply-final-frontend-log-hardening.yml
          git config user.name "Tariq Ziad"
          git config user.email "102293222+Tariq990@users.noreply.github.com"
          git add src/context/RadarContext.tsx src/screens/SettingsScreen.tsx
          git diff --cached --check
          git commit -m "fix: redact frontend runtime diagnostics"
          git push origin HEAD:test/android-headless-emulator-20260909
