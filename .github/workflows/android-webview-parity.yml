name: Android WebView Facebook Parity

on:
  push:
    branches:
      - test/android-webview-parity-20260909
    paths:
      - .github/workflows/android-webview-parity.yml
      - scripts/android-webview-parity.mjs
      - android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java

permissions:
  contents: read

concurrency:
  group: android-webview-facebook-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use persistent Node 22 toolchain
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$HOME/actions-runnerr/_work/_tool/node/22.23.2/x64/bin"
          test -x "$NODE_BIN/node"
          echo "$NODE_BIN" >> "$GITHUB_PATH"
          "$NODE_BIN/node" --version

      - name: Verify dedicated local Facebook browser session
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 3 http://127.0.0.1:9222/json/version \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Browser:", d.get("Browser","unknown")); assert d.get("webSocketDebuggerUrl")'

      - name: Run exact collector under Android WebView parity conditions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/android-webview-parity.mjs
