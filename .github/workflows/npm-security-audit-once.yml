name: NPM security audit once

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
    paths:
      - '.github/workflows/npm-security-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Checkout locked dependency graph
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Audit committed npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > "$RUNNER_TEMP/mrscrap-npm-audit.json" 2>/dev/null
          audit_rc=$?
          set -e
          python3 - "$RUNNER_TEMP/mrscrap-npm-audit.json" "$audit_rc" <<'PY'
          import json, sys
          path, rc = sys.argv[1], int(sys.argv[2])
          try:
              data = json.load(open(path, encoding='utf-8'))
          except Exception:
              print('NPM_AUDIT_PARSE=FAIL')
              raise SystemExit(2)
          if data.get('error'):
              print('NPM_AUDIT_FETCH=FAIL')
              raise SystemExit(2)
          counts = ((data.get('metadata') or {}).get('vulnerabilities') or {})
          for severity in ('info','low','moderate','high','critical','total'):
              print(f'NPM_AUDIT_{severity.upper()}={int(counts.get(severity, 0) or 0)}')
          vulns = data.get('vulnerabilities') or {}
          high_names = sorted(name for name, item in vulns.items() if (item or {}).get('severity') in {'high','critical'})
          print(f'NPM_AUDIT_HIGH_CRITICAL_PACKAGE_COUNT={len(high_names)}')
          for name in high_names:
              print(f'NPM_AUDIT_HIGH_CRITICAL_PACKAGE={name}')
          print(f'NPM_AUDIT_COMMAND_EXIT={rc}')
          print('NPM_AUDIT_FETCH=PASS')
          PY
