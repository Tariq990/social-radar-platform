name: Exact Facebook Comment Sweep

on:
  push:
    branches:
      - test/android-webview-parity-20260909
    paths:
      - .github/workflows/exact-facebook-comment-sweep.yml

permissions:
  contents: read

concurrency:
  group: exact-facebook-comment-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use persistent Node 22 toolchain
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$HOME/actions-runnerr/_work/_tool/node/22.23.2/x64/bin"
          test -x "$NODE_BIN/node"
          echo "$NODE_BIN" >> "$GITHUB_PATH"
          "$NODE_BIN/node" --version
      - name: Verify Chrome CDP session
        shell: bash
        run: curl -fsS --connect-timeout 3 http://127.0.0.1:9222/json/version >/dev/null
      - name: Sweep comments across ten collected posts
        shell: bash
        run: node scripts/exact-facebook-comment-sweep.mjs
