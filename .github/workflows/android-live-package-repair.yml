name: Android Live Package Repair

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths:
      - .github/workflows/android-live-package-repair.yml

permissions:
  contents: read

jobs:
  repair-live-package:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 6
    steps:
      - name: Diagnose installed package and launch app
        shell: bash
        run: |
          set -u
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          pkg="com.mrscrap.socialradar"

          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
          test -n "$serial" || { echo EMULATOR_DEVICE_FOUND=0; exit 10; }
          echo "SERIAL=$serial"
          boot="$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
          echo "BOOT_COMPLETED=$boot"
          test "$boot" = "1" || exit 11

          echo "=== PACKAGE PATH / VERSION ==="
          "$adb" -s "$serial" shell pm path "$pkg" 2>&1 | tr -d '\r' || true
          "$adb" -s "$serial" shell dumpsys package "$pkg" 2>/dev/null | tr -d '\r' | grep -E 'versionCode=|versionName=|User 0:|installed=|hidden=|suspended=|stopped=|notLaunched=|enabled=|MainActivity|android.intent.action.MAIN|android.intent.category.LAUNCHER' | head -n 120 || true

          echo "=== PACKAGE ENABLE ==="
          "$adb" -s "$serial" shell pm enable --user 0 "$pkg" 2>&1 | tr -d '\r' || true
          sleep 1

          echo "=== QUERY LAUNCHER WITH PACKAGE ==="
          "$adb" -s "$serial" shell cmd package query-activities --brief --components --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$pkg" 2>&1 | tr -d '\r' || true

          echo "=== QUERY ALL LAUNCHERS FILTERED ==="
          "$adb" -s "$serial" shell cmd package query-activities --brief --components --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER 2>&1 | tr -d '\r' | grep -E "${pkg}|MainActivity" || true

          echo "=== RESOLVE EXACT COMPONENT ==="
          "$adb" -s "$serial" shell cmd package resolve-activity --brief --user 0 -n "$pkg/.MainActivity" 2>&1 | tr -d '\r' || true

          echo "=== START EXACT COMPONENT ==="
          set +e
          "$adb" -s "$serial" shell am start --user 0 -W -n "$pkg/.MainActivity" 2>&1 | tr -d '\r'
          exact_rc=${PIPESTATUS[0]}
          set -e
          echo "EXACT_RC=$exact_rc"

          echo "=== START IMPLICIT LAUNCHER ==="
          set +e
          "$adb" -s "$serial" shell am start --user 0 -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$pkg" 2>&1 | tr -d '\r'
          implicit_rc=${PIPESTATUS[0]}
          set -e
          echo "IMPLICIT_RC=$implicit_rc"

          echo "=== MONKEY LAUNCH ==="
          set +e
          "$adb" -s "$serial" shell monkey --user 0 -p "$pkg" -c android.intent.category.LAUNCHER 1 2>&1 | tr -d '\r'
          monkey_rc=${PIPESTATUS[0]}
          set -e
          echo "MONKEY_RC=$monkey_rc"

          sleep 2
          pid="$($adb -s "$serial" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
          echo "PID=$pid"

          echo "=== USER STATE DETAIL ==="
          "$adb" -s "$serial" shell dumpsys package "$pkg" 2>/dev/null | tr -d '\r' | grep -A35 'User 0:' | head -n 50 || true

          echo "=== MAINACTIVITY DETAIL ==="
          "$adb" -s "$serial" shell dumpsys package "$pkg" 2>/dev/null | tr -d '\r' | grep -A30 -B10 'MainActivity' | head -n 180 || true

          echo "=== LOGCAT ==="
          "$adb" -s "$serial" logcat -d -t 500 2>/dev/null | tr -d '\r' | grep -E -i 'mrscrap|MainActivity|ActivityTaskManager|PackageManager|FATAL EXCEPTION|AndroidRuntime' | tail -n 220 || true

          if [ -n "$pid" ]; then
            echo EMULATOR_APP_LAUNCHED=1
            exit 0
          fi

          echo EMULATOR_APP_LAUNCHED=0
          exit 20
