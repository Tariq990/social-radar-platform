name: Android Live Package Repair

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths:
      - .github/workflows/android-live-package-repair.yml

permissions:
  contents: read

jobs:
  repair-live-package:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Ensure current AVD is booted
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          sdk_wsl="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          sdk_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          adb="${sdk_wsl}/platform-tools/adb.exe"
          image_win="${sdk_win}\\system-images\\android-36\\google_apis\\x86_64"
          avd_dir="/mnt/c/Users/${win_user}/.android/avd/test_avd.avd"
          test -s "${avd_dir}/userdata-qemu.img"
          test -s "${avd_dir}/userdata-qemu.pre-clean.img"

          "$adb" start-server >/dev/null 2>&1 || true
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
          if [ -z "$serial" ]; then
            echo EMULATOR_RESTART_REQUIRED=1
            ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-diagnostic-start.ps1"
            cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            ([string]\$_.CommandLine -like '*@test_avd*') -or
            ([string]\$_.ExecutablePath -like '${sdk_win}\\emulator\\*')
          } | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          \$emu = '${sdk_win}\\emulator\\emulator.exe'
          \$args = @('@test_avd','-sysdir','${image_win}','-no-audio','-no-boot-anim','-no-snapshot','-gpu','swiftshader_indirect','-no-window')
          Start-Process -FilePath \$emu -ArgumentList \$args -WindowStyle Hidden
          POWERSHELL
            /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          fi

          serial=''
          for i in $(seq 1 48); do
            serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
            [ -n "$serial" ] && break
            if (( i % 6 == 0 )); then
              states="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ {print $1,$2}')"
              echo "ADB_WAIT_SECONDS=$((i*5)) STATES=${states:-none}"
              "$adb" reconnect offline >/dev/null 2>&1 || true
            fi
            sleep 5
          done
          test -n "$serial" || { echo EMULATOR_DEVICE_FOUND=0; exit 10; }

          boot=''
          activity=''
          for i in $(seq 1 60); do
            boot="$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            activity="$($adb -s "$serial" shell service check activity 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            if [ "$boot" = "1" ] && echo "$activity" | grep -q 'found'; then break; fi
            sleep 3
          done
          echo "BOOT_COMPLETED=$boot"
          echo "ACTIVITY_SERVICE=$activity"
          test "$boot" = "1"
          echo "$activity" | grep -q 'found'
          sleep 10

          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "WINUSER=$win_user" >> "$GITHUB_ENV"
          echo EMULATOR_RUNTIME_READY=1

      - name: Control launch and capture MR SCRAP system death
        shell: bash
        run: |
          set -u
          pkg="com.mrscrap.socialradar"
          apk="$RUNNER_WORKSPACE/SCRAP-APP/android/app/build/outputs/apk/debug/app-debug.apk"
          win_tmp="/mnt/c/Users/${WINUSER}/AppData/Local/Temp/MRSCRAP/app-debug.apk"
          trace="$RUNNER_TEMP/mrscrap-prelaunch-logcat.txt"
          crashtrace="$RUNNER_TEMP/mrscrap-crash-logcat.txt"

          if ! "$ADB" -s "$SERIAL" shell pm path "$pkg" >/dev/null 2>&1; then
            test -s "$apk"
            mkdir -p "$(dirname "$win_tmp")"
            cp -f "$apk" "$win_tmp"
            "$ADB" -s "$SERIAL" install "$(wslpath -w "$win_tmp")" 2>&1 | tr -d '\r'
          fi
          "$ADB" -s "$SERIAL" shell pm enable --user 0 "$pkg" >/dev/null 2>&1 || true

          echo "=== PRE-CONTROL ==="
          ss0="$($ADB -s "$SERIAL" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          echo "SYSTEM_SERVER_PID_INITIAL=$ss0"
          "$ADB" -s "$SERIAL" shell service check activity 2>&1 | tr -d '\r' || true

          echo "=== CONTROL: SETTINGS ==="
          set +e
          "$ADB" -s "$SERIAL" shell am start --user 0 -a android.settings.SETTINGS 2>&1 | tr -d '\r'
          control_rc=${PIPESTATUS[0]}
          sleep 5
          ss1="$($ADB -s "$SERIAL" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          settings_pid="$($ADB -s "$SERIAL" shell pidof com.android.settings 2>/dev/null | tr -d '\r' || true)"
          set -e
          echo "CONTROL_RC=$control_rc"
          echo "SETTINGS_PID=$settings_pid"
          echo "SYSTEM_SERVER_PID_AFTER_SETTINGS=$ss1"
          if [ -z "$ss1" ] || [ "$ss0" != "$ss1" ]; then
            echo CONTROL_SYSTEM_SERVER_STABLE=0
            exit 31
          fi
          echo CONTROL_SYSTEM_SERVER_STABLE=1

          echo "=== PACKAGE RESOLUTION ==="
          "$ADB" -s "$SERIAL" shell cmd package query-activities --brief --components --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$pkg" 2>&1 | tr -d '\r' || true
          "$ADB" -s "$SERIAL" shell pm path "$pkg" 2>&1 | tr -d '\r' || true

          echo "=== START LIVE LOG CAPTURE ==="
          rm -f "$trace" "$crashtrace"
          "$ADB" -s "$SERIAL" logcat -b all -v threadtime >"$trace" 2>&1 &
          logger_pid=$!
          "$ADB" -s "$SERIAL" logcat -b crash -v threadtime >"$crashtrace" 2>&1 &
          crash_logger_pid=$!
          sleep 2

          ss_before="$($ADB -s "$SERIAL" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          echo "SYSTEM_SERVER_PID_BEFORE_MRSCRAP=$ss_before"

          echo "=== MR SCRAP LAUNCH (NO -W) ==="
          set +e
          "$ADB" -s "$SERIAL" shell am start --user 0 -f 0x20 -n "$pkg/.MainActivity" 2>&1 | tr -d '\r'
          launch_rc=${PIPESTATUS[0]}
          echo "LAUNCH_RC=$launch_rc"
          sleep 10
          set -e

          kill "$logger_pid" "$crash_logger_pid" >/dev/null 2>&1 || true
          wait "$logger_pid" "$crash_logger_pid" >/dev/null 2>&1 || true

          "$ADB" start-server >/dev/null 2>&1 || true
          serial2=''
          for i in $(seq 1 15); do
            serial2="$($ADB devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
            [ -n "$serial2" ] && break
            sleep 2
          done
          [ -n "$serial2" ] || serial2="$SERIAL"
          ss_after="$($ADB -s "$serial2" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          app_pid="$($ADB -s "$serial2" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
          echo "SYSTEM_SERVER_PID_AFTER_MRSCRAP=$ss_after"
          echo "APP_PID=$app_pid"

          echo "=== CAPTURED CRITICAL LOGS ==="
          grep -E -i 'FATAL|Fatal signal|system_server|ActivityTaskManager|ActivityManager|Watchdog|binder|IPCThreadState|mrscrap|MainActivity|tombstone|SIG[A-Z]+|abort|crash|RuntimeException|Exception' "$trace" | tail -n 700 || true
          echo "=== CRASH BUFFER ==="
          tail -n 300 "$crashtrace" || true

          echo "=== DROPBOX TAGS ==="
          "$ADB" -s "$serial2" shell dumpsys dropbox 2>/dev/null | tr -d '\r' | grep -E -i 'system_server|tombstone|crash|anr|wtf|last_kmsg' | tail -n 120 || true

          echo "=== ROOT / TOMBSTONES PROBE ==="
          "$ADB" -s "$serial2" root 2>&1 | tr -d '\r' || true
          sleep 2
          "$ADB" -s "$serial2" shell 'ls -lt /data/tombstones 2>/dev/null | head -20' 2>&1 | tr -d '\r' || true

          if [ -n "$ss_before" ] && [ -n "$ss_after" ] && [ "$ss_before" != "$ss_after" ]; then
            echo MRSCRAP_CAUSES_SYSTEM_SERVER_RESTART=1
            exit 40
          fi
          if [ -z "$app_pid" ]; then
            echo MRSCRAP_APP_LAUNCHED=0
            exit 41
          fi
          echo MRSCRAP_APP_LAUNCHED=1
