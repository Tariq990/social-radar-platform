name: Android Live Package Repair

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths:
      - .github/workflows/android-live-package-repair.yml

permissions:
  contents: read

jobs:
  trace-read-color-buffer-dma:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 6
    steps:
      - name: Trace exact guest/host DMA advertisement
        shell: bash
        run: |
          set -u
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          sdk="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          sdk_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          adb="${sdk}/platform-tools/adb.exe"
          image="${sdk}/system-images/android-36/google_apis/x86_64"
          features="/mnt/c/Users/${win_user}/.android/advancedFeatures.ini"
          temp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MRSCRAP"
          hostout="${temp}/dma-advert-host.out.log"
          hosterr="${temp}/dma-advert-host.err.log"
          mkdir -p "$temp"

          echo '=== USER FEATURE OVERRIDES (READ ONLY) ==='
          cat "$features" 2>/dev/null || true
          echo '=== SYSTEM IMAGE METADATA ==='
          sed -n '1,160p' "${image}/source.properties" 2>/dev/null || true
          if [ -f "${image}/package.xml" ]; then
            grep -E 'path=|display-name|api-level|tag|revision|type-details' "${image}/package.xml" | head -n 80 || true
          fi
          echo '=== SYSTEM IMAGE ADVANCED FEATURES ==='
          if [ -f "${image}/advancedFeatures.ini" ]; then
            cat "${image}/advancedFeatures.ini"
          else
            echo SYSTEM_IMAGE_ADVANCED_FEATURES_PRESENT=0
          fi
          echo '=== LOCAL EMULATOR INVENTORY ==='
          for e in "${sdk}/emulator/emulator.exe" "${sdk}/emulator-37.1.11-backup/emulator.exe"; do
            if [ -f "$e" ]; then
              echo "EMULATOR_PATH=$e"
              "$e" -version 2>&1 | tr -d '\r' | head -n 2 || true
            fi
          done

          "$adb" kill-server >/dev/null 2>&1 || true
          ps1="${temp}/dma-advert-start.ps1"
          cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference='Stop'
          \$sdk='${sdk_win}'
          @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            \$cmd=[string]\$_.CommandLine; \$path=[string]\$_.ExecutablePath
            (\$cmd -like '*@test_avd*') -or (\$path -like (\$sdk+'\\emulator\\*')) -or
            (\$_.Name -in @('emulator.exe','qemu-system-x86_64.exe','qemu-system-x86_64-headless.exe'))
          }) | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          \$out='C:\\Users\\${win_user}\\AppData\\Local\\Temp\\MRSCRAP\\dma-advert-host.out.log'
          \$err='C:\\Users\\${win_user}\\AppData\\Local\\Temp\\MRSCRAP\\dma-advert-host.err.log'
          Remove-Item -Force \$out,\$err -ErrorAction SilentlyContinue
          \$exe=Join-Path \$sdk 'emulator\\emulator.exe'
          \$args='@test_avd -sysdir ${sdk_win}\\system-images\\android-36\\google_apis\\x86_64 -no-audio -no-boot-anim -no-snapshot -gpu swangle_indirect -no-window -verbose'
          \$cmd='cmd.exe /d /s /c ""' + \$exe + '" ' + \$args + ' 1>"' + \$out + '" 2>"' + \$err + '""'
          \$r=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=\$cmd}
          Write-Output ("DETACHED_LAUNCH_RETURN={0} PID={1}" -f \$r.ReturnValue,\$r.ProcessId)
          if (\$r.ReturnValue -ne 0) { exit 3 }
          POWERSHELL
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

          "$adb" start-server >/dev/null 2>&1 || true
          serial=''
          for i in $(seq 1 48); do
            serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1; exit}')"
            [ -n "$serial" ] && break
            sleep 5
          done
          [ -n "$serial" ] || { echo EMULATOR_DEVICE_FOUND=0; exit 10; }
          echo "SERIAL=$serial"

          boot=''
          for i in $(seq 1 18); do
            boot="$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            [ "$boot" = '1' ] && break
            sleep 5
          done
          echo "BOOT_AFTER_WAIT=$boot"
          [ "$boot" = '1' ] || exit 11

          echo '=== EFFECTIVE HOST GFXSTREAM FEATURES ==='
          grep -E -i "Feature '(GLDMA|GLDirectMem|GLESDynamicVersion|HasSharedSlotsHostMemoryAllocator)'|gfxstreamFeature:(GlDma|GlDma2|GlDirectMem|GlesDynamicVersion|HasSharedSlotsHostMemoryAllocator|HostComposition)" "$hostout" "$hosterr" 2>/dev/null | tail -n 160 || true
          echo "HOST_LOG_DMA_TOKEN_COUNT=$(cat "$hostout" "$hosterr" 2>/dev/null | grep -c 'ANDROID_EMU_read_color_buffer_dma' || true)"

          echo '=== GUEST GRAPHICS PROPERTIES ==='
          "$adb" -s "$serial" shell getprop 2>/dev/null | tr -d '\r' | grep -E -i 'ro\.hardware\.(egl|gralloc|vulkan)|debug\.hwui|qemu|gfxstream|goldfish|ranchu|gpu|gralloc' | head -n 250 || true
          echo '=== GUEST MAPPER IDENTITY ==='
          "$adb" -s "$serial" shell ls -l /vendor/lib64/hw/mapper.ranchu.so 2>/dev/null | tr -d '\r' || true
          "$adb" -s "$serial" shell sha256sum /vendor/lib64/hw/mapper.ranchu.so 2>/dev/null | tr -d '\r' || true

          "$adb" -s "$serial" shell setprop log.tag.HostConnection VERBOSE >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell setprop log.tag.GoldfishMapper VERBOSE >/dev/null 2>&1 || true
          "$adb" -s "$serial" logcat -b all -c >/dev/null 2>&1 || "$adb" -s "$serial" logcat -c >/dev/null 2>&1 || true
          ss0="$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          sf0="$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
          echo "BASELINE_SS=$ss0 BASELINE_SF=$sf0"

          echo '=== TRIGGER ONE SETTINGS CONTROL ==='
          "$adb" -s "$serial" shell am start -W -a android.settings.SETTINGS 2>&1 | tr -d '\r' || true
          sleep 12
          ss1="$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          sf1="$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
          echo "AFTER_SETTINGS_SS=$ss1 AFTER_SETTINGS_SF=$sf1"

          guestlog="${temp}/dma-advert-guest.log"
          "$adb" -s "$serial" logcat -b all -d -v threadtime 2>/dev/null | tr -d '\r' > "$guestlog" || "$adb" -s "$serial" logcat -d -v threadtime 2>/dev/null | tr -d '\r' > "$guestlog" || true
          echo '=== EXACT HOSTCONNECTION / EXTENSION EVIDENCE ==='
          grep -n -E -i 'HostConnection|HostComposition|ANDROID_EMU_read_color_buffer_dma|read_color_buffer_dma' "$guestlog" | tail -n 500 || true
          echo "GUEST_DMA_TOKEN_COUNT=$(grep -c 'ANDROID_EMU_read_color_buffer_dma' "$guestlog" || true)"
          echo '=== ASSERTION EVIDENCE ==='
          grep -n -E -i 'mapper\.ranchu|GoldfishMapper|RegionSampling|hasReadColorBufferDma|SurfaceFlinger.*(fatal|abort|crash)' "$guestlog" | tail -n 350 || true
          echo "GUEST_DMA_ASSERT_COUNT=$(grep -c 'hasReadColorBufferDma' "$guestlog" || true)"
          echo '=== HOST TOKEN CONTEXT AFTER SETTINGS ==='
          grep -n -E -i 'ANDROID_EMU_read_color_buffer_dma|read_color_buffer_dma|GLDMA|GLDirectMem|HasSharedSlotsHostMemoryAllocator|HostComposition' "$hostout" "$hosterr" 2>/dev/null | tail -n 300 || true
          echo "HOST_DMA_TOKEN_COUNT_AFTER=$(cat "$hostout" "$hosterr" 2>/dev/null | grep -c 'ANDROID_EMU_read_color_buffer_dma' || true)"
          echo DMA_ADVERTISEMENT_TRACE_COMPLETE=1
