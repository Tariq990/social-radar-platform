name: Android Live Package Repair

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths:
      - .github/workflows/android-live-package-repair.yml

permissions:
  contents: read

jobs:
  repair-live-package:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    steps:
      - name: Configure pinned emulator feature overrides
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          sdk_wsl="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          sdk_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          emu="${sdk_wsl}/emulator/emulator.exe"
          adb="${sdk_wsl}/platform-tools/adb.exe"
          avd_dir="/mnt/c/Users/${win_user}/.android/avd/test_avd.avd"
          test -x "$emu"
          test -x "$adb"
          test -s "${avd_dir}/userdata-qemu.img"

          version="$(timeout 30s "$emu" -version 2>&1 | tr -d '\r' | head -n 6 || true)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -q '36\.4\.9'
          echo EMULATOR_VERSION_PINNED=36.4.9

          "$adb" kill-server >/dev/null 2>&1 || true
          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/MRSCRAP/configure-emulator-features.ps1"
          mkdir -p "$(dirname "$ps1")"
          cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference = 'Stop'
          \$sdk = '${sdk_win}'
          @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            \$cmd = [string]\$_.CommandLine
            \$path = [string]\$_.ExecutablePath
            (\$cmd -like '*@test_avd*') -or
            (\$path -like (\$sdk + '\\emulator\\*')) -or
            (\$_.Name -in @('emulator.exe','qemu-system-x86_64.exe','qemu-system-x86_64-headless.exe'))
          }) | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3

          \$androidDir = Join-Path \$env:USERPROFILE '.android'
          New-Item -ItemType Directory -Force -Path \$androidDir | Out-Null
          \$features = Join-Path \$androidDir 'advancedFeatures.ini'
          \$backup = Join-Path \$androidDir 'advancedFeatures.ini.mrscrap-pre-dma-fix'
          if ((Test-Path \$features) -and -not (Test-Path \$backup)) {
            Copy-Item -LiteralPath \$features -Destination \$backup
          }
          \$lines = @()
          if (Test-Path \$features) { \$lines = @(Get-Content -LiteralPath \$features) }
          \$lines = @(\$lines | Where-Object {
            \$_ -notmatch '^\s*(GLDirectMem|HasSharedSlotsHostMemoryAllocator|GLESDynamicVersion)\s*='
          })
          \$lines += 'GLESDynamicVersion = on'
          \$lines += 'GLDirectMem = off'
          \$lines += 'HasSharedSlotsHostMemoryAllocator = off'
          Set-Content -LiteralPath \$features -Value \$lines -Encoding ASCII
          Write-Output 'FEATURE_OVERRIDE_BEGIN'
          Get-Content -LiteralPath \$features | Where-Object { \$_ -match '^(GLESDynamicVersion|GLDirectMem|HasSharedSlotsHostMemoryAllocator)\s*=' }
          Write-Output 'FEATURE_OVERRIDE_END'
          POWERSHELL
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "EMU=$emu" >> "$GITHUB_ENV"
          echo "WINUSER=$win_user" >> "$GITHUB_ENV"
          echo "SDK_WIN=$sdk_win" >> "$GITHUB_ENV"

      - name: Boot API 36 and prove DMA extension is absent
        shell: bash
        run: |
          set -euo pipefail
          image_win="${SDK_WIN}\\system-images\\android-36\\google_apis\\x86_64"
          ps1="/mnt/c/Users/${WINUSER}/AppData/Local/Temp/MRSCRAP/start-dma-fixed-emulator.ps1"
          cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference = 'Stop'
          \$emu = '${SDK_WIN}\\emulator\\emulator.exe'
          \$args = @('@test_avd','-sysdir','${image_win}','-no-audio','-no-boot-anim','-no-snapshot','-gpu','swangle_indirect','-no-window')
          Write-Output ('EMULATOR_ARGS=' + (\$args -join ' '))
          Start-Process -FilePath \$emu -ArgumentList \$args -WindowStyle Hidden
          POWERSHELL
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

          "$ADB" start-server >/dev/null 2>&1 || true
          serial=''
          for i in $(seq 1 60); do
            serial="$($ADB devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
            [ -n "$serial" ] && break
            if (( i % 6 == 0 )); then
              states="$($ADB devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ {print $1,$2}')"
              echo "ADB_WAIT_SECONDS=$((i*5)) STATES=${states:-none}"
              "$ADB" reconnect offline >/dev/null 2>&1 || true
            fi
            sleep 5
          done
          test -n "$serial" || { echo EMULATOR_DEVICE_FOUND=0; exit 10; }

          stable_count=0
          base_ss=''
          base_sf=''
          for i in $(seq 1 100); do
            boot="$($ADB -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            activity="$($ADB -s "$serial" shell service check activity 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            package="$($ADB -s "$serial" shell service check package 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            ss="$($ADB -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
            sf="$($ADB -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot" = "1" ] && echo "$activity" | grep -q 'found' && echo "$package" | grep -q 'found' && [ -n "$ss" ] && [ -n "$sf" ]; then
              if [ "$ss" = "$base_ss" ] && [ "$sf" = "$base_sf" ]; then stable_count=$((stable_count+1)); else base_ss="$ss"; base_sf="$sf"; stable_count=1; fi
            else
              stable_count=0; base_ss="$ss"; base_sf="$sf"
            fi
            if (( i % 5 == 0 )); then echo "CORE_WAIT_$((i*3))S BOOT=${boot:-none} SS=${ss:-none} SF=${sf:-none} STABLE=$stable_count"; fi
            if [ "$stable_count" -ge 7 ]; then break; fi
            sleep 3
          done
          echo "CORE_STABLE_COUNT=$stable_count"
          test "$stable_count" -ge 7

          host_lines="$($ADB -s "$serial" logcat -d 2>/dev/null | tr -d '\r' | grep 'HostComposition ext' | tail -n 20 || true)"
          if printf '%s\n' "$host_lines" | grep -q 'ANDROID_EMU_read_color_buffer_dma'; then
            echo READ_COLOR_BUFFER_DMA_ADVERTISED=1
            printf '%s\n' "$host_lines" | tail -n 5
            exit 22
          fi
          echo READ_COLOR_BUFFER_DMA_ADVERTISED=0

          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "BASE_SS=$base_ss" >> "$GITHUB_ENV"
          echo "BASE_SF=$base_sf" >> "$GITHUB_ENV"
          echo DMA_FEATURE_GATE=PASS

      - name: Validate Settings and MR SCRAP stability
        shell: bash
        run: |
          set -u
          pkg="com.mrscrap.socialradar"
          apk="$RUNNER_WORKSPACE/SCRAP-APP/android/app/build/outputs/apk/debug/app-debug.apk"
          win_tmp="/mnt/c/Users/${WINUSER}/AppData/Local/Temp/MRSCRAP/app-debug.apk"

          if ! "$ADB" -s "$SERIAL" shell pm path "$pkg" >/dev/null 2>&1; then
            echo PACKAGE_INSTALL_REQUIRED=1
            test -s "$apk" || exit 12
            mkdir -p "$(dirname "$win_tmp")"
            cp -f "$apk" "$win_tmp"
            "$ADB" -s "$SERIAL" install "$(wslpath -w "$win_tmp")" 2>&1 | tr -d '\r' || exit 13
          else
            echo PACKAGE_INSTALL_REQUIRED=0
          fi
          "$ADB" -s "$SERIAL" shell pm enable --user 0 "$pkg" >/dev/null 2>&1 || true
          "$ADB" -s "$SERIAL" logcat -b crash -c >/dev/null 2>&1 || true
          "$ADB" -s "$SERIAL" logcat -c >/dev/null 2>&1 || true

          echo '=== SETTINGS CONTROL ==='
          "$ADB" -s "$SERIAL" shell am start --user 0 -a android.settings.SETTINGS 2>&1 | tr -d '\r' || true
          sleep 20
          sf_settings="$($ADB -s "$SERIAL" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
          ss_settings="$($ADB -s "$SERIAL" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          settings_pid="$($ADB -s "$SERIAL" shell pidof com.android.settings 2>/dev/null | tr -d '\r' || true)"
          crash="$($ADB -s "$SERIAL" logcat -b crash -d -v threadtime 2>/dev/null | tr -d '\r' || true)"
          assertion_count="$(printf '%s\n' "$crash" | grep -c 'hasReadColorBufferDma' || true)"
          echo "SETTINGS_PID=$settings_pid"
          echo "SETTINGS_SF=$sf_settings SETTINGS_SS=$ss_settings"
          echo "READ_COLOR_BUFFER_DMA_ASSERTIONS_AFTER_SETTINGS=$assertion_count"
          if [ -z "$settings_pid" ] || [ "$sf_settings" != "$BASE_SF" ] || [ "$ss_settings" != "$BASE_SS" ] || [ "$assertion_count" -gt 0 ]; then
            printf '%s\n' "$crash" | tail -n 260 || true
            echo SETTINGS_CONTROL_STABLE=0
            exit 30
          fi
          echo SETTINGS_CONTROL_STABLE=1

          echo '=== MR SCRAP ==='
          resolve="$($ADB -s "$SERIAL" shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$pkg" 2>/dev/null | tr -d '\r' | tail -n1 || true)"
          echo "RESOLVED_ACTIVITY=$resolve"
          "$ADB" -s "$SERIAL" shell am start --user 0 -f 0x20 -n "$pkg/.MainActivity" 2>&1 | tr -d '\r' || true

          stable=1
          ever_app=0
          for i in $(seq 1 12); do
            sleep 5
            sf="$($ADB -s "$SERIAL" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
            ss="$($ADB -s "$SERIAL" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
            app="$($ADB -s "$SERIAL" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
            [ -n "$app" ] && ever_app=1
            echo "STABILITY_$((i*5))S SF=${sf:-none} SS=${ss:-none} APP=${app:-none}"
            if [ "$sf" != "$BASE_SF" ] || [ "$ss" != "$BASE_SS" ]; then stable=0; break; fi
          done
          crash="$($ADB -s "$SERIAL" logcat -b crash -d -v threadtime 2>/dev/null | tr -d '\r' || true)"
          assertion_count="$(printf '%s\n' "$crash" | grep -c 'hasReadColorBufferDma' || true)"
          app_end="$($ADB -s "$SERIAL" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
          echo "READ_COLOR_BUFFER_DMA_ASSERTIONS=$assertion_count"
          echo "APP_PID_AFTER=$app_end"
          if [ "$assertion_count" -gt 0 ] || [ "$stable" -ne 1 ] || [ "$ever_app" -ne 1 ] || [ -z "$app_end" ]; then
            printf '%s\n' "$crash" | tail -n 300 || true
            echo DMA_FIX_ACCEPTANCE=FAIL
            exit 40
          fi
          echo MRSCRAP_APP_LAUNCHED=1
          echo SURFACEFLINGER_STABLE=1
          echo SYSTEM_SERVER_STABLE=1
          echo DMA_FIX_ACCEPTANCE=PASS
