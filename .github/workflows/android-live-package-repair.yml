name: Android Live Package Repair

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths:
      - .github/workflows/android-live-package-repair.yml

permissions:
  contents: read

jobs:
  diagnose-gfxstream:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Trace effective graphics state and prove UI stability
        shell: bash
        run: |
          set -u
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          sdk="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          sdk_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          adb="${sdk}/platform-tools/adb.exe"
          emu="${sdk}/emulator/emulator.exe"
          avd="/mnt/c/Users/${win_user}/.android/avd/test_avd.avd"
          features="/mnt/c/Users/${win_user}/.android/advancedFeatures.ini"
          temp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MRSCRAP"
          apk="/home/tarik/actions-runnerr/_work/SCRAP-APP/SCRAP-APP/android/app/build/outputs/apk/debug/app-debug.apk"
          pkg="com.mrscrap.socialradar"
          activity="com.mrscrap.socialradar.MainActivity"
          mkdir -p "$temp"

          echo '=== LOCAL SYSTEM IMAGES ==='
          find "${sdk}/system-images" -maxdepth 4 -type f \( -name system.img -o -name package.xml \) -printf '%p\n' 2>/dev/null | sort || true
          echo '=== AVD GRAPHICS CONFIG ==='
          grep -E -i '^(hw\.gpu|hw\.ramSize|image\.sysdir|tag\.|target|PlayStore|disk\.dataPartition)' "${avd}/config.ini" 2>/dev/null || true
          echo '=== ADVANCED FEATURES ==='
          grep -E -i '^(GLESDynamicVersion|GLDirectMem|HasSharedSlotsHostMemoryAllocator)\s*=' "$features" 2>/dev/null || true
          echo '=== EMULATOR VERSION ==='
          "$emu" -version 2>&1 | tr -d '\r' | head -n 8 || true

          echo '=== EFFECTIVE FEATURE LIST ==='
          feature_ps1="${temp}/gfx-feature-list.ps1"
          feature_log="${temp}/gfx-feature-list.log"
          cat > "$feature_ps1" <<POWERSHELL
          \$ErrorActionPreference='Stop'
          \$exe='${sdk_win}\\emulator\\emulator.exe'
          \$log='C:\\Users\\${win_user}\\AppData\\Local\\Temp\\MRSCRAP\\gfx-feature-list.log'
          Remove-Item -Force \$log -ErrorAction SilentlyContinue
          \$cmd='cmd.exe /d /s /c ""' + \$exe + '" -feature-list >"' + \$log + '" 2>&1"'
          \$r=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=\$cmd}
          Write-Output ("FEATURE_LIST_LAUNCH_RETURN={0} PID={1}" -f \$r.ReturnValue,\$r.ProcessId)
          if (\$r.ReturnValue -ne 0) { exit 2 }
          \$deadline=(Get-Date).AddSeconds(15)
          while ((Get-Date) -lt \$deadline) {
            if (-not (Get-Process -Id \$r.ProcessId -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Get-Process -Id \$r.ProcessId -ErrorAction SilentlyContinue) {
            Stop-Process -Id \$r.ProcessId -Force -ErrorAction SilentlyContinue
            Write-Output 'FEATURE_LIST_TIMEOUT=1'
          } else {
            Write-Output 'FEATURE_LIST_TIMEOUT=0'
          }
          POWERSHELL
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(wslpath -w "$feature_ps1")" | tr -d '\r'
          tr -d '\r' < "$feature_log" 2>/dev/null | grep -E -i 'GLDirectMem|HasSharedSlotsHostMemoryAllocator|GLESDynamicVersion|ReadColor|DMA' || true

          "$adb" kill-server >/dev/null 2>&1 || true
          ps1="${temp}/gfx-trace-start.ps1"
          hostout="${temp}/gfx-trace-host.out.log"
          hosterr="${temp}/gfx-trace-host.err.log"
          cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference='Stop'
          \$sdk='${sdk_win}'
          @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            \$cmd=[string]\$_.CommandLine; \$path=[string]\$_.ExecutablePath
            (\$cmd -like '*@test_avd*') -or (\$path -like (\$sdk+'\\emulator\\*')) -or
            (\$_.Name -in @('emulator.exe','qemu-system-x86_64.exe','qemu-system-x86_64-headless.exe'))
          }) | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          \$out='C:\\Users\\${win_user}\\AppData\\Local\\Temp\\MRSCRAP\\gfx-trace-host.out.log'
          \$err='C:\\Users\\${win_user}\\AppData\\Local\\Temp\\MRSCRAP\\gfx-trace-host.err.log'
          Remove-Item -Force \$out,\$err -ErrorAction SilentlyContinue
          \$exe=Join-Path \$sdk 'emulator\\emulator.exe'
          \$args='@test_avd -sysdir ${sdk_win}\\system-images\\android-36\\google_apis\\x86_64 -no-audio -no-boot-anim -no-snapshot -gpu swangle_indirect -no-window -verbose'
          \$cmd='cmd.exe /d /s /c ""' + \$exe + '" ' + \$args + ' 1>"' + \$out + '" 2>"' + \$err + '""'
          \$r=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=\$cmd}
          Write-Output ("DETACHED_LAUNCH_RETURN={0} PID={1}" -f \$r.ReturnValue,\$r.ProcessId)
          if (\$r.ReturnValue -ne 0) { exit 3 }
          POWERSHELL
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

          "$adb" start-server >/dev/null 2>&1 || true
          serial=''
          for i in $(seq 1 48); do
            serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1; exit}')"
            [ -n "$serial" ] && break
            sleep 5
          done
          if [ -z "$serial" ]; then
            echo EMULATOR_DEVICE_FOUND=0
            tail -n 250 "$hostout" 2>/dev/null || true
            tail -n 250 "$hosterr" 2>/dev/null || true
            exit 10
          fi

          echo "SERIAL=$serial"
          boot=''
          for i in $(seq 1 15); do
            boot="$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            [ "$boot" = '1' ] && break
            sleep 5
          done
          echo "BOOT_AFTER_WAIT=$boot"
          [ "$boot" = '1' ] || exit 11

          ss0="$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          sf0="$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
          echo "CORE_BASELINE_SS=$ss0"
          echo "CORE_BASELINE_SF=$sf0"
          [ -n "$ss0" ] && [ -n "$sf0" ] || exit 12

          "$adb" -s "$serial" logcat -c >/dev/null 2>&1 || true
          echo '=== SETTINGS CONTROL START ==='
          "$adb" -s "$serial" shell am start -W -a android.settings.SETTINGS 2>&1 | tr -d '\r' || true
          settings_stable=1
          for i in $(seq 1 12); do
            sleep 5
            ss="$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
            sf="$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
            act="$($adb -s "$serial" shell service check activity 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            psvc="$($adb -s "$serial" shell service check package 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            echo "SETTINGS_SAMPLE_${i}=SS:${ss} SF:${sf} ACT:${act} PKG:${psvc}"
            if [ "$ss" != "$ss0" ] || [ "$sf" != "$sf0" ] || ! printf '%s' "$act" | grep -q 'found' || ! printf '%s' "$psvc" | grep -q 'found'; then
              settings_stable=0
            fi
          done
          settings_log="$($adb -s "$serial" logcat -d -v threadtime 2>/dev/null | tr -d '\r' || true)"
          settings_asserts="$(printf '%s\n' "$settings_log" | grep -c 'hasReadColorBufferDma' || true)"
          printf '%s\n' "$settings_log" | grep -E -i 'ANDROID_EMU_read_color_buffer_dma|HostConnection|HostComposition|GoldfishMapper|mapper\.ranchu|RegionSampling|hasReadColorBufferDma|SurfaceFlinger.*(fatal|abort|crash)' | tail -n 500 || true
          echo "SETTINGS_ASSERT_COUNT=$settings_asserts"
          echo "SETTINGS_STABLE=$settings_stable"
          if [ "$settings_stable" != '1' ] || [ "$settings_asserts" != '0' ]; then
            echo SETTINGS_STABILITY_GATE=FAIL
            exit 20
          fi
          echo SETTINGS_STABILITY_GATE=PASS

          echo '=== APK PRESENCE ==='
          if [ ! -s "$apk" ]; then
            echo APK_PRESENT=0
            exit 30
          fi
          echo "APK_PRESENT=1 SIZE=$(stat -c '%s' "$apk")"
          installed="$($adb -s "$serial" shell pm path "$pkg" 2>/dev/null | tr -d '\r' | tail -n1 || true)"
          if [ -z "$installed" ]; then
            echo PACKAGE_INSTALL_REQUIRED=1
            "$adb" -s "$serial" install -r -t "$apk" 2>&1 | tr -d '\r'
          else
            echo "PACKAGE_INSTALL_REQUIRED=0 CURRENT_PATH=$installed"
          fi
          after_install="$($adb -s "$serial" shell pm path "$pkg" 2>/dev/null | tr -d '\r' | tail -n1 || true)"
          echo "PACKAGE_PATH_AFTER_INSTALL=$after_install"
          [ -n "$after_install" ] || exit 31

          "$adb" -s "$serial" logcat -c >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell am force-stop "$pkg" >/dev/null 2>&1 || true
          echo '=== MR SCRAP MAIN ACTIVITY ==='
          "$adb" -s "$serial" shell am start -W -n "$pkg/$activity" 2>&1 | tr -d '\r' || true
          app_stable=1
          app_pid=''
          for i in $(seq 1 8); do
            sleep 5
            ss="$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
            sf="$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
            app_pid="$($adb -s "$serial" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
            act="$($adb -s "$serial" shell service check activity 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            psvc="$($adb -s "$serial" shell service check package 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            echo "APP_SAMPLE_${i}=SS:${ss} SF:${sf} APP:${app_pid} ACT:${act} PKG:${psvc}"
            if [ "$ss" != "$ss0" ] || [ "$sf" != "$sf0" ] || [ -z "$app_pid" ] || ! printf '%s' "$act" | grep -q 'found' || ! printf '%s' "$psvc" | grep -q 'found'; then
              app_stable=0
            fi
          done
          app_log="$($adb -s "$serial" logcat -d -v threadtime 2>/dev/null | tr -d '\r' || true)"
          app_asserts="$(printf '%s\n' "$app_log" | grep -c 'hasReadColorBufferDma' || true)"
          printf '%s\n' "$app_log" | grep -E -i 'ANDROID_EMU_read_color_buffer_dma|GoldfishMapper|mapper\.ranchu|RegionSampling|hasReadColorBufferDma|FATAL EXCEPTION|ANR in com\.mrscrap\.socialradar' | tail -n 500 || true
          echo "APP_ASSERT_COUNT=$app_asserts"
          echo "APP_FINAL_PID=$app_pid"
          echo "APP_STABLE=$app_stable"
          if [ "$app_stable" != '1' ] || [ "$app_asserts" != '0' ]; then
            echo APP_STABILITY_GATE=FAIL
            exit 40
          fi
          echo APP_STABILITY_GATE=PASS

          echo '=== HOST EMULATOR DMA / FEATURE LINES ==='
          cat "$hostout" "$hosterr" 2>/dev/null | grep -E -i 'GLDirectMem|HasSharedSlotsHostMemoryAllocator|GLESDynamicVersion|read_color_buffer_dma|ReadColor|DMA|gfxstream|swangle' | tail -n 700 || true
          echo '=== FINAL CORE STATE ==='
          echo "BOOT=$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
          echo "SS=$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
          echo "SF=$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
          echo "ACTIVITY=$($adb -s "$serial" shell service check activity 2>/dev/null | tr -d '\r' | tail -n1 || true)"
          echo "PACKAGE=$($adb -s "$serial" shell service check package 2>/dev/null | tr -d '\r' | tail -n1 || true)"
          echo "APP_PID=$($adb -s "$serial" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
          echo ANDROID_UI_PROOF_COMPLETE=1
