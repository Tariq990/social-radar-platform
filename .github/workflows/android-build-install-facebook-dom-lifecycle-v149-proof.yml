name: Android Build Install Facebook DOM Desktop UA v150 Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-build-install-facebook-dom-lifecycle-v149-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  build-install-proof:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: '150'
      ANDROID_VERSION_NAME: '0.1.150-emulator-test'
      PKG: com.mrscrap.socialradar

    steps:
      - name: Checkout exact test lane without cleaning emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 1
          clean: false

      - name: Apply workspace-only desktop UA experiment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java')
          s=p.read_text()
          delay='private static final long PAGE_STARTED_EXTRACTION_DELAY_MS = 900;'
          assert s.count(delay)==1, s.count(delay)
          s=s.replace(delay, 'private static final long PAGE_STARTED_EXTRACTION_DELAY_MS = 3_000;')
          ua='            settings.setOffscreenPreRaster(true);'
          assert s.count(ua)==1, s.count(ua)
          ua_repl='\n'.join([
              ua,
              '            settings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36");',
              '            Log.i(TAG, "event=user_agent mode=desktop");'
          ])
          s=s.replace(ua,ua_repl)
          nav='                    return !isAllowedSocialUrl(request.getUrl().toString());'
          assert s.count(nav)==1, s.count(nav)
          nav_repl='\n'.join([
              '                    String target = request.getUrl().toString();',
              '                    boolean allowed = isAllowedSocialUrl(target);',
              '                    Log.i(TAG, "event=navigation_request main=" + request.isForMainFrame() +',
              '                        " allowed=" + allowed + " scheme=" + String.valueOf(request.getUrl().getScheme()) +',
              '                        " host=" + String.valueOf(request.getUrl().getHost()));',
              '                    return !allowed;'
          ])
          s=s.replace(nav,nav_repl)
          p.write_text(s)
          assert 'PAGE_STARTED_EXTRACTION_DELAY_MS = 3_000' in s
          assert 'event=user_agent mode=desktop' in s
          assert 'scheme=' in s
          print('V150_WORKSPACE_PATCH=PASS')
          PY
          git diff -- android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java | sed -n '1,170p'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure SDK and Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"; sdk="$(realpath "$sdk")"
          test -d "$sdk/platforms/android-36"; test -d "$sdk/build-tools/36.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"; test -x "$gradle"
          echo "GRADLE_BIN=$gradle" >> "$GITHUB_ENV"

      - name: Compile workspace-only v150 debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$GRADLE_BIN" -p android :app:assembleDebug --stacktrace
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"; test -s "$apk"
          echo "APK_SIZE=$(stat -c '%s' "$apk")"
          echo V150_APK_BUILD_GATE=PASS

      - name: Resolve emulator and preserve Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -s "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_BEFORE_INSTALL=1
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"

      - name: Install and launch v150 preserving app data
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          win_tmp="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/MR-SCRAP-emulator-test-150.apk"; cp "$apk" "$win_tmp"
          out="$($ADB -s "$SERIAL" install -r "$(wslpath -w "$win_tmp")" 2>&1 | tr -d '\r')"; printf '%s\n' "$out"; printf '%s' "$out" | grep -q Success
          version="$($ADB -s "$SERIAL" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 150
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_AFTER_INSTALL=1
          for i in $(seq 1 12); do code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 https://mr-scrap-api-live.onrender.com/api/health || true)"; [ "$code" = 200 ] && break; sleep 5; done
          echo "BACKEND_HEALTH_HTTP=$code"; test "$code" = 200
          $ADB -s "$SERIAL" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 10
          pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo V150_APP_LAUNCHED=1

      - name: Trigger real Grab through app UI
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:9223 "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v150-grab.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets { for($i=0;$i -lt 20;$i++){ try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 2);if($t.Count -gt 0){return $t}}catch{}; Start-Sleep -Milliseconds 300 }; throw 'targets unavailable' }
          function AppTarget { $a=@(Targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1); if($a.Count -eq 0){throw 'app target missing'}; $a[0] }
          function Eval([string]$raw,[string]$expr,[int]$seconds=10){ $u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]('ws://127.0.0.1:9223'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v} }
          $app=AppTarget
          $null=Eval ([string]$app.webSocketDebuggerUrl) "(()=>{window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));return true})()" 8
          $find=@'
          (()=>{const n=s=>String(s||'').replace(/\s+/g,' ').trim();const b=[...document.querySelectorAll('button')].find(x=>{const t=n(x.innerText||x.textContent);return t.includes('\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627')||/Grab latest 10 and analyze/i.test(t)});return{found:Boolean(b),enabled:Boolean(b&&!b.disabled)}})()
          '@
          $s=$null
          for($i=0;$i -lt 80;$i++){Start-Sleep -Milliseconds 400;$app=AppTarget;$s=Eval ([string]$app.webSocketDebuggerUrl) $find 8;if($s.found -and $s.enabled){break}}
          Write-Output ('RADAR_GRAB_BUTTON_FOUND='+$(if($s.found){'1'}else{'0'}));Write-Output ('RADAR_GRAB_BUTTON_ENABLED='+$(if($s.enabled){'1'}else{'0'}));if(!$s.found -or !$s.enabled){exit 150}
          $click=@'
          (()=>{const n=s=>String(s||'').replace(/\s+/g,' ').trim();const b=[...document.querySelectorAll('button')].find(x=>{const t=n(x.innerText||x.textContent);return t.includes('\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627')||/Grab latest 10 and analyze/i.test(t)});if(!b||b.disabled)return false;b.click();return true})()
          '@
          $clicked=Eval ([string]$app.webSocketDebuggerUrl) $click 8
          Write-Output ('REAL_GRAB_CLICKED='+$(if($clicked){'1'}else{'0'}));if(!$clicked){exit 151}
          PS
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          echo V150_REAL_GRAB_TRIGGER=PASS

      - name: Prove desktop UA navigation and collection
        shell: bash
        run: |
          set -euo pipefail
          success=''; failure=''
          for i in $(seq 1 75); do
            events="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' || true)"
            success="$(printf '%s\n' "$events" | grep -E 'event=collect_source_success platform=facebook posts=[0-9]+' | tail -n1 || true)"
            failure="$(printf '%s\n' "$events" | grep -E 'event=collect_source_error platform=facebook code=' | tail -n1 || true)"
            [ -n "$success" ] || [ -n "$failure" ] || { sleep 1; continue; }
            break
          done
          echo '=== SAFE V150 DESKTOP-UA TRACE ==='
          $ADB -s "$SERIAL" logcat -b all -d -v threadtime 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' | tail -n 340 || true
          ua_count="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'MRSCRAP_COLLECTOR.*event=user_agent mode=desktop' || true)"
          deep_count="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -Ec 'MRSCRAP_COLLECTOR.*event=navigation_request main=true allowed=false scheme=fb host=profile' || true)"
          fb_nav="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -Ec 'MRSCRAP_COLLECTOR.*event=navigation_request main=true allowed=true scheme=https host=.*facebook.com' || true)"
          started="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'MRSCRAP_COLLECTOR.*event=page_started' || true)"
          finished="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'MRSCRAP_COLLECTOR.*event=page_finished' || true)"
          max_body="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | sed -n 's/.*event=eval_result.* body=\([0-9][0-9]*\).*/\1/p' | sort -n | tail -n1)"
          echo "DESKTOP_UA_COUNT=$ua_count"; echo "FB_PROFILE_DEEPLINK_COUNT=$deep_count"; echo "ALLOWED_FACEBOOK_NAV_COUNT=$fb_nav"; echo "DOM_PAGE_STARTED_COUNT=$started"; echo "DOM_PAGE_FINISHED_COUNT=$finished"; echo "MAX_DOM_BODY_TEXT_LENGTH=${max_body:-0}"
          test "$ua_count" -gt 0
          if [ -n "$failure" ]; then code="$(printf '%s' "$failure" | sed -n 's/.*code=\([^ ]*\).*/\1/p')"; echo "FACEBOOK_COLLECTOR_FAILURE_CODE=${code:-unknown}"; exit 152; fi
          test -n "$success"
          posts="$(printf '%s' "$success" | sed -n 's/.*posts=\([0-9][0-9]*\).*/\1/p')"
          echo REQUESTED_POSTS=10; echo "FACEBOOK_POSTS_COLLECTED=$posts"; test -n "$posts"; test "$posts" -gt 0
          echo FACEBOOK_V150_COLLECTION_GATE=PASS

      - name: Prove Facebook session survives app restart
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADB:-}"; test -n "${SERIAL:-}"
          $ADB -s "$SERIAL" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 6
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA_AFTER_APP_RESTART=1
          test -n "$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v150-grab.ps1" 2>/dev/null || true
          echo FACEBOOK_SESSION_RESTART_GATE=PASS
