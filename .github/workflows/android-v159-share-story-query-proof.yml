name: Android v159 Story Query Share Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v159-share-story-query-proof.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    env:
      PKG: com.mrscrap.socialradar
    steps:
      - name: Prove story_fbid and id survive Android share delivery
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -x "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 159
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at; echo FACEBOOK_SESSION_PRESENT=1

          "$adb" -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 8
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          port=9254; "$adb" -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true; "$adb" -s "$serial" forward tcp:$port "localabstract:$socket" >/dev/null

          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-v159-story-share.ps1"
          cat > "$ps1" <<'PS'
          param([int]$Port,[string]$Action,[string]$ExpectedB64='')
          $ErrorActionPreference='Stop'
          function Eval([string]$expr){$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$Port/json/list" -TimeoutSec 5);$t=@($rows|Where-Object{$_.type-eq'page'-and[string]$_.url-like'https://localhost*'})[0];if(!$t){throw'target'};$u=[Uri][string]$t.webSocketDebuggerUrl;$w=[System.Net.WebSockets.ClientWebSocket]::new();$c=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(60));$w.ConnectAsync([Uri]("ws://127.0.0.1:$Port"+$u.PathAndQuery),$c.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$w.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$c.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new();while($true){$r=$w.ReceiveAsync([ArraySegment[byte]]::new($buf),$c.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id-eq 1){return $m.result.result.value}}}
          if($Action-eq'arm'){$null=Eval "(()=>{window.__storyShare='';window.addEventListener('mrscrap:share',e=>{window.__storyShare=typeof e?.detail?.text==='string'?e.detail.text:''},{once:true});return true})()";Write-Output STORY_SHARE_OBSERVER_ARMED=1;exit 0}
          $expected=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($ExpectedB64));$q=$expected|ConvertTo-Json -Compress
          $r=Eval "(()=>{const e=$q,t=window.__storyShare||'',m=Boolean(document.querySelector('#modal-add-source'));let ok=false;try{const a=new URL(e),b=new URL(t);ok=t===e&&b.searchParams.get('story_fbid')===a.searchParams.get('story_fbid')&&b.searchParams.get('id')===a.searchParams.get('id')}catch{}return{exact:t===e,identity:ok,modal:m}})()"
          Write-Output ('STORY_QUERY_EVENT_EXACT='+$(if($r.exact){'1'}else{'0'}));Write-Output ('STORY_QUERY_IDENTITY_PRESERVED='+$(if($r.identity){'1'}else{'0'}));Write-Output ('STORY_QUERY_ADD_SOURCE_MODAL='+$(if($r.modal){'1'}else{'0'}));if(!$r.exact-or!$r.identity-or!$r.modal){exit 253}
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" -Port "$port" -Action arm | tr -d '\r'
          url='https://www.facebook.com/story.php?story_fbid=111&id=222&utm_source=share_probe'
          "$adb" -s "$serial" shell "am start -W -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT '$url' -n '$PKG/.MainActivity'" >/dev/null
          sleep 3
          b64="$(printf '%s' "$url" | base64 -w0)"
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" -Port "$port" -Action probe -ExpectedB64 "$b64" | tr -d '\r'
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          "$adb" -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true; rm -f "$ps1" 2>/dev/null || true
          echo FACEBOOK_SESSION_AFTER_STORY_SHARE_PROOF=1
          echo V159_STORY_QUERY_SHARE_IDENTITY_GATE=PASS
