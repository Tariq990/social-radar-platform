name: Android Facebook Pending Phase Instrument

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-facebook-pending-phase-instrument.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  instrument-build-probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      PKG: com.mrscrap.socialradar
      ANDROID_VERSION_CODE: '144'
      ANDROID_VERSION_NAME: '0.1.144-emulator-test'
    steps:
      - name: Checkout exact test lane without deleting caches or APK
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 0
          clean: false

      - name: Add safe pending-phase log only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/mrscrap/socialradar/FacebookGraphqlWebViewCollector.java')
          s = p.read_text()
          needle = 'if (result.optBoolean("pending", false)) {'
          if s.count(needle) != 1:
              raise SystemExit(f'expected one pending block, got {s.count(needle)}')
          idx = s.index(needle)
          line_start = s.rfind('\n', 0, idx) + 1
          indent = s[line_start:idx]
          marker = 'JSONArray posts = result.optJSONArray("posts");'
          marker_idx = s.index(marker, idx)
          marker_line_start = s.rfind('\n', 0, marker_idx) + 1
          old_block = s[line_start:marker_line_start]
          if 'main.postDelayed(poll[0], POLL_MS);' not in old_block or 'return;' not in old_block:
              raise SystemExit('unexpected pending block shape')
          new_block = (
              f'{indent}if (result.optBoolean("pending", false)) {{\n'
              f'{indent}    JSONObject diagnostics = result.optJSONObject("diagnostics");\n'
              f'{indent}    String waitingFor = diagnostics == null ? "" : diagnostics.optString("waitingFor", "");\n'
              f'{indent}    String phase = "source_id".equals(waitingFor) ? "source_id" : "request";\n'
              f'{indent}    Log.i(TAG, "event=graphql_pending attempt=" + attempts[0] + " phase=" + phase);\n'
              f'{indent}    main.postDelayed(poll[0], POLL_MS);\n'
              f'{indent}    return;\n'
              f'{indent}}}\n'
          )
          s = s[:line_start] + new_block + s[marker_line_start:]
          p.write_text(s)
          print('SAFE_PENDING_PHASE_INSTRUMENTATION=PASS')
          PY
          git diff --check
          grep -n 'event=graphql_pending' android/app/src/main/java/com/mrscrap/socialradar/FacebookGraphqlWebViewCollector.java

      - name: Commit instrumentation source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/mrscrap/socialradar/FacebookGraphqlWebViewCollector.java
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'test: log safe Facebook GraphQL pending phase'
          git push origin HEAD:test/android-headless-emulator-20260909

      - name: Build instrumented APK incrementally
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/capacitor.settings.gradle ]; then
            npm install --no-audit --no-fund
            npm run build
            npx cap sync android
          fi
          if [ ! -f android/local.properties ]; then
            sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
            sdk="$(realpath "$sdk")"
            printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          fi
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"
          test -x "$gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK_SIZE=$(stat -c '%s' "$apk")"
          echo INSTRUMENTED_APK_BUILD=PASS

      - name: Install version 144 with Facebook session preserved
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"
          test -s "$adb"; test -n "$serial"
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_BEFORE_INSTALL=1
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          win_apk="/mnt/c/Users/${win_user}/AppData/Local/Temp/MR-SCRAP-emulator-test-144.apk"
          cp "$apk" "$win_apk"
          out="$($adb -s "$serial" install -r "$(wslpath -w "$win_apk")" 2>&1 | tr -d '\r')"
          printf '%s\n' "$out"; printf '%s' "$out" | grep -q Success
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 144
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_INSTALL=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 5
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"; test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"; echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo INSTALL_AND_SESSION_PRESERVATION=PASS

      - name: Click the real Grab latest 10 button
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"
          test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:9223 "localabstract:$socket" >/dev/null
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-click-144.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          $targets=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 4)
          $app=@($targets|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1)
          if($app.Count -eq 0){throw 'app target missing'}
          $uri=[Uri][string]$app[0].webSocketDebuggerUrl; $url='ws://127.0.0.1:9223'+$uri.PathAndQuery
          $ws=[System.Net.WebSockets.ClientWebSocket]::new(); $cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(10)); $ws.ConnectAsync([Uri]$url,$cts.Token).GetAwaiter().GetResult()|Out-Null
          $expr=@'
          (()=>{const ar='\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627';const b=[...document.querySelectorAll('button')].find(x=>{const t=String(x.innerText||x.textContent||'').replace(/\s+/g,' ').trim();return t.includes(ar)||/Grab latest 10 and analyze/i.test(t)});if(!b)return{clicked:false};b.click();return{clicked:true}})()
          '@
          $payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true}}|ConvertTo-Json -Compress -Depth 8; $bytes=[Text.Encoding]::UTF8.GetBytes($payload); $ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null
          $buf=New-Object byte[] 65536
          while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();$m=([Text.Encoding]::UTF8.GetString($buf,0,$r.Count)|ConvertFrom-Json);if($m.id -eq 1){$clicked=[bool]$m.result.result.value.clicked;Write-Output ('REAL_GRAB_BUTTON_CLICKED='+$(if($clicked){'1'}else{'0'}));if(!$clicked){exit 70};break}}
          try{$ws.Abort()}catch{}
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          echo GRAB_TRIGGER=PASS

      - name: Capture safe pending phase and terminal result
        shell: bash
        run: |
          set -euo pipefail
          sleep 34
          echo '=== SAFE FACEBOOK COLLECTOR TRACE ==='
          $ADB -s "$SERIAL" logcat -b all -d -v threadtime 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' | tail -n 180 || true
          syntax_count="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'Uncaught SyntaxError: Invalid or unexpected token' || true)"
          source_pending="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'event=graphql_pending.*phase=source_id' || true)"
          request_pending="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'event=graphql_pending.*phase=request' || true)"
          success="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -E 'event=collect_source_success platform=facebook posts=[0-9]+' | tail -n1 || true)"
          failure="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -E 'event=collect_source_error platform=facebook code=' | tail -n1 || true)"
          echo "INVALID_JS_SYNTAX_COUNT=$syntax_count"
          echo "SOURCE_ID_PENDING_COUNT=$source_pending"
          echo "REQUEST_PENDING_COUNT=$request_pending"
          if [ -n "$success" ]; then
            posts="$(printf '%s' "$success" | sed -n 's/.*posts=\([0-9][0-9]*\).*/\1/p')"; echo "FACEBOOK_POSTS_COLLECTED=$posts"; echo FACEBOOK_COLLECTION_TERMINAL=success
          elif [ -n "$failure" ]; then
            code="$(printf '%s' "$failure" | sed -n 's/.*code=\([^ ]*\).*/\1/p')"; echo "FACEBOOK_COLLECTION_FAILURE_CODE=${code:-unknown}"; echo FACEBOOK_COLLECTION_TERMINAL=failure
          else
            echo FACEBOOK_COLLECTION_TERMINAL=missing
          fi
          test "$syntax_count" -eq 0
          if [ "$source_pending" -gt 0 ]; then echo DIAGNOSED_PENDING_PHASE=source_id; elif [ "$request_pending" -gt 0 ]; then echo DIAGNOSED_PENDING_PHASE=request; else echo DIAGNOSED_PENDING_PHASE=unknown; fi
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at; echo FACEBOOK_SESSION_FINAL=1
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-click-144.ps1" 2>/dev/null || true
          echo PENDING_PHASE_PROOF_COMPLETE=1
