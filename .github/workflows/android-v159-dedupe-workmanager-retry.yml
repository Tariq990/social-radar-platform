name: Android v159 WorkManager Dedupe Retry

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v159-dedupe-workmanager-retry.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar
    steps:
      - name: Prove isolated repeated WorkManager ingest is idempotent
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -x "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 159
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at; echo FACEBOOK_SESSION_PRESENT=1
          $adb -s "$serial" logcat -c >/dev/null 2>&1 || true
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 10
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          port=9243; $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true; $adb -s "$serial" forward tcp:$port "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-v159-dedupe-retry.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9243
          function Target { for($i=0;$i-lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$hits=@($rows|Where-Object{$_.type-eq'page'-and[string]$_.url-like'https://localhost*'});if($hits.Count-gt 0){return $hits[0]}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing'}
          function Eval([string]$expr,[int]$seconds=600){$t=Target;$raw=[string](@($t)[0].webSocketDebuggerUrl);$u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 12;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id-ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};return $m.result.result.value}}
          $expr=@'
          (async()=>{const base='https://mr-scrap-api-live.onrender.com',sleep=ms=>new Promise(r=>setTimeout(r,ms)),j=async r=>{try{return await r.json()}catch{return null}};const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;const out={stage:'start',globalRules:-1,firstCount:-1,secondCount:-1,secondCheck:false,alertsBefore:-1,alertsAfter:-1,clean:false,facebookAfter:false};let id='';try{if(!cap){out.stage='plugin';return out}const oldr=await fetch(base+'/api/sources',{credentials:'include'}),old=await j(oldr);if(!oldr.ok||!Array.isArray(old)){out.stage='sources';return out}for(const p of old.filter(x=>typeof x?.external_id==='string'&&x.external_id.startsWith('dedupeprobe_emulator_'))){try{await cap.cancelSource({sourceId:p.id})}catch{};await fetch(base+'/api/sources/'+encodeURIComponent(p.id),{method:'DELETE',credentials:'include'})}const [sr,rr,ar]=await Promise.all([fetch(base+'/api/sources',{credentials:'include'}),fetch(base+'/api/rules',{credentials:'include'}),fetch(base+'/api/alerts',{credentials:'include'})]),sources=await j(sr),rules=await j(rr),alerts=await j(ar);if(!sr.ok||!rr.ok||!ar.ok||!Array.isArray(sources)||!Array.isArray(rules)||!Array.isArray(alerts)){out.stage='backend';return out}out.alertsBefore=alerts.length;out.globalRules=rules.filter(r=>r&&r.enabled===true&&(!Array.isArray(r.source_ids||r.sourceIds)||(r.source_ids||r.sourceIds).length===0)).length;const real=sources.find(x=>x&&x.platform==='facebook'&&!Boolean(x.is_paused??x.isPaused)&&(x.connector_type||x.connectorType||'device_session')==='device_session'),st=await cap.status(),auth=await cap.getBackendAuth();const connected=st?.facebookConnected===true||(st?.facebookConnected==null&&st?.connected===true);if(out.globalRules!==0||!real||!connected||auth?.configured!==true){out.stage='unsafe';return out}const cr=await fetch(base+'/api/sources',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({externalId:'dedupeprobe_emulator_'+Date.now(),url:real.url,name:'Dedupe Emulator Probe',visibilityType:'authenticated',connectorType:'device_session'})}),created=await j(cr);if(!cr.ok||typeof created?.id!=='string'){out.stage='create';return out}id=created.id;const sch1=await cap.scheduleSource({sourceId:id,url:real.url,platform:'facebook',backendBaseUrl:base,locale:'en'});if(sch1?.scheduled!==true){out.stage='schedule1';return out}let first=null;for(let i=0;i<240;i++){const r=await fetch(base+'/api/sources',{credentials:'include'}),a=await j(r),s=r.ok&&Array.isArray(a)?a.find(x=>x?.id===id):null,c=Number(s?.recentPostsCount||0),t=String(s?.last_checked_at||s?.lastCheckedAt||'');if(s&&c>0&&t){first={count:c,checked:t};break}await sleep(1000)}if(!first){out.stage='first_timeout';return out}out.firstCount=first.count;await cap.cancelSource({sourceId:id});const sch2=await cap.scheduleSource({sourceId:id,url:real.url,platform:'facebook',backendBaseUrl:base,locale:'en'});if(sch2?.scheduled!==true){out.stage='schedule2';return out}let second=null;for(let i=0;i<240;i++){const r=await fetch(base+'/api/sources',{credentials:'include'}),a=await j(r),s=r.ok&&Array.isArray(a)?a.find(x=>x?.id===id):null,t=String(s?.last_checked_at||s?.lastCheckedAt||'');if(s&&t&&t!==first.checked){second={count:Number(s?.recentPostsCount||0),checked:t};break}await sleep(1000)}if(!second){out.stage='second_timeout';return out}out.secondCount=second.count;out.secondCheck=true;const ar2=await fetch(base+'/api/alerts',{credentials:'include'}),a2=await j(ar2);out.alertsAfter=ar2.ok&&Array.isArray(a2)?a2.length:-1;out.stage='done';return out}finally{if(id){try{await cap.cancelSource({sourceId:id})}catch{};try{await fetch(base+'/api/sources/'+encodeURIComponent(id),{method:'DELETE',credentials:'include'})}catch{}}try{const vr=await fetch(base+'/api/sources',{credentials:'include'}),v=await j(vr);out.clean=vr.ok&&Array.isArray(v)&&v.filter(x=>typeof x?.external_id==='string'&&x.external_id.startsWith('dedupeprobe_emulator_')).length===0;const st2=cap?await cap.status():null;out.facebookAfter=st2?.facebookConnected===true||(st2?.facebookConnected==null&&st2?.connected===true)}catch{}}})()
          '@
          $r=Eval $expr 600
          Write-Output ('DEDUPE_STAGE='+[string]$r.stage);Write-Output ('GLOBAL_ENABLED_RULES='+[int]$r.globalRules);Write-Output ('FIRST_POST_COUNT='+[int]$r.firstCount);Write-Output ('SECOND_POST_COUNT='+[int]$r.secondCount);Write-Output ('SECOND_CHECK_COMPLETED='+$(if($r.secondCheck){'1'}else{'0'}));Write-Output ('ALERTS_BEFORE='+[int]$r.alertsBefore);Write-Output ('ALERTS_AFTER='+[int]$r.alertsAfter);Write-Output ('PROBE_CLEAN='+$(if($r.clean){'1'}else{'0'}));Write-Output ('FACEBOOK_SESSION_AFTER='+$(if($r.facebookAfter){'1'}else{'0'}))
          if([string]$r.stage-ne'done' -or [int]$r.globalRules-ne 0 -or [int]$r.firstCount-ne 10 -or !$r.secondCheck -or [int]$r.secondCount-lt[int]$r.firstCount -or [int]$r.secondCount-gt 20 -or [int]$r.alertsAfter-ne[int]$r.alertsBefore -or !$r.clean -or !$r.facebookAfter){exit 254}
          PS
          out="$RUNNER_TEMP/mrscrap-v159-dedupe-result.txt"
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r' | tee "$out"
          first="$(sed -n 's/^FIRST_POST_COUNT=//p' "$out" | tail -n1)"; second="$(sed -n 's/^SECOND_POST_COUNT=//p' "$out" | tail -n1)"
          test "$first" = 10; test -n "$second"
          raw="$RUNNER_TEMP/mrscrap-v159-dedupe-logcat.txt"
          $adb -s "$serial" logcat -d -v brief MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' > "$raw" || true
          RAW="$raw" python3 - <<'PY' > "$RUNNER_TEMP/mrscrap-v159-dedupe-batches.txt"
          import os,re,sys
          lines=open(os.environ['RAW'],encoding='utf-8',errors='ignore').read().splitlines(); seg=[]; cur=None
          for line in lines:
              if 'event=load_start' in line:
                  if cur is not None: seg.append(cur)
                  cur=[]
              elif cur is not None and 'event=eval_result' in line:
                  m=re.search(r'posts=(\d+)',line)
                  if m: cur.append(int(m.group(1)))
          if cur is not None: seg.append(cur)
          finals=[x[-1] for x in seg if x]
          print(f'SEGMENTS={len(finals)}')
          print('LAST2='+(','.join(map(str,finals[-2:])) if len(finals)>=2 else ''))
          PY
          cat "$RUNNER_TEMP/mrscrap-v159-dedupe-batches.txt"
          segments="$(sed -n 's/^SEGMENTS=//p' "$RUNNER_TEMP/mrscrap-v159-dedupe-batches.txt")"
          last2="$(sed -n 's/^LAST2=//p' "$RUNNER_TEMP/mrscrap-v159-dedupe-batches.txt")"
          test "$segments" = 2
          test "$last2" = 10,10
          delta=$((second-first)); duplicates=$((10-delta))
          echo "SECOND_NEW_POSTS=$delta"
          echo "SECOND_DUPLICATES_INFERRED=$duplicates"
          test "$delta" -ge 0; test "$delta" -le 10; test "$duplicates" -ge 1
          echo V159_WORKMANAGER_INGEST_IDEMPOTENCY_GATE=PASS
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true; rm -f "$ps1" 2>/dev/null || true
