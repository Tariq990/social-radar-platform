name: Code Complete Gate

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-backend-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Build frontend and backend
        run: npm run build
        env:
          APP_MODE: demo
          VITE_API_BASE_URL: https://example.invalid

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-scrap-code-complete-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
