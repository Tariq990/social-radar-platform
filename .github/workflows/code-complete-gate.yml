name: Code Complete Gate

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-backend-android:
    # Hosted ubuntu jobs are currently failing before runner assignment on this repository.
    # Use the existing isolated Linux self-hosted validation runner; this workflow has no
    # secrets/deploy permissions and only one heavy validation job is scheduled at a time.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Build frontend and backend
        run: npm run build
        env:
          APP_MODE: demo
          VITE_API_BASE_URL: https://example.invalid

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          sdk="$(realpath "$sdk")"
          test -d "$sdk/platforms/android-36"
          test -d "$sdk/build-tools/36.0.0"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties

      - name: Verify pinned Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"
          test -x "$gradle"
          "$gradle" --version

      - name: Assemble Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-scrap-code-complete-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
