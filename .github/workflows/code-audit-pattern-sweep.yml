name: Code Audit Pattern Sweep

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/code-audit-pattern-sweep.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-code-audit-pattern-sweep
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          clean: false
          fetch-depth: 1
      - name: Privacy-safe high-risk pattern inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src'), Path('server'), Path('android/app/src/main/java')]
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.java'}
          patterns = {
              'RAW_ERROR_MESSAGE': re.compile(r'\b(?:error|err|exception|sourceError|evalError)\??\.message\b', re.I),
              'CONSOLE_OUTPUT': re.compile(r'\bconsole\.(?:log|warn|error|debug)\s*\('),
              'CLEARTEXT_LITERAL': re.compile(r'http://', re.I),
              'DYNAMIC_CODE': re.compile(r'\b(?:eval\s*\(|new\s+Function\s*\(|dangerouslySetInnerHTML\b)'),
              'WINDOW_OPEN': re.compile(r'\bwindow\.open\s*\('),
              'LOCAL_STORAGE': re.compile(r'\blocalStorage\b'),
              'FETCH_CALL': re.compile(r'\bfetch\s*\('),
              'DEMO_FAKE_MARKER': re.compile(r'\b(?:demo|mock|fake|unsplash)\b', re.I),
              'ANDROID_JS_BRIDGE': re.compile(r'\baddJavascriptInterface\s*\('),
              'ANDROID_FILE_ACCESS': re.compile(r'\bsetAllow(?:File|Content)Access\s*\('),
          }

          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in extensions)

          print(f'PRODUCTION_FILES_SCANNED={len(files)}')
          for label, rx in patterns.items():
              hits = []
              for path in files:
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(lines, 1):
                      if rx.search(line):
                          hits.append(f'{path}:{lineno}')
              print(f'{label}_COUNT={len(hits)}')
              for hit in hits[:120]:
                  print(f'{label}_AT={hit}')
              if len(hits) > 120:
                  print(f'{label}_TRUNCATED=1')
          print('CODE_AUDIT_PATTERN_SWEEP_COMPLETE=1')
          PY
