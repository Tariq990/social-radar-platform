name: Apply Final Code Audit Fixes

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/apply-final-code-audit-fixes.yml]

permissions:
  contents: write

concurrency:
  group: scrap-app-final-code-audit-fixes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          clean: false
          fetch-depth: 1
      - name: Apply exact audited replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('src/lib/privacy.ts').write_text("""const BLOCKED_METADATA_KEY_PARTS = [
            'cookie', 'cookies', 'password', 'passwd', 'session', 'sessionid', 'xs', 'c_user',
            'token', 'access_token', 'authorization', 'bearer', 'credential', 'secret'
          ] as const;

          /**
           * Sanitizes collector metadata before it can cross a network boundary.
           * Only bounded primitive diagnostics are retained; secret-shaped and nested values are dropped.
           */
          export function sanitizeTransportMetadata(value: unknown): Record<string, unknown> {
            if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
            const output: Record<string, unknown> = {};
            let kept = 0;
            for (const [rawKey, entry] of Object.entries(value as Record<string, unknown>)) {
              if (kept >= 64) break;
              const key = rawKey.trim().slice(0, 80);
              if (!key) continue;
              const lower = key.toLowerCase();
              if (BLOCKED_METADATA_KEY_PARTS.some(part => lower.includes(part))) continue;
              if (typeof entry === 'string') {
                output[key] = entry.slice(0, 2000);
                kept++;
              } else if (typeof entry === 'number' && Number.isFinite(entry)) {
                output[key] = entry;
                kept++;
              } else if (typeof entry === 'boolean' || entry === null) {
                output[key] = entry;
                kept++;
              }
            }
            return output;
          }
          """, encoding='utf-8')

          replace_once(
              'src/services/api.ts',
              "import { Source, WatchRule, AlertMatch, NormalizedPost, ConnectorStatus, ConnectorType, SourcePlatform } from '../types';\n",
              "import { Source, WatchRule, AlertMatch, NormalizedPost, ConnectorStatus, ConnectorType, SourcePlatform } from '../types';\nimport { sanitizeTransportMetadata } from '../lib/privacy';\n"
          )
          replace_once(
              'src/services/api.ts',
              '    metadata: post.metadata\n',
              '    metadata: sanitizeTransportMetadata(post.metadata)\n'
          )

          replace_once(
              'src/connectors/deviceSessionConnector.ts',
              "import { NormalizedPost, SocialComment, SourcePlatform } from '../types';\n",
              "import { NormalizedPost, SocialComment, SourcePlatform } from '../types';\nimport { sanitizeTransportMetadata } from '../lib/privacy';\n"
          )
          replace_once(
              'src/connectors/deviceSessionConnector.ts',
              "    metadata: { ...(post.metadata || {}), ingestion: 'android_device_session' }\n",
              "    metadata: { ...sanitizeTransportMetadata(post.metadata), ingestion: 'android_device_session' }\n"
          )
          replace_once(
              'src/connectors/deviceSessionConnector.ts',
              "function toNormalizedPost(source: { id: string; platform: SourcePlatform; url: string; externalId: string; displayName?: string; avatarUrl?: string }, post: NativeCollectedPost): NormalizedPost | null {\n",
              "function detailCollectionErrorCode(error: unknown): string {\n  const message = error instanceof Error ? error.message : String(error || '');\n  if (/SESSION_CHECKPOINT/i.test(message)) return 'SESSION_CHECKPOINT';\n  if (/SESSION_REQUIRED|session expired|session is not connected/i.test(message)) return 'SESSION_REQUIRED';\n  if (/timed out|timeout/i.test(message)) return 'DETAIL_TIMEOUT';\n  return 'DETAIL_COLLECTION_FAILED';\n}\n\nfunction toNormalizedPost(source: { id: string; platform: SourcePlatform; url: string; externalId: string; displayName?: string; avatarUrl?: string }, post: NativeCollectedPost): NormalizedPost | null {\n"
          )
          replace_once(
              'src/connectors/deviceSessionConnector.ts',
              "          detailError: String(error?.message || 'Post detail collection failed').slice(0, 300)\n",
              "          detailError: detailCollectionErrorCode(error)\n"
          )

          replace_once(
              'server/worker/deviceIngestion.ts',
              "    } catch (error: any) {\n      result.evaluationErrors.push({\n        postId: post.id,\n        ruleId: rule.id,\n        error: String(error?.message || 'AI evaluation failed').slice(0, 500)\n      });\n    }\n",
              "    } catch {\n      result.evaluationErrors.push({\n        postId: post.id,\n        ruleId: rule.id,\n        error: 'EVALUATION_FAILED'\n      });\n    }\n"
          )

          replace_once(
              'server/worker/monitoringWorker.ts',
              "    } catch (evalError: any) {\n      const message = String(evalError?.message || 'AI evaluation failed').slice(0, 500);\n      await db.logConnectorEvent(source.id, 'ai_evaluation', 'error', `Rule ${rule.id}: ${message}`);\n    }\n",
              "    } catch {\n      await db.logConnectorEvent(source.id, 'ai_evaluation', 'error', `Rule ${rule.id}: EVALUATION_FAILED`);\n    }\n"
          )
          replace_once(
              'server/worker/monitoringWorker.ts',
              "        } catch (sourceError: any) {\n          const message = String(sourceError?.message || 'Unknown source fetch error').slice(0, 500);\n          result.errors.push({ sourceId: source.id, error: message });\n          const status = (source.consecutive_failures || 0) >= 2 ? 'needs_attention' : 'error';\n          await db.updateSourceHealth(source.id, status, false, message);\n          await db.logConnectorEvent(source.id, 'fetch', 'error', message);\n        }\n",
              "        } catch {\n          const errorCode = 'SOURCE_FETCH_FAILED';\n          result.errors.push({ sourceId: source.id, error: errorCode });\n          const status = (source.consecutive_failures || 0) >= 2 ? 'needs_attention' : 'error';\n          await db.updateSourceHealth(source.id, status, false, errorCode);\n          await db.logConnectorEvent(source.id, 'fetch', 'error', errorCode);\n        }\n"
          )

          helper = """function detectSourcePlatform(rawUrl: string): SourcePlatform {
            try {
              const parsed = new URL(rawUrl);
              if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return 'other';
              const host = parsed.hostname.toLowerCase();
              if (host === 'instagram.com' || host.endsWith('.instagram.com') || host === 'instagr.am' || host.endsWith('.instagr.am')) return 'instagram';
              if (host === 'facebook.com' || host.endsWith('.facebook.com') || host === 'fb.com' || host.endsWith('.fb.com') || host === 'fb.watch') return 'facebook';
            } catch {
              return 'other';
            }
            return 'other';
          }

          """
          replace_once(
              'server/connectors/sourceConnector.ts',
              '/**\n * Server-side connector manager.\n',
              helper + '/**\n * Server-side connector manager.\n'
          )
          replace_once(
              'server/connectors/sourceConnector.ts',
              "      const isFb = rawUrl.includes('facebook.com');\n",
              "      const demoPlatform = detectSourcePlatform(rawUrl);\n      if (demoPlatform === 'other') {\n        return {\n          valid: false, platform: 'other', externalId: '', name: '', handle: '', url: '',\n          visibilityType: 'authenticated', connectorType: 'device_session', connectorStatus: 'error',\n          requiresAuthentication: true, error: 'Only Facebook and Instagram sources are supported in this phase.'\n        };\n      }\n      const isFb = demoPlatform === 'facebook';\n"
          )
          replace_once(
              'server/connectors/sourceConnector.ts',
              "    const platform: SourcePlatform = rawUrl.includes('instagram.com') ? 'instagram' : rawUrl.includes('facebook.com') || rawUrl.includes('fb.com') || rawUrl.includes('fb.watch') ? 'facebook' : 'other';\n",
              "    const platform: SourcePlatform = detectSourcePlatform(rawUrl);\n"
          )

          db_replacements = [
              ("          console.log('[Database] Connected to PostgreSQL at', dbUrl.split('@')[1] || 'remote instance');\n", "          console.log('[Database] PostgreSQL connection established.');\n"),
              ("        console.warn('[Database] PostgreSQL connection failed, falling back to local persistent store:', (err as any)?.message);\n", "        console.warn('[Database] PostgreSQL connection failed; local fallback will be used only where application mode permits it.');\n"),
              ("    console.log('[Database] Local persistent store loaded from', this.localFilePath);\n", "    console.log('[Database] Local persistent store loaded.');\n"),
              ("    } catch (e) { console.error('[Database] Failed to read local storage file, starting fresh', e); }\n", "    } catch { console.error('[Database] Failed to read local storage file; starting with an empty local store.'); }\n"),
              ("    } catch (e) { console.error('[Database] Failed to persist data to disk', e); }\n", "    } catch { console.error('[Database] Failed to persist local data.'); }\n")
          ]
          for old, new in db_replacements:
              replace_once('server/db/database.ts', old, new)

          Path('server/tests/finalPrivacyBoundary.test.ts').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { sanitizeTransportMetadata } from '../../src/lib/privacy';
          import { SourceConnectorManager } from '../connectors/sourceConnector';

          test('transport metadata drops secret-shaped and nested values before network use', () => {
            const safe = sanitizeTransportMetadata({
              feedIndex: 3,
              pinned: false,
              collector: 'dom',
              c_user: 'must-not-leave-device',
              xs: 'must-not-leave-device',
              CookieHeader: 'must-not-leave-device',
              access_token: 'must-not-leave-device',
              nested: { token: 'must-not-leave-device' }
            });
            assert.deepEqual(safe, { feedIndex: 3, pinned: false, collector: 'dom' });
          });

          test('device ingestion sanitizes metadata before serializing the request', () => {
            const api = fs.readFileSync('src/services/api.ts', 'utf8');
            const connector = fs.readFileSync('src/connectors/deviceSessionConnector.ts', 'utf8');
            assert.match(api, /metadata: sanitizeTransportMetadata\(post\.metadata\)/);
            assert.match(connector, /sanitizeTransportMetadata\(post\.metadata\)/);
            assert.doesNotMatch(connector, /detailError: String\(error\?\.message/);
            assert.match(connector, /detailError: detailCollectionErrorCode\(error\)/);
          });

          test('worker errors are structural and do not persist raw exception messages', () => {
            const ingest = fs.readFileSync('server/worker/deviceIngestion.ts', 'utf8');
            const monitor = fs.readFileSync('server/worker/monitoringWorker.ts', 'utf8');
            assert.match(ingest, /error: 'EVALUATION_FAILED'/);
            assert.doesNotMatch(ingest, /String\(error\?\.message \|\| 'AI evaluation failed'/);
            assert.match(monitor, /SOURCE_FETCH_FAILED/);
            assert.match(monitor, /EVALUATION_FAILED/);
            assert.doesNotMatch(monitor, /sourceError\?\.message|evalError\?\.message/);
          });

          test('source connector classifies by URL hostname, not query/path substrings', async () => {
            const manager = new SourceConnectorManager();
            const result = await manager.resolve({ url: 'https://evil.example/?next=facebook.com' }, false);
            assert.equal(result.valid, false);
            assert.equal(result.platform, 'other');
          });

          test('database diagnostics do not print database URL fragments, local paths, or raw exceptions', () => {
            const database = fs.readFileSync('server/db/database.ts', 'utf8');
            assert.doesNotMatch(database, /dbUrl\.split\('@'\)/);
            assert.doesNotMatch(database, /Local persistent store loaded from/);
            assert.doesNotMatch(database, /starting fresh', e|persist data to disk', e/);
          });
          """, encoding='utf-8')
          PY

          git rm .github/workflows/apply-final-code-audit-fixes.yml
          git config user.name "Tariq Ziad"
          git config user.email "102293222+Tariq990@users.noreply.github.com"
          git add src/lib/privacy.ts src/services/api.ts src/connectors/deviceSessionConnector.ts server/worker/deviceIngestion.ts server/worker/monitoringWorker.ts server/connectors/sourceConnector.ts server/db/database.ts server/tests/finalPrivacyBoundary.test.ts
          git diff --cached --check
          git commit -m "fix: close final privacy and trust-boundary gaps"
          git push origin HEAD:test/android-headless-emulator-20260909
