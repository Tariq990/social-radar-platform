name: Android Persistent Emulator Runtime

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-persistent-emulator-runtime.yml]
  workflow_dispatch:
    inputs:
      headless:
        description: Start without an emulator window
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    steps:
      - name: Create or reuse persistent AVD and start it on Windows
        shell: bash
        run: |
          set -euo pipefail

          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          test -n "$win_user"

          android_wsl="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidCLI/android.exe"
          sdk_wsl="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          sdk_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          emulator_wsl="${sdk_wsl}/emulator/emulator.exe"
          adb_wsl="${sdk_wsl}/platform-tools/adb.exe"
          image_wsl="${sdk_wsl}/system-images/android-36/google_apis/x86_64/system.img"
          stdout_wsl="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-emulator.stdout.log"
          stderr_wsl="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-emulator.stderr.log"

          test -s "$android_wsl"
          test -s "$emulator_wsl"
          test -s "$adb_wsl"
          test -s "$image_wsl"

          export ANDROID_SDK_ROOT="$sdk_win"
          export ANDROID_HOME="$sdk_win"

          echo RUNTIME_SDK_READY=1

          avds="$($emulator_wsl -list-avds 2>/dev/null | tr -d '\r' | sed '/^[[:space:]]*$/d' || true)"
          avd_name="$(printf '%s\n' "$avds" | head -n1)"

          if [ -z "$avd_name" ]; then
            echo AVD_CREATE_REQUIRED=1
            set +e
            "$android_wsl" --no-metrics --sdk="$sdk_win" emulator create medium_phone 2>&1 |
              tr -d '\r' |
              sed -E 's/([0-9]{5,})/[number]/g'
            create_rc=("${PIPESTATUS[@]}")
            set -e
            echo "AVD_CREATE_RC=${create_rc[0]}"
          else
            echo AVD_REUSED=1
          fi

          avds="$($emulator_wsl -list-avds 2>/dev/null | tr -d '\r' | sed '/^[[:space:]]*$/d' || true)"
          avd_name="$(printf '%s\n' "$avds" | head -n1)"
          if [ -z "$avd_name" ]; then
            echo AVD_VERIFY=FAIL
            exit 1
          fi
          echo AVD_READY=1

          existing="$($adb_wsl devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
          if [ -n "$existing" ]; then
            echo EMULATOR_REUSED=1
            echo EMULATOR_SERIAL_PRESENT=1
          else
            echo EMULATOR_START_REQUIRED=1

            launch_headless=true
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.headless }}" != "true" ]; then
              launch_headless=false
            fi

            ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-start-emulator.ps1"
            cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference = 'Stop'
          \$env:ANDROID_SDK_ROOT = '${sdk_win}'
          \$env:ANDROID_HOME = '${sdk_win}'
          \$emulator = '${sdk_win}\\emulator\\emulator.exe'
          \$stdout = Join-Path \$env:LOCALAPPDATA 'Temp\\mrscrap-emulator.stdout.log'
          \$stderr = Join-Path \$env:LOCALAPPDATA 'Temp\\mrscrap-emulator.stderr.log'
          Remove-Item \$stdout,\$stderr -Force -ErrorAction SilentlyContinue

          Get-CimInstance Win32_Process -Filter "Name='emulator.exe'" -ErrorAction SilentlyContinue |
            Where-Object { \$_.ExecutablePath -eq \$emulator } |
            ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1

          \$args = @('@${avd_name}','-no-audio','-no-boot-anim','-no-snapshot','-gpu','swiftshader_indirect','-verbose')
          if ('${launch_headless}' -eq 'true') { \$args += '-no-window' }
          \$windowStyle = if ('${launch_headless}' -eq 'true') { 'Hidden' } else { 'Normal' }
          \$p = Start-Process -FilePath \$emulator -ArgumentList \$args -WindowStyle \$windowStyle -RedirectStandardOutput \$stdout -RedirectStandardError \$stderr -PassThru
          Write-Output 'EMULATOR_PROCESS_STARTED=1'
          Write-Output ("EMULATOR_PROCESS_ALIVE=" + [int](-not \$p.HasExited))
          POWERSHELL

            ps1_win="$(wslpath -w "$ps1")"
            /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe \
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
              -File "$ps1_win" | tr -d '\r'
          fi

          "$adb_wsl" start-server >/dev/null 2>&1 || true

          serial=''
          for i in $(seq 1 48); do
            serial="$($adb_wsl devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
            if [ -n "$serial" ]; then break; fi
            sleep 5
          done

          if [ -z "$serial" ]; then
            echo EMULATOR_ADB_READY=0
            "$emulator_wsl" -accel-check 2>&1 | tr -d '\r' | sed 's/^/ACCEL_CHECK=/' || true
            echo EMULATOR_STDERR_TAIL_BEGIN
            if [ -f "$stderr_wsl" ]; then
              tail -n 120 "$stderr_wsl" | tr -d '\r' | sed "s#${win_user}#[USER]#g" | sed -E 's/([0-9]{5,})/[number]/g'
            fi
            echo EMULATOR_STDERR_TAIL_END
            echo EMULATOR_STDOUT_TAIL_BEGIN
            if [ -f "$stdout_wsl" ]; then
              tail -n 120 "$stdout_wsl" | tr -d '\r' | sed "s#${win_user}#[USER]#g" | sed -E 's/([0-9]{5,})/[number]/g'
            fi
            echo EMULATOR_STDOUT_TAIL_END
            exit 1
          fi
          echo EMULATOR_ADB_READY=1

          boot=''
          for i in $(seq 1 60); do
            boot="$($adb_wsl -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            if [ "$boot" = '1' ]; then break; fi
            sleep 5
          done

          if [ "$boot" != '1' ]; then
            echo EMULATOR_BOOT_READY=0
            exit 1
          fi

          echo EMULATOR_BOOT_READY=1
          echo PERSISTENT_EMULATOR_RUNTIME=PASS
