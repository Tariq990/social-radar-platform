name: Android Persistent Emulator Runtime

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-persistent-emulator-runtime.yml]
  workflow_dispatch:
    inputs:
      headless:
        description: Start without an emulator window
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-persistent-emulator-runtime
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 9
    steps:
      - name: Repair persistent AVD and start Android 36 on Windows
        shell: bash
        run: |
          set -euo pipefail

          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          test -n "$win_user"

          android_wsl="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidCLI/android.exe"
          sdk_wsl="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          sdk_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          image_win="${sdk_win}\\system-images\\android-36\\google_apis\\x86_64"
          emulator_wsl="${sdk_wsl}/emulator/emulator.exe"
          adb_wsl="${sdk_wsl}/platform-tools/adb.exe"
          image_wsl="${sdk_wsl}/system-images/android-36/google_apis/x86_64/system.img"

          test -s "$android_wsl"
          test -s "$emulator_wsl"
          test -s "$adb_wsl"
          test -s "$image_wsl"
          echo RUNTIME_SDK_READY=1

          "$emulator_wsl" -accel-check 2>&1 | tr -d '\r' | sed 's/^/ACCEL_CHECK=/' || true

          avds="$($emulator_wsl -list-avds 2>/dev/null | tr -d '\r' | sed '/^[[:space:]]*$/d' || true)"
          avd_name="$(printf '%s\n' "$avds" | head -n1)"
          if [ -z "$avd_name" ]; then
            echo AVD_CREATE_REQUIRED=1
            set +e
            "$android_wsl" --no-metrics --sdk="$sdk_win" emulator create medium_phone 2>&1 |
              tr -d '\r' |
              sed -E 's/([0-9]{5,})/[number]/g'
            rc=("${PIPESTATUS[@]}")
            set -e
            echo "AVD_CREATE_RC=${rc[0]}"
            avds="$($emulator_wsl -list-avds 2>/dev/null | tr -d '\r' | sed '/^[[:space:]]*$/d' || true)"
            avd_name="$(printf '%s\n' "$avds" | head -n1)"
          else
            echo AVD_REUSED=1
          fi
          test -n "$avd_name"
          echo AVD_READY=1

          existing="$($adb_wsl devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
          if [ -n "$existing" ]; then
            echo EMULATOR_REUSED=1
            serial="$existing"
          else
            echo EMULATOR_START_REQUIRED=1
            launch_headless=true
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.headless }}" != "true" ]; then
              launch_headless=false
            fi

            ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-start-emulator.ps1"
            cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference = 'Stop'
          \$sdk = '${sdk_win}'
          \$emulator = Join-Path \$sdk 'emulator\\emulator.exe'
          \$imageDir = '${image_win}'
          \$avdName = '${avd_name}'
          \$userProfile = [Environment]::GetFolderPath('UserProfile')
          \$avdHome = Join-Path \$userProfile '.android\\avd'
          \$avdDir = Join-Path \$avdHome (\$avdName + '.avd')
          \$config = Join-Path \$avdDir 'config.ini'
          \$startupLog = Join-Path \$env:TEMP 'mrscrap-emulator-startup.log'
          \$launcher = Join-Path \$env:TEMP 'mrscrap-emulator-launch.cmd'
          if (-not (Test-Path \$config)) { throw 'AVD_CONFIG_MISSING' }

          \$expectedImage = 'system-images\\android-36\\google_apis\\x86_64\\'
          \$lines = @(Get-Content \$config -ErrorAction Stop)
          \$oldImage = [string](\$lines | Where-Object { \$_ -like 'image.sysdir.1=*' } | Select-Object -First 1)
          \$needsRebase = -not (\$oldImage -eq ('image.sysdir.1=' + \$expectedImage))

          function Set-AvdKey([string]\$key, [string]\$value) {
            \$script:lines = @(\$script:lines | Where-Object { \$_ -notmatch ('^' + [regex]::Escape(\$key) + '=') })
            \$script:lines += (\$key + '=' + \$value)
          }

          Set-AvdKey 'image.sysdir.1' \$expectedImage
          Set-AvdKey 'target' 'android-36'
          Set-AvdKey 'abi.type' 'x86_64'
          Set-AvdKey 'hw.cpu.arch' 'x86_64'
          Set-AvdKey 'tag.id' 'google_apis'
          Set-AvdKey 'tag.display' 'Google APIs'
          Set-AvdKey 'hw.ramSize' '3072'
          Set-AvdKey 'hw.gpu.enabled' 'yes'
          Set-AvdKey 'hw.gpu.mode' 'auto'
          Set-Content -Path \$config -Value \$lines -Encoding ASCII

          if (\$needsRebase) {
            foreach (\$name in @('userdata-qemu.img','userdata-qemu.img.qcow2','cache.img','cache.img.qcow2','hardware-qemu.ini')) {
              Remove-Item (Join-Path \$avdDir \$name) -Force -ErrorAction SilentlyContinue
            }
            Remove-Item (Join-Path \$avdDir 'snapshots') -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output 'AVD_IMAGE_REBASED=1'
          } else {
            Write-Output 'AVD_IMAGE_REBASED=0'
          }

          \$killed = 0
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              \$path = [string]\$_.ExecutablePath
              \$cmd = [string]\$_.CommandLine
              (\$path -like (\$sdk + '\\emulator\\*')) -and
              ((\$_.Name -eq 'emulator.exe') -or (\$_.Name -like 'qemu-system-x86_64*')) -and
              ((\$cmd -like ('*@' + \$avdName + '*')) -or (\$_.Name -eq 'emulator.exe'))
            } |
            ForEach-Object {
              Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue
              \$killed++
            }
          Write-Output ("STALE_EMULATOR_PROCESSES_KILLED=" + \$killed)
          Start-Sleep -Seconds 2

          Get-ChildItem -Path \$avdDir -Filter '*.lock' -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path \$avdDir 'multiinstance.lock') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'AVD_LOCKS_CLEANED=1'

          \$args = @('@' + \$avdName,'-sysdir',\$imageDir,'-no-audio','-no-boot-anim','-no-snapshot','-gpu','swiftshader_indirect')
          if (\$needsRebase) { \$args += '-wipe-data' }
          if ('${launch_headless}' -eq 'true') { \$args += '-no-window' }
          \$quoted = @(\$args | ForEach-Object {
            \$value = [string]\$_
            if (\$value -match '[\\s"]') { '"' + (\$value -replace '"','\\"') + '"' } else { \$value }
          })

          Remove-Item \$startupLog -Force -ErrorAction SilentlyContinue
          \$launchLines = @(
            '@echo off',
            ('set "ANDROID_SDK_ROOT=' + \$sdk + '"'),
            ('set "ANDROID_HOME=' + \$sdk + '"'),
            ('set "ANDROID_AVD_HOME=' + \$avdHome + '"'),
            ('"' + \$emulator + '" ' + (\$quoted -join ' ') + ' > "' + \$startupLog + '" 2>&1')
          )
          Set-Content -Path \$launcher -Value \$launchLines -Encoding ASCII
          \$commandLine = '"' + \$env:ComSpec + '" /d /c ""' + \$launcher + '""'
          \$created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = \$commandLine }
          if ([int]\$created.ReturnValue -ne 0 -or [int]\$created.ProcessId -le 0) { throw 'EMULATOR_PROCESS_CREATE_FAILED' }
          Start-Sleep -Seconds 4
          \$alive = [bool](Get-Process -Id ([int]\$created.ProcessId) -ErrorAction SilentlyContinue)
          Write-Output 'EMULATOR_PROCESS_STARTED=1'
          Write-Output ("EMULATOR_WRAPPER_ALIVE=" + [int]\$alive)
          if (-not \$alive) {
            Write-Output 'EMULATOR_EARLY_EXIT=1'
            if (Test-Path \$startupLog) {
              Get-Content \$startupLog -Tail 24 -ErrorAction SilentlyContinue | ForEach-Object {
                \$safe = [string]\$_
                \$safe = \$safe -replace [regex]::Escape(\$userProfile), '[user]'
                \$safe = \$safe -replace [regex]::Escape(\$sdk), '[sdk]'
                \$safe = \$safe -replace [regex]::Escape(\$avdName), '[avd]'
                \$safe = \$safe -replace '\b[0-9]{5,}\b', '[number]'
                Write-Output ('EMULATOR_DIAG=' + \$safe)
              }
            }
          }
          POWERSHELL

            ps1_win="$(wslpath -w "$ps1")"
            /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe \
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
              -File "$ps1_win" | tr -d '\r'

            "$adb_wsl" kill-server >/dev/null 2>&1 || true
            "$adb_wsl" start-server >/dev/null 2>&1 || true
            serial=''
            for i in $(seq 1 24); do
              serial="$($adb_wsl devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
              [ -n "$serial" ] && break
              if (( i % 6 == 0 )); then
                states="$($adb_wsl devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ {c[$2]++} END {for (s in c) printf "%s=%d ",s,c[s]}')"
                echo "ADB_WAIT_SECONDS=$((i * 5)) EMULATOR_STATES=${states:-none}"
              fi
              sleep 5
            done
          fi

          dump_safe_state() {
            states="$($adb_wsl devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ {c[$2]++} END {for (s in c) printf "%s=%d ",s,c[s]}')"
            echo "EMULATOR_STATES=${states:-none}"
            /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe \
              -NoLogo -NoProfile -NonInteractive -Command \
              "\$sdk='${sdk_win}'; \$count=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { ([string]\$_.ExecutablePath) -like (\$sdk + '\\emulator\\*') -and ((\$_.Name -eq 'emulator.exe') -or (\$_.Name -like 'qemu-system-x86_64*')) }).Count; Write-Output ('EMULATOR_WINDOWS_PROCESS_COUNT=' + \$count)" |
              tr -d '\r' || true
          }

          if [ -z "${serial:-}" ]; then
            echo EMULATOR_ADB_READY=0
            dump_safe_state
            exit 1
          fi
          echo EMULATOR_ADB_READY=1

          boot=''
          for i in $(seq 1 36); do
            boot="$($adb_wsl -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            [ "$boot" = '1' ] && break
            if (( i % 6 == 0 )); then echo "BOOT_WAIT_SECONDS=$((i * 5))"; fi
            sleep 5
          done
          if [ "$boot" != '1' ]; then
            echo EMULATOR_BOOT_READY=0
            dump_safe_state
            exit 1
          fi

          echo EMULATOR_BOOT_READY=1
          echo PERSISTENT_EMULATOR_RUNTIME=PASS
