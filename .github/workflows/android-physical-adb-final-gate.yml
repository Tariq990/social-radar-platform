name: Android Physical ADB Final Gate

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-physical-adb-final-gate.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  gate:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 3
    steps:
      - name: Classify physical Android visibility without exposing serials
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -x "$adb"
          authorized=0; unauthorized=0; offline=0; emulator=0
          for i in $(seq 1 15); do
            raw="$($adb devices 2>/dev/null | tr -d '\r' || true)"
            emulator="$(printf '%s\n' "$raw" | awk 'NR>1 && $1 ~ /^emulator-/ && $2=="device" {c++} END{print c+0}')"
            authorized="$(printf '%s\n' "$raw" | awk 'NR>1 && $1 !~ /^emulator-/ && $2=="device" {c++} END{print c+0}')"
            unauthorized="$(printf '%s\n' "$raw" | awk 'NR>1 && $1 !~ /^emulator-/ && $2=="unauthorized" {c++} END{print c+0}')"
            offline="$(printf '%s\n' "$raw" | awk 'NR>1 && $1 !~ /^emulator-/ && $2=="offline" {c++} END{print c+0}')"
            if [ "$authorized" -gt 0 ]; then break; fi
            sleep 1
          done
          echo "EMULATOR_AUTHORIZED_COUNT=$emulator"
          echo "PHYSICAL_AUTHORIZED_COUNT=$authorized"
          echo "PHYSICAL_UNAUTHORIZED_COUNT=$unauthorized"
          echo "PHYSICAL_OFFLINE_COUNT=$offline"
          if [ "$authorized" -lt 1 ]; then echo PHYSICAL_ANDROID_ACCEPTANCE_BLOCKED=1; exit 253; fi
          echo PHYSICAL_ANDROID_ACCEPTANCE_READY=1
