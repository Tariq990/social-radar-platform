name: NPM moderate details once

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
    paths:
      - '.github/workflows/npm-moderate-details-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Checkout locked graph
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Print moderate advisory structure only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > "$RUNNER_TEMP/mrscrap-audit.json" 2>/dev/null
          set -e
          python3 - "$RUNNER_TEMP/mrscrap-audit.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('error'):
              print('AUDIT_FETCH=FAIL')
              raise SystemExit(2)
          vulns=data.get('vulnerabilities') or {}
          moderate=[]
          for name,item in sorted(vulns.items()):
              item=item or {}
              if item.get('severity')!='moderate':
                  continue
              fix=item.get('fixAvailable')
              if fix is True:
                  fix_summary='true'
              elif fix is False or fix is None:
                  fix_summary='false'
              elif isinstance(fix,dict):
                  target=str(fix.get('name') or '')
                  version=str(fix.get('version') or '')
                  major='1' if fix.get('isSemVerMajor') else '0'
                  fix_summary=f'package:{target};version:{version};major:{major}'
              else:
                  fix_summary='unknown'
              via=item.get('via') or []
              via_names=sorted({v for v in via if isinstance(v,str)})
              moderate.append((name, bool(item.get('isDirect')), fix_summary, ','.join(via_names)))
          print(f'MODERATE_PACKAGE_COUNT={len(moderate)}')
          for name,direct,fix,via in moderate:
              print(f'MODERATE_PACKAGE|{name}|direct={int(direct)}|fix={fix}|via={via}')
          print('AUDIT_FETCH=PASS')
          PY
