name: Android Radar Smart Grab Live Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-radar-smartgrab-live-proof.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  live-proof:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    env:
      PKG: com.mrscrap.socialradar
    steps:
      - name: Resolve installed v144 and preserved Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1; exit}')"
          test -s "$adb"; test -n "$serial"
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"
          test "$version" = '144'
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_METADATA=1
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
          if [ -z "$pid" ]; then
            $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
            sleep 5
            pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
          fi
          test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"
          test -n "$socket"
          $adb -s "$serial" forward --remove tcp:9223 >/dev/null 2>&1 || true
          $adb -s "$serial" forward tcp:9223 "localabstract:$socket" >/dev/null
          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          echo LIVE_V144_SESSION_GATE=PASS

      - name: Navigate app to Radar and click real Grab latest 10
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-radar-smartgrab.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Targets { @(Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 4) }
          function AppTarget {
            $items=Targets
            $app=@($items|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1)
            if($app.Count -eq 0){throw 'app target missing'}
            return $app[0]
          }
          function Eval([string]$raw,[string]$expr,[int]$seconds=10) {
            $u=[Uri]$raw; $url='ws://127.0.0.1:9223'+$u.PathAndQuery
            $ws=[System.Net.WebSockets.ClientWebSocket]::new()
            $cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds))
            $ws.ConnectAsync([Uri]$url,$cts.Token).GetAwaiter().GetResult()|Out-Null
            $payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 10
            $bytes=[Text.Encoding]::UTF8.GetBytes($payload)
            $ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null
            $buf=New-Object byte[] 131072; $sb=[Text.StringBuilder]::new()
            while($true){
              $r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult()
              if($r.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close){throw 'cdp closed'}
              [void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count))
              if(!$r.EndOfMessage){continue}
              $m=$sb.ToString()|ConvertFrom-Json; $sb.Clear()|Out-Null
              if($m.id -ne 1){continue}
              if($m.result.exceptionDetails){throw 'runtime eval exception'}
              $v=$m.result.result.value
              try{$ws.Abort()}catch{}
              return $v
            }
          }

          $app=AppTarget
          $nav=@'
          (()=>{window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));return{sent:true}})()
          '@
          $n=Eval ([string]$app.webSocketDebuggerUrl) $nav 8
          Write-Output ('RADAR_NAV_EVENT_SENT='+$(if($n.sent){'1'}else{'0'}))

          $probe=@'
          (()=>{
            const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
            const buttons=[...document.querySelectorAll('button')];
            const target=buttons.find(b=>{const t=norm(b.innerText||b.textContent);return t.includes('\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627')||/Grab latest 10 and analyze/i.test(t)});
            const heading=[...document.querySelectorAll('h1,h2,h3')].some(x=>/Smart Grab & Analyze/i.test(norm(x.textContent))||norm(x.textContent).includes('\u0627\u0644\u062c\u0644\u0628 \u0648\u0627\u0644\u062a\u062d\u0644\u064a\u0644 \u0627\u0644\u0630\u0643\u064a'));
            const login=Boolean(document.querySelector('input[type="password"]'));
            const resources=performance.getEntriesByType('resource').map(e=>{try{const u=new URL(e.name);return {path:u.pathname,status:Number(e.responseStatus||0),duration:Math.round(e.duration||0)}}catch(_){return null}}).filter(x=>x&&x.path.startsWith('/api/')).slice(-30);
            return {found:Boolean(target),enabled:Boolean(target&&!target.disabled),heading,login,resources};
          })()
          '@

          $state=$null
          for($i=0;$i -lt 30;$i++){
            Start-Sleep -Milliseconds 500
            $app=AppTarget
            $state=Eval ([string]$app.webSocketDebuggerUrl) $probe 8
            if($state.found -or $state.login){break}
          }
          Write-Output ('RADAR_SMART_GRAB_HEADING='+$(if($state.heading){'1'}else{'0'}))
          Write-Output ('RADAR_GRAB_BUTTON_FOUND='+$(if($state.found){'1'}else{'0'}))
          Write-Output ('RADAR_GRAB_BUTTON_ENABLED='+$(if($state.enabled){'1'}else{'0'}))
          Write-Output ('APP_LOGIN_FORM_PRESENT='+$(if($state.login){'1'}else{'0'}))
          foreach($r in @($state.resources)) { Write-Output ('API_RESOURCE path='+[string]$r.path+' status='+[string]$r.status+' durationMs='+[string]$r.duration) }
          if(!$state.found){exit 72}
          if(!$state.enabled){exit 73}

          $click=@'
          (()=>{const norm=s=>String(s||'').replace(/\s+/g,' ').trim();const b=[...document.querySelectorAll('button')].find(x=>{const t=norm(x.innerText||x.textContent);return t.includes('\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627')||/Grab latest 10 and analyze/i.test(t)});if(!b||b.disabled)return{clicked:false};b.scrollIntoView({block:'center'});b.click();return{clicked:true}})()
          '@
          $c=Eval ([string]$app.webSocketDebuggerUrl) $click 8
          Write-Output ('REAL_GRAB_BUTTON_CLICKED='+$(if($c.clicked){'1'}else{'0'}))
          if(!$c.clicked){exit 74}
          PS
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          echo RADAR_REAL_GRAB_TRIGGER=PASS

      - name: Diagnose v144 Facebook GraphQL pending phase
        shell: bash
        run: |
          set -euo pipefail
          success=''; failure=''
          for i in $(seq 1 70); do
            events="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' || true)"
            success="$(printf '%s\n' "$events" | grep -E 'event=collect_source_success platform=facebook posts=[0-9]+' | tail -n1 || true)"
            failure="$(printf '%s\n' "$events" | grep -E 'event=collect_source_error platform=facebook code=' | tail -n1 || true)"
            [ -n "$success" ] || [ -n "$failure" ] || { sleep 1; continue; }
            break
          done
          echo '=== SAFE V144 FACEBOOK TRACE ==='
          $ADB -s "$SERIAL" logcat -b all -d -v threadtime 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' | tail -n 180 || true
          syntax_count="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'Uncaught SyntaxError: Invalid or unexpected token' || true)"
          source_pending="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'event=graphql_pending.*phase=source_id' || true)"
          request_pending="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'event=graphql_pending.*phase=request' || true)"
          echo "INVALID_JS_SYNTAX_COUNT=$syntax_count"
          echo "SOURCE_ID_PENDING_COUNT=$source_pending"
          echo "REQUEST_PENDING_COUNT=$request_pending"
          test "$syntax_count" -eq 0
          if [ "$source_pending" -gt 0 ]; then echo DIAGNOSED_PENDING_PHASE=source_id; elif [ "$request_pending" -gt 0 ]; then echo DIAGNOSED_PENDING_PHASE=request; else echo DIAGNOSED_PENDING_PHASE=unknown; fi
          if [ -n "$success" ]; then
            posts="$(printf '%s' "$success" | sed -n 's/.*posts=\([0-9][0-9]*\).*/\1/p')"
            echo "FACEBOOK_POSTS_COLLECTED=$posts"
            test -n "$posts"; test "$posts" -gt 0
            echo FACEBOOK_COLLECTION_TERMINAL=success
          elif [ -n "$failure" ]; then
            code="$(printf '%s' "$failure" | sed -n 's/.*code=\([^ ]*\).*/\1/p')"
            echo "FACEBOOK_COLLECTION_FAILURE_CODE=${code:-unknown}"
            echo FACEBOOK_COLLECTION_TERMINAL=failure
          else
            echo FACEBOOK_COLLECTION_TERMINAL=missing
          fi
          echo V144_PENDING_PHASE_DIAGNOSIS=PASS

      - name: Preserve Facebook session and cleanup forwarding
        if: always()
        shell: bash
        run: |
          set +e
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          if printf '%s' "$marker" | grep -q facebook_connected_at; then echo FACEBOOK_SESSION_METADATA_FINAL=1; else echo FACEBOOK_SESSION_METADATA_FINAL=0; fi
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-radar-smartgrab.ps1" 2>/dev/null || true
          echo RADAR_SMARTGRAB_LIVE_PROOF_COMPLETE=1
