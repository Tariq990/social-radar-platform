name: Android Product v157 Runtime Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-product-v157-runtime-proof.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  patch-build-install-prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 35
    env:
      PKG: com.mrscrap.socialradar
      PATCH_BASE_SHA: 236c173ff6f2bfe4e7fe920f6e7d44f7bc814831
      ANDROID_VERSION_CODE: '157'
      ANDROID_VERSION_NAME: '0.1.157-emulator-test'
    steps:
      - name: Checkout exact test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 0
          clean: false

      - name: Apply deterministic Android API bootstrap fix
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PATCH_BASE_SHA" HEAD
          python3 .github/scripts/v157-native-api-bootstrap-fix.py
          git diff --check
          grep -q "DEFAULT_ANDROID_API_BASE_URL = 'https://mr-scrap-api-live.onrender.com'" src/services/api.ts
          grep -q 'loadDatabaseState = async (attempt: number = 0)' src/context/RadarContext.tsx
          echo V157_PATCH_GATE=PASS

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test and commit v157 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x node_modules/.bin/tsc ] || [ ! -x node_modules/.bin/tsx ]; then npm install --no-audit --no-fund; fi
          npm run lint
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/api.ts src/context/RadarContext.tsx server/tests/architectureRegression.test.ts
          git diff --cached --check
          git diff --cached --quiet && { echo NO_V157_PRODUCT_CHANGES=1; exit 1; }
          git commit -m 'fix: make Android API bootstrap deterministic'
          source_sha="$(git rev-parse HEAD)"
          git push origin HEAD:test/android-headless-emulator-20260909
          echo "V157_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "V157_SOURCE_COMMIT=$source_sha"
          echo V157_SOURCE_TEST_GATE=PASS

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build v157 and prove API origin is embedded
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x node_modules/.bin/vite ] || [ ! -x node_modules/.bin/cap ]; then npm install --no-audit --no-fund; fi
          npm run build
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          test -s "$bundle"
          grep -q 'mr-scrap-api-live.onrender.com' "$bundle"
          echo V157_BUNDLE_API_BASE_GATE=PASS
          npx cap sync android
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          sdk="$(realpath "$sdk")"
          test -d "$sdk/platforms/android-36"
          test -d "$sdk/build-tools/36.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"
          test -x "$gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK_SIZE=$(stat -c '%s' "$apk")"
          echo V157_BUILD_GATE=PASS

      - name: Install v157 preserving Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"
          test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_BEFORE_V157_INSTALL=1
          curl -fsS --max-time 30 https://mr-scrap-api-live.onrender.com/api/health >/dev/null || true
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          tmp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MR-SCRAP-emulator-test-157.apk"
          cp "$apk" "$tmp"
          out="$($adb -s "$serial" install -r "$(wslpath -w "$tmp")" 2>&1 | tr -d '\r')"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q Success
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"
          test "$version" = 157
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_V157_INSTALL=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 15
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
          test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo V157_INSTALL_SESSION_GATE=PASS

      - name: Prove visible real source identity and extracted media cards
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"
          test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9227 >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:9227 "localabstract:$socket" >/dev/null
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v157-runtime-proof.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          function Target {
            for($i=0;$i -lt 60;$i++){
              try{$t=@(Invoke-RestMethod -Uri 'http://127.0.0.1:9227/json/list' -TimeoutSec 2|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1);if($t.Count){return $t[0]}}catch{}
              Start-Sleep -Milliseconds 250
            }
            throw 'app target missing'
          }
          function Eval([string]$raw,[string]$expr,[int]$seconds=480){
            $u=[Uri]$raw;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds))
            $ws.ConnectAsync([Uri]('ws://127.0.0.1:9227'+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null
            $payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 10
            $bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null
            $buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new()
            while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}
          }
          $app=Target
          $expr=@'
          (async()=>{
            const out={api:false,source:false,connected:false,watchlist:{card:false,realName:false,avatar:false},modal:{button:false,error:false,cards:0,mediaGrids:0,images:0,videos:0}};
            const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;if(!cap)return out;
            try{const s=await cap.status();out.connected=s?.facebookConnected===true||s?.connected===true;}catch{}
            let source=null;
            for(let i=0;i<8&&!source;i++){
              try{const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(r.ok){const rows=await r.json();out.api=true;source=(Array.isArray(rows)?rows:[]).find(x=>x&&x.platform==='facebook'&&((x.connector_type||x.connectorType||'device_session')==='device_session'));}}catch{}
              if(!source)await new Promise(r=>setTimeout(r,750));
            }
            out.source=Boolean(source);if(!source)return out;
            const handle=String(source.handle||source.external_id||source.externalId||'').trim().replace(/^@/,'').toLowerCase();
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'watchlist'}}));
            for(let i=0;i<240;i++){
              const cards=[...document.querySelectorAll('article[id^="source-card-"]')];
              const target=cards.find(c=>String(c.id||'').endsWith(String(source.id||'')))||cards[0];
              if(target){const title=String(target.querySelector('h3')?.textContent||'').trim();const tn=title.replace(/^@/,'').toLowerCase();const img=target.querySelector('img');out.watchlist={card:true,realName:Boolean(title)&&Boolean(!handle||tn!==handle)&&!['facebook','instagram','page','profile'].includes(tn),avatar:Boolean(img&&/^https?:\/\//i.test(String(img.getAttribute('src')||'')))};if(out.watchlist.realName&&out.watchlist.avatar)break;}
              await new Promise(r=>setTimeout(r,250));
            }
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));
            for(let i=0;i<100&&!document.getElementById('btn-extracted-posts-home');i++)await new Promise(r=>setTimeout(r,200));
            const button=document.getElementById('btn-extracted-posts-home');out.modal.button=Boolean(button);if(!button)return out;button.click();
            for(let i=0;i<900;i++){
              const modal=document.getElementById('modal-extracted-posts');const loading=document.getElementById('extracted-posts-loading');const error=document.getElementById('extracted-posts-error');const cards=document.querySelectorAll('[data-extracted-post="1"]');
              if(modal&&!loading&&(error||cards.length>0)){out.modal.error=Boolean(error);out.modal.cards=cards.length;out.modal.mediaGrids=document.querySelectorAll('[data-extracted-media-grid="1"]').length;out.modal.images=document.querySelectorAll('[data-extracted-image="1"]').length;out.modal.videos=document.querySelectorAll('[data-extracted-video="1"]').length;break;}
              await new Promise(r=>setTimeout(r,250));
            }
            return out;
          })()
          '@
          $r=Eval ([string]$app.webSocketDebuggerUrl) $expr 480
          Write-Output ('APP_API_REACHABLE='+$(if($r.api){'1'}else{'0'}))
          Write-Output ('FACEBOOK_DEVICE_SOURCE_FOUND='+$(if($r.source){'1'}else{'0'}))
          Write-Output ('FACEBOOK_CONNECTED='+$(if($r.connected){'1'}else{'0'}))
          Write-Output ('WATCHLIST_SOURCE_CARD='+$(if($r.watchlist.card){'1'}else{'0'}))
          Write-Output ('WATCHLIST_REAL_NAME='+$(if($r.watchlist.realName){'1'}else{'0'}))
          Write-Output ('WATCHLIST_REAL_AVATAR='+$(if($r.watchlist.avatar){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_BUTTON='+$(if($r.modal.button){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_ERROR='+$(if($r.modal.error){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POST_CARDS='+[int]$r.modal.cards)
          Write-Output ('EXTRACTED_MEDIA_GRIDS='+[int]$r.modal.mediaGrids)
          Write-Output ('EXTRACTED_IMAGES='+[int]$r.modal.images)
          Write-Output ('EXTRACTED_VIDEOS='+[int]$r.modal.videos)
          $mediaTotal=[int]$r.modal.images+[int]$r.modal.videos
          if(!$r.api -or !$r.source -or !$r.connected -or !$r.watchlist.card -or !$r.watchlist.realName -or !$r.watchlist.avatar -or !$r.modal.button -or $r.modal.error -or [int]$r.modal.cards -lt 1 -or [int]$r.modal.mediaGrids -lt 1 -or $mediaTotal -lt 1){exit 226}
          Write-Output PRODUCT_V157_SOURCE_IDENTITY_EXTRACTED_MEDIA_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Reconfirm Facebook session and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ADB:-}" ] && [ -n "${SERIAL:-}" ]; then
            marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
            printf '%s' "$marker" | grep -q facebook_connected_at
            echo FACEBOOK_SESSION_AFTER_V157_PROOF=1
            $ADB -s "$SERIAL" forward --remove tcp:9227 >/dev/null 2>&1 || true
            rm -f "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v157-runtime-proof.ps1" 2>/dev/null || true
          fi
          echo V157_SESSION_CLEANUP_GATE=PASS
