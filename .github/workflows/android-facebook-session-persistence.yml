name: Android Facebook Session Persistence

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-facebook-session-persistence.yml]

permissions:
  contents: read

concurrency:
  group: android-facebook-session-persistence
  cancel-in-progress: true

jobs:
  facebook-session:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    steps:
      - name: Prove Facebook GUI login and persistence without exposing cookies
        shell: bash
        run: |
          set -euo pipefail

          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          sdk="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk"
          sdk_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          adb="${sdk}/platform-tools/adb.exe"
          features="/mnt/c/Users/${win_user}/.android/advancedFeatures.ini"
          temp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MRSCRAP"
          pkg="com.mrscrap.socialradar"
          main="com.mrscrap.socialradar.MainActivity"
          fb="com.mrscrap.socialradar.FacebookSessionActivity"
          apk="/home/tarik/actions-runnerr/_work/SCRAP-APP/SCRAP-APP/android/app/build/outputs/apk/debug/app-debug.apk"
          avd="test_avd"
          mkdir -p "$temp"

          test -s "$adb"
          test -s "${sdk}/emulator/emulator.exe"

          echo '=== SAFE GRAPHICS PRECONDITION ==='
          tmp="${features}.fb-session-tmp"
          if [ -f "$features" ]; then
            grep -Eiv '^[[:space:]]*(GLDMA|GLDirectMem|HasSharedSlotsHostMemoryAllocator)[[:space:]]*=' "$features" > "$tmp" || true
          else
            : > "$tmp"
          fi
          printf '\nGLDirectMem = on\nHasSharedSlotsHostMemoryAllocator = on\n' >> "$tmp"
          cat "$tmp" > "$features"
          rm -f "$tmp"
          echo GRAPHICS_DMA_PREREQS_CONFIGURED=1

          stop_emulator() {
            "$adb" emu kill >/dev/null 2>&1 || true
            /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
              "\$sdk='${sdk_win}'; @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { \$cmd=[string]\$_.CommandLine; \$path=[string]\$_.ExecutablePath; ((\$cmd -like '*@${avd}*') -or ((\$path -like (\$sdk+'\\emulator\\*')) -and ((\$_.Name -eq 'emulator.exe') -or (\$_.Name -like 'qemu-system-x86_64*')))) }) | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }" >/dev/null 2>&1 || true
            sleep 3
          }

          start_emulator_windowed() {
            local suffix="$1"
            local hostout="${temp}/fb-session-${suffix}.out.log"
            local hosterr="${temp}/fb-session-${suffix}.err.log"
            local ps1="${temp}/fb-session-${suffix}-start.ps1"
            cat > "$ps1" <<POWERSHELL
          \$ErrorActionPreference='Stop'
          \$sdk='${sdk_win}'
          \$out='C:\\Users\\${win_user}\\AppData\\Local\\Temp\\MRSCRAP\\fb-session-${suffix}.out.log'
          \$err='C:\\Users\\${win_user}\\AppData\\Local\\Temp\\MRSCRAP\\fb-session-${suffix}.err.log'
          Remove-Item -Force \$out,\$err -ErrorAction SilentlyContinue
          \$exe=Join-Path \$sdk 'emulator\\emulator.exe'
          \$args='@${avd} -sysdir ${sdk_win}\\system-images\\android-36\\google_apis\\x86_64 -no-audio -no-boot-anim -no-snapshot -gpu swangle_indirect -verbose'
          \$cmd='cmd.exe /d /s /c ""' + \$exe + '" ' + \$args + ' 1>"' + \$out + '" 2>"' + \$err + '""'
          \$r=Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{CommandLine=\$cmd}
          Write-Output ("DETACHED_LAUNCH_RETURN={0}" -f \$r.ReturnValue)
          if (\$r.ReturnValue -ne 0) { exit 3 }
          POWERSHELL
            /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

            "$adb" start-server >/dev/null 2>&1 || true
            serial=''
            for i in $(seq 1 48); do
              serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1; exit}')"
              [ -n "$serial" ] && break
              sleep 5
            done
            if [ -z "$serial" ]; then
              echo EMULATOR_DEVICE_FOUND=0
              tail -n 180 "$hostout" 2>/dev/null || true
              tail -n 180 "$hosterr" 2>/dev/null || true
              exit 10
            fi

            boot=''
            for i in $(seq 1 30); do
              boot="$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1 || true)"
              [ "$boot" = '1' ] && break
              sleep 5
            done
            [ "$boot" = '1' ] || { echo EMULATOR_BOOT_READY=0; exit 11; }

            direct="$(cat "$hostout" "$hosterr" 2>/dev/null | sed -nE 's/.*gfxstreamFeature:GlDirectMem[[:space:]]*=[[:space:]]*([01]).*/\1/p' | tail -n1)"
            shared="$(cat "$hostout" "$hosterr" 2>/dev/null | sed -nE 's/.*gfxstreamFeature:HasSharedSlotsHostMemoryAllocator[[:space:]]*=[[:space:]]*([01]).*/\1/p' | tail -n1)"
            gldma="$(cat "$hostout" "$hosterr" 2>/dev/null | sed -nE 's/.*gfxstreamFeature:GlDma[[:space:]]*=[[:space:]]*([01]).*/\1/p' | tail -n1)"
            echo "${suffix}_GRAPHICS=direct:${direct:-unknown},shared:${shared:-unknown},gldma:${gldma:-unknown}"
            [ "$direct" = '1' ] && [ "$shared" = '1' ] && [ "$gldma" = '1' ] || exit 12
            echo "${suffix}_BOOT=PASS"
          }

          session_marker() {
            "$adb" -s "$serial" shell "run-as $pkg cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null |
              tr -d '\r' |
              grep 'facebook_connected_at' |
              sha256sum |
              awk '{print $1}' || true
          }

          facebook_activity_active() {
            "$adb" -s "$serial" shell dumpsys activity activities 2>/dev/null |
              tr -d '\r' |
              grep -q 'mResumedActivity.*com\.mrscrap\.socialradar/.FacebookSessionActivity'
          }

          require_package() {
            installed="$($adb -s "$serial" shell pm path "$pkg" 2>/dev/null | tr -d '\r' | tail -n1 || true)"
            if [ -z "$installed" ]; then
              [ -s "$apk" ] || { echo APK_PRESENT=0; exit 30; }
              echo PACKAGE_INSTALL_REQUIRED=1
              "$adb" -s "$serial" install -r -t "$apk" 2>&1 | tr -d '\r'
            else
              echo PACKAGE_INSTALL_REQUIRED=0
            fi
            "$adb" -s "$serial" shell pm path "$pkg" >/dev/null 2>&1 || exit 31
          }

          prove_facebook_roundtrip() {
            local phase="$1"
            local max_samples="$2"
            local before after
            before="$(session_marker)"
            "$adb" -s "$serial" shell am start -W -n "$pkg/$fb" 2>&1 | tr -d '\r' || true
            for i in $(seq 1 "$max_samples"); do
              sleep 5
              after="$(session_marker)"
              if [ -n "$after" ] && [ "$after" != "$before" ] && ! facebook_activity_active; then
                echo "${phase}_FACEBOOK_SESSION_CONFIRMED=1"
                return 0
              fi
              if (( i % 6 == 0 )); then echo "${phase}_WAIT_SECONDS=$((i * 5))"; fi
            done
            if facebook_activity_active; then
              echo "${phase}_FACEBOOK_LOGIN_REQUIRED=1"
            else
              echo "${phase}_FACEBOOK_SESSION_CONFIRMED=0"
            fi
            return 1
          }

          core_stability() {
            local phase="$1"
            local ss0 sf0 ss sf log asserts
            ss0="$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
            sf0="$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
            [ -n "$ss0" ] && [ -n "$sf0" ] || return 1
            "$adb" -s "$serial" logcat -b all -c >/dev/null 2>&1 || true
            for i in $(seq 1 4); do
              sleep 5
              ss="$($adb -s "$serial" shell pidof system_server 2>/dev/null | tr -d '\r' || true)"
              sf="$($adb -s "$serial" shell pidof surfaceflinger 2>/dev/null | tr -d '\r' || true)"
              [ "$ss" = "$ss0" ] && [ "$sf" = "$sf0" ] || { echo "${phase}_CORE_STABLE=0"; return 1; }
            done
            log="$($adb -s "$serial" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' || true)"
            asserts="$(printf '%s\n' "$log" | grep -c 'hasReadColorBufferDma' || true)"
            [ "$asserts" = '0' ] || { echo "${phase}_CORE_STABLE=0"; return 1; }
            echo "${phase}_CORE_STABLE=1"
          }

          echo '=== PHASE 1: GUI LOGIN / EXISTING SESSION ==='
          stop_emulator
          start_emulator_windowed phase1
          require_package
          "$adb" -s "$serial" shell am force-stop "$pkg" >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell am start -W -n "$pkg/$main" 2>&1 | tr -d '\r' || true
          prove_facebook_roundtrip PHASE1 72
          core_stability PHASE1

          echo '=== PHASE 2: APP PROCESS RESTART ==='
          "$adb" -s "$serial" shell am force-stop "$pkg" >/dev/null 2>&1 || true
          sleep 2
          "$adb" -s "$serial" shell am start -W -n "$pkg/$main" 2>&1 | tr -d '\r' || true
          prove_facebook_roundtrip PHASE2 12
          core_stability PHASE2

          echo '=== PHASE 3: EMULATOR SHUTDOWN / RESTART, NO WIPE ==='
          stop_emulator
          start_emulator_windowed phase3
          require_package
          "$adb" -s "$serial" shell am start -W -n "$pkg/$main" 2>&1 | tr -d '\r' || true
          prove_facebook_roundtrip PHASE3 18
          core_stability PHASE3

          echo FACEBOOK_SESSION_PERSISTENCE=PASS
