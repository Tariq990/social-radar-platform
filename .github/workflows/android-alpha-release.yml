name: Publish Android Alpha

on:
  push:
    branches:
      - work/real-session-ai-provider
  workflow_dispatch:
    inputs:
      backend_base_url:
        description: Public HTTPS backend origin compiled into the Android app
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-android-alpha
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ALPHA_API_BASE_URL != '' || github.ref_name == 'work/real-session-ai-provider' }}
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: ${{ inputs.backend_base_url || vars.ALPHA_API_BASE_URL || 'https://mr-scrap-api-live.onrender.com' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate alpha backend origin
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VITE_API_BASE_URL:-}" ]]; then
            echo "VITE_API_BASE_URL is required."
            exit 1
          fi
          if [[ ! "$VITE_API_BASE_URL" =~ ^https://[^/]+ ]]; then
            echo "Alpha backend must be an absolute HTTPS origin: $VITE_API_BASE_URL"
            exit 1
          fi
          if [[ ! "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "ANDROID_VERSION_CODE must be a positive integer."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build production web bundle for Android
        run: npm run build
        env:
          APP_MODE: production

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Detect Android SDK on self-hosted runner
        id: detect-android-sdk
        shell: bash
        run: |
          set -euo pipefail
          sdk=""

          for candidate in \
            "${ANDROID_HOME:-}" \
            "${ANDROID_SDK_ROOT:-}" \
            "$HOME/Android/Sdk" \
            "$HOME/Android/sdk" \
            "$HOME/.android/sdk" \
            "/opt/android-sdk" \
            "/usr/local/lib/android/sdk"
          do
            if [[ -n "$candidate" && -d "$candidate" ]]; then
              sdk="$(realpath "$candidate")"
              break
            fi
          done

          if [[ -z "$sdk" ]]; then
            platform_tools="$(find "$HOME" /opt /usr/local -maxdepth 6 -type d -name platform-tools -print -quit 2>/dev/null || true)"
            if [[ -n "$platform_tools" ]]; then
              sdk="$(realpath "$(dirname "$platform_tools")")"
            fi
          fi

          if [[ -n "$sdk" ]]; then
            echo "Detected existing Android SDK: $sdk"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
            echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          else
            echo "No existing Android SDK detected; setup step will provision it once in the persistent runner home."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk" || ! -d "$sdk" ]]; then
            echo "Android SDK setup completed without a usable SDK root."
            exit 1
          fi

          sdk="$(realpath "$sdk")"
          echo "Resolved Android SDK: $sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties

          if [[ ! -d "$sdk/platforms/android-36" ]]; then
            echo "Required Android platform 36 is missing from $sdk/platforms."
            exit 1
          fi
          if [[ ! -d "$sdk/build-tools/36.0.0" ]]; then
            echo "Required Android build-tools 36.0.0 are missing from $sdk/build-tools."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare alpha assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MR-SCRAP-android-alpha.apk
          sha256sum release/MR-SCRAP-android-alpha.apk > release/MR-SCRAP-android-alpha.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT_SHA.txt
          printf '%s\n' "$ANDROID_VERSION_CODE" > release/VERSION_CODE.txt
          printf '%s\n' "$ANDROID_VERSION_NAME" > release/VERSION_NAME.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr-scrap-android-alpha-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Publish mandatory in-app update to backend
        shell: bash
        run: |
          set -euo pipefail
          APK=release/MR-SCRAP-android-alpha.apk
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mrscrap-render-release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --retry 18 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            -X PUT \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-MR-SCRAP-Version-Code: ${ANDROID_VERSION_CODE}" \
            -H "X-MR-SCRAP-Version-Name: ${ANDROID_VERSION_NAME}" \
            -H "X-MR-SCRAP-Min-Supported-Version-Code: ${ANDROID_VERSION_CODE}" \
            -H "X-MR-SCRAP-SHA256: ${APK_SHA}" \
            -H "X-MR-SCRAP-Release-Notes: ${GITHUB_SHA}" \
            --data-binary "@$APK" \
            "${VITE_API_BASE_URL}/api/internal/releases/android-alpha"

      - name: Update mutable android-alpha tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f android-alpha "$GITHUB_SHA"
          git push origin refs/tags/android-alpha --force

      - name: Create or update Android Alpha prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          UPLOADS="https://uploads.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH_HEADER="Authorization: Bearer ${GITHUB_TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          NOTES=$(cat <<EOF
          ## MR SCRAP Android Alpha

          - Commit: \`$GITHUB_SHA\`
          - Android version: \`$ANDROID_VERSION_NAME\` (code \`$ANDROID_VERSION_CODE\`)
          - Backend: \`$VITE_API_BASE_URL\`
          - Mandatory in-app update for older alpha installations.
          - APK is SHA-256 verified on-device before Android opens the installer.
          - Alpha-only signing key; not the future Play Store production key.
          - Facebook and Instagram authenticated monitoring remain subject to physical-device acceptance testing and Meta DOM/login behavior.
          EOF
          )
          export NOTES

          release_response="$(mktemp)"
          status="$(curl -sS -o "$release_response" -w '%{http_code}' \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
            "$API/releases/tags/android-alpha")"

          if [[ "$status" == "200" ]]; then
            release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$release_response")"
            payload="$(python3 -c 'import json,os; print(json.dumps({"name":"MR SCRAP Android Alpha","body":os.environ["NOTES"],"prerelease":True,"draft":False}))')"
            curl --fail-with-body -sS \
              -X PATCH \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$API/releases/$release_id" >/dev/null
          elif [[ "$status" == "404" ]]; then
            payload="$(python3 -c 'import json,os; print(json.dumps({"tag_name":"android-alpha","target_commitish":os.environ["GITHUB_SHA"],"name":"MR SCRAP Android Alpha","body":os.environ["NOTES"],"prerelease":True,"draft":False}))')"
            release_id="$(curl --fail-with-body -sS \
              -X POST \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$API/releases" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          else
            cat "$release_response"
            echo "Unexpected GitHub release lookup status: $status"
            exit 1
          fi
          rm -f "$release_response"

          assets_json="$(mktemp)"
          curl --fail-with-body -sS \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
            "$API/releases/$release_id/assets?per_page=100" > "$assets_json"

          for name in \
            MR-SCRAP-android-alpha.apk \
            MR-SCRAP-android-alpha.apk.sha256 \
            COMMIT_SHA.txt \
            VERSION_CODE.txt \
            VERSION_NAME.txt
          do
            asset_id="$(python3 -c 'import json,sys; name=sys.argv[2]; print(next((str(a["id"]) for a in json.load(open(sys.argv[1])) if a["name"] == name), ""))' "$assets_json" "$name")"
            if [[ -n "$asset_id" ]]; then
              curl --fail-with-body -sS \
                -X DELETE \
                -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
                "$API/releases/assets/$asset_id" >/dev/null
            fi
          done
          rm -f "$assets_json"

          upload_asset() {
            local path="$1"
            local content_type="$2"
            local name
            name="$(basename "$path")"
            curl --fail-with-body -sS \
              -X POST \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
              -H "Content-Type: $content_type" \
              --data-binary "@$path" \
              "$UPLOADS/releases/$release_id/assets?name=$name" >/dev/null
          }

          upload_asset release/MR-SCRAP-android-alpha.apk application/vnd.android.package-archive
          upload_asset release/MR-SCRAP-android-alpha.apk.sha256 text/plain
          upload_asset release/COMMIT_SHA.txt text/plain
          upload_asset release/VERSION_CODE.txt text/plain
          upload_asset release/VERSION_NAME.txt text/plain

          expected_apk_size="$(stat -c%s release/MR-SCRAP-android-alpha.apk)"
          verify_json="$(mktemp)"
          curl --fail-with-body -sS \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
            "$API/releases/$release_id/assets?per_page=100" > "$verify_json"

          python3 - "$verify_json" "$expected_apk_size" <<'PY'
          import json
          import sys

          assets = json.load(open(sys.argv[1]))
          expected_size = int(sys.argv[2])
          by_name = {asset["name"]: asset for asset in assets}
          required = {
              "MR-SCRAP-android-alpha.apk",
              "MR-SCRAP-android-alpha.apk.sha256",
              "COMMIT_SHA.txt",
              "VERSION_CODE.txt",
              "VERSION_NAME.txt",
          }
          missing = sorted(required - set(by_name))
          if missing:
              raise SystemExit(f"Missing release assets: {missing}")
          if int(by_name["MR-SCRAP-android-alpha.apk"]["size"]) != expected_size:
              raise SystemExit("Published APK size does not match the built APK")
          print(f"Verified GitHub prerelease assets; APK size={expected_size}")
          PY
          rm -f "$verify_json"
