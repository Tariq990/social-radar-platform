name: Apply Facebook GraphQL Contract Fix

on:
  push:
    branches: [test/android-physical-fix-20260909]
    paths: [.github/workflows/apply-facebook-graphql-contract-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch target-bound Facebook ID recovery
        shell: bash
        env:
          ID_BLOCK_B64: ""
          ASYNC_BLOCK_B64: ""
        run: |
          set -euo pipefail
          git fetch origin test/android-physical-local-recovery-20260909
          git checkout -B physical-code-fix FETCH_HEAD
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('android/app/src/main/java/com/mrscrap/socialradar/FacebookGraphqlWebViewCollector.java')
          s=p.read_text(encoding='utf-8')
          id_start="              let sourceId = '';\n"
          id_end="              const cleanTitle = "
          a=s.index(id_start); b=s.index(id_end,a)
          s=s[:a]+base64.b64decode(os.environ['ID_BLOCK_B64']).decode()+s[b:]
          async_start="              window[KEY] = {status:'pending', stage:'request'};\n"
          async_end="              return JSON.stringify({pending:true, diagnostics:{collector:'graphql', waitingFor:'request', started:true}});"
          a=s.index(async_start); b=s.index(async_end,a)
          s=s[:a]+base64.b64decode(os.environ['ASYNC_BLOCK_B64']).decode()+s[b:]
          old='''                        int nodes = diagnostics == null ? 0 : diagnostics.optInt("nodes", 0);\n                        Log.i(TAG, "event=graphql_result posts=" + postCount +\n                            " pages=" + pages + " nodes=" + nodes);\n'''
          new='''                        int nodes = diagnostics == null ? 0 : diagnostics.optInt("nodes", 0);\n                        int candidatesTried = diagnostics == null ? 0 : diagnostics.optInt("candidatesTried", 0);\n                        int winningCandidate = diagnostics == null ? -1 : diagnostics.optInt("winningCandidate", -1);\n                        Log.i(TAG, "event=graphql_result posts=" + postCount +\n                            " pages=" + pages + " nodes=" + nodes +\n                            " candidates=" + candidatesTried + " winner=" + winningCandidate);\n'''
          if s.count(old)!=1: raise SystemExit('LOG_PATCH_ANCHOR_MISMATCH')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          export JAVA_HOME=/home/tarik/actions-runnerr/_work/_tool/Java_Temurin-Hotspot_jdk/21.0.12-101.0.LTS/x64
          export PATH="$JAVA_HOME/bin:/home/tarik/actions-runnerr/_work/_tool/node/22.23.2/x64/bin:$PATH"
          python3 scripts/verify-facebook-script.py
          git config user.name 'MR SCRAP Physical Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/java/com/mrscrap/socialradar/FacebookGraphqlWebViewCollector.java
          git commit -m 'fix: resolve target-bound Facebook GraphQL source IDs'
          git push origin HEAD:test/android-physical-local-recovery-20260909
