name: Generate package lock once

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
    paths:
      - '.github/workflows/generate-package-lock-once.yml'

permissions:
  contents: write

concurrency:
  group: package-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lock:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate npm lockfile without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if (!p.lockfileVersion || p.lockfileVersion < 3) process.exit(1)"

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/generate-package-lock-once.yml
          git add package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock npm dependency graph'
          git push origin HEAD:test/android-headless-emulator-20260909
