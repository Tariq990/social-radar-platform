name: Android v159 Device Ingest Dedupe Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v159-ingest-dedupe-proof.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar
      BACKEND: https://mr-scrap-api-live.onrender.com
    steps:
      - name: Attach to installed v159 without rebuild or reinstall
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -x "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 159
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_PRESENT=1
          curl -fsS --max-time 30 "$BACKEND/api/health" >/dev/null || true
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 10
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $adb -s "$serial" forward --remove tcp:9242 >/dev/null 2>&1 || true
          $adb -s "$serial" forward tcp:9242 "localabstract:$socket" >/dev/null
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"

      - name: Create isolated rule-free source and schedule first secure ingest
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v159-dedupe-create.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9242
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=180){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 10;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id-ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};return $m.result.result.value}}
          $expr=@'
          (async()=>{const base='https://mr-scrap-api-live.onrender.com';const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;if(!cap)return{stage:'plugin'};const j=async r=>{try{return await r.json()}catch{return null}};const sr0=await fetch(base+'/api/sources',{credentials:'include'});const s0=await j(sr0);if(!sr0.ok||!Array.isArray(s0))return{stage:'sources'};for(const p of s0.filter(x=>typeof x?.external_id==='string'&&x.external_id.startsWith('dedupeprobe_emulator_'))){try{await cap.cancelSource({sourceId:p.id})}catch{};await fetch(base+'/api/sources/'+encodeURIComponent(p.id),{method:'DELETE',credentials:'include'})}localStorage.removeItem('mrscrap_dedupe_probe_source_id');localStorage.removeItem('mrscrap_dedupe_first_checked');localStorage.removeItem('mrscrap_dedupe_first_count');const [sr,rr,ar]=await Promise.all([fetch(base+'/api/sources',{credentials:'include'}),fetch(base+'/api/rules',{credentials:'include'}),fetch(base+'/api/alerts',{credentials:'include'})]);const sources=await j(sr),rules=await j(rr),alerts=await j(ar);if(!sr.ok||!rr.ok||!ar.ok||!Array.isArray(sources)||!Array.isArray(rules)||!Array.isArray(alerts))return{stage:'backend'};const globalEnabled=rules.filter(r=>r&&r.enabled===true&&(!Array.isArray(r.source_ids||r.sourceIds)||(r.source_ids||r.sourceIds).length===0)).length;const real=sources.find(x=>x&&x.platform==='facebook'&&!Boolean(x.is_paused??x.isPaused)&&(x.connector_type||x.connectorType||'device_session')==='device_session');const st=await cap.status();const facebook=st?.facebookConnected===true||(st?.facebookConnected==null&&st?.connected===true);const auth=await cap.getBackendAuth();const authConfigured=auth?.configured===true;if(globalEnabled!==0||!real||!facebook||!authConfigured)return{stage:'unsafe',globalEnabled,facebook,authConfigured,real:Boolean(real),alerts:alerts.length};const externalId='dedupeprobe_emulator_'+Date.now();const cr=await fetch(base+'/api/sources',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({externalId,url:real.url,name:'Dedupe Emulator Probe',visibilityType:'authenticated',connectorType:'device_session'})});const created=await j(cr);if(!cr.ok||typeof created?.id!=='string')return{stage:'create',status:cr.status};localStorage.setItem('mrscrap_dedupe_probe_source_id',created.id);localStorage.setItem('mrscrap_dedupe_alerts_before',String(alerts.length));const sch=await cap.scheduleSource({sourceId:created.id,url:real.url,platform:'facebook',backendBaseUrl:base,locale:'en'});return{stage:'scheduled',globalEnabled,facebook,authConfigured,alerts:alerts.length,scheduled:sch?.scheduled===true,interval:Number(sch?.minimumIntervalMinutes||0)}})()
          '@
          $r=Eval $expr 180
          Write-Output ('PROBE_STAGE='+[string]$r.stage);if($null-ne$r.globalEnabled){Write-Output ('GLOBAL_ENABLED_RULES='+[int]$r.globalEnabled)};if($null-ne$r.alerts){Write-Output ('ALERTS_BEFORE='+[int]$r.alerts)};Write-Output ('FACEBOOK_CONNECTED='+$(if($r.facebook){'1'}else{'0'}));Write-Output ('DEVICE_AUTH_CONFIGURED='+$(if($r.authConfigured){'1'}else{'0'}));Write-Output ('FIRST_WORK_SCHEDULED='+$(if($r.scheduled){'1'}else{'0'}));if($null-ne$r.interval){Write-Output ('WORKMANAGER_MIN_INTERVAL='+[int]$r.interval)}
          if([string]$r.stage-ne'scheduled' -or [int]$r.globalEnabled-ne 0 -or !$r.facebook -or !$r.authConfigured -or !$r.scheduled -or [int]$r.interval-ne 15){exit 252}
          Write-Output ISOLATED_DEDUPE_SOURCE_SCHEDULED=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Prove second secure WorkManager ingest creates no duplicate posts
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v159-dedupe-run.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9242
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=540){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 10;$b=[Text.Encoding]::UTF8.GetBytes($p);$ws.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 131072;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id-ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};return $m.result.result.value}}
          $expr=@'
          (async()=>{const base='https://mr-scrap-api-live.onrender.com';const sleep=ms=>new Promise(r=>setTimeout(r,ms));const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;const id=localStorage.getItem('mrscrap_dedupe_probe_source_id')||'';if(!cap||!id)return{stage:'missing'};let first=null;for(let i=0;i<240;i++){const r=await fetch(base+'/api/sources',{credentials:'include'});if(r.ok){const a=await r.json();const s=Array.isArray(a)?a.find(x=>x?.id===id):null;const c=Number(s?.recentPostsCount||0);const t=String(s?.last_checked_at||s?.lastCheckedAt||'');if(s&&c>0&&t){first={count:c,checked:t,url:s.url};break}}await sleep(1000)}if(!first)return{stage:'first_timeout'};localStorage.setItem('mrscrap_dedupe_first_count',String(first.count));localStorage.setItem('mrscrap_dedupe_first_checked',first.checked);await cap.cancelSource({sourceId:id});const sch=await cap.scheduleSource({sourceId:id,url:first.url,platform:'facebook',backendBaseUrl:base,locale:'en'});if(sch?.scheduled!==true)return{stage:'reschedule',firstCount:first.count};let second=null;for(let i=0;i<240;i++){const r=await fetch(base+'/api/sources',{credentials:'include'});if(r.ok){const a=await r.json();const s=Array.isArray(a)?a.find(x=>x?.id===id):null;const c=Number(s?.recentPostsCount||0);const t=String(s?.last_checked_at||s?.lastCheckedAt||'');if(s&&t&&t!==first.checked){second={count:c,checked:t};break}}await sleep(1000)}if(!second)return{stage:'second_timeout',firstCount:first.count};const ar=await fetch(base+'/api/alerts',{credentials:'include'});const alerts=ar.ok?await ar.json():null;const before=Number(localStorage.getItem('mrscrap_dedupe_alerts_before')||'-1');return{stage:'done',firstCount:first.count,secondCount:second.count,markerChanged:second.checked!==first.checked,alertsBefore:before,alertsAfter:Array.isArray(alerts)?alerts.length:-1}})()
          '@
          $r=Eval $expr 540
          Write-Output ('DEDUPE_STAGE='+[string]$r.stage);if($null-ne$r.firstCount){Write-Output ('FIRST_POST_COUNT='+[int]$r.firstCount)};if($null-ne$r.secondCount){Write-Output ('SECOND_POST_COUNT='+[int]$r.secondCount)};Write-Output ('SECOND_CHECK_COMPLETED='+$(if($r.markerChanged){'1'}else{'0'}));if($null-ne$r.alertsBefore){Write-Output ('ALERTS_BEFORE='+[int]$r.alertsBefore)};if($null-ne$r.alertsAfter){Write-Output ('ALERTS_AFTER='+[int]$r.alertsAfter)}
          if([string]$r.stage-ne'done' -or [int]$r.firstCount-lt 1 -or !$r.markerChanged -or [int]$r.secondCount-ne[int]$r.firstCount -or [int]$r.alertsAfter-ne[int]$r.alertsBefore){exit 254}
          Write-Output V159_WORKMANAGER_INGEST_IDEMPOTENCY_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Clean isolated source and verify session
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADB:-}" ] || [ -z "${SERIAL:-}" ]; then exit 0; fi
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null 2>&1 || true
          sleep 6
          pid="$($ADB -s "$SERIAL" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${pid}$|_${pid}($|_)" | head -n1 || true)"; [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          $ADB -s "$SERIAL" forward --remove tcp:9242 >/dev/null 2>&1 || true; $ADB -s "$SERIAL" forward tcp:9242 "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v159-dedupe-clean.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9242
          function Target { for($i=0;$i-lt 80;$i++){try{$r=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$r|Where-Object{$_.type-eq'page'-and[string]$_.url-like'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'target missing'}
          function Eval([string]$e){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$w=[System.Net.WebSockets.ClientWebSocket]::new();$c=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(90));$w.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$c.Token).GetAwaiter().GetResult()|Out-Null;$p=@{id=1;method='Runtime.evaluate';params=@{expression=$e;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 8;$b=[Text.Encoding]::UTF8.GetBytes($p);$w.SendAsync([ArraySegment[byte]]::new($b),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$c.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 65536;while($true){$r=$w.ReceiveAsync([ArraySegment[byte]]::new($buf),$c.Token).GetAwaiter().GetResult();$m=([Text.Encoding]::UTF8.GetString($buf,0,$r.Count)|ConvertFrom-Json);if($m.id-eq 1){return $m.result.result.value}}}
          $r=Eval "(async()=>{const b='https://mr-scrap-api-live.onrender.com';const c=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;const id=localStorage.getItem('mrscrap_dedupe_probe_source_id')||'';if(id&&c){try{await c.cancelSource({sourceId:id})}catch{};await fetch(b+'/api/sources/'+encodeURIComponent(id),{method:'DELETE',credentials:'include'})}localStorage.removeItem('mrscrap_dedupe_probe_source_id');localStorage.removeItem('mrscrap_dedupe_first_checked');localStorage.removeItem('mrscrap_dedupe_first_count');localStorage.removeItem('mrscrap_dedupe_alerts_before');const sr=await fetch(b+'/api/sources',{credentials:'include'});const s=sr.ok?await sr.json():[];const left=Array.isArray(s)?s.filter(x=>typeof x?.external_id==='string'&&x.external_id.startsWith('dedupeprobe_emulator_')).length:-1;const st=c?await c.status():null;return{left,facebook:st?.facebookConnected===true||(st?.facebookConnected==null&&st?.connected===true)}})()"
          Write-Output ('DEDUPE_PROBE_LEFTOVERS='+[int]$r.left);Write-Output ('FACEBOOK_SESSION_AFTER='+$(if($r.facebook){'1'}else{'0'}));if([int]$r.left-ne 0 -or !$r.facebook){exit 255};Write-Output DEDUPE_PROBE_CLEANUP=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          $ADB -s "$SERIAL" forward --remove tcp:9242 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v159-dedupe-"*.ps1 2>/dev/null || true
