name: Apply and Validate Meta Surface Fix

on:
  push:
    branches:
      - tmp/meta-surface-fix-20260908
    paths:
      - .github/workflows/meta-surface-apply.yml

permissions:
  contents: write

jobs:
  validate-runner:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Confirm runner and Chrome session
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          node -v
          curl -fsS --connect-timeout 3 http://127.0.0.1:9222/json/version | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("Browser")); assert d.get("webSocketDebuggerUrl")'
