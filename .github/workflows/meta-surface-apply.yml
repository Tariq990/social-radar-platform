name: Apply and Validate Meta Surface Fix

on:
  push:
    branches:
      - tmp/meta-surface-fix-20260908
    paths:
      - .github/workflows/meta-surface-apply.yml

permissions:
  contents: write

concurrency:
  group: meta-surface-apply
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/meta-surface-fix-20260908
          fetch-depth: 0

      - name: Apply desktop-first Facebook surface fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          collector_path = Path('android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java')
          test_path = Path('server/tests/architectureRegression.test.ts')
          source = collector_path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '    private static final int BASIC_FALLBACK_ATTEMPT = 6;\n',
              '    private static final int SURFACE_FALLBACK_ATTEMPT = 4;\n',
              'fallback constant'
          )

          replace_once(
              '''        final int targetLimit = Math.max(1, Math.min(MAX_LIMIT, requestedLimit));
        final String mobileUrl = preferMobileFacebookUrl(url);
        final String basicFallbackUrl = preferBasicFacebookUrl(url);
        Handler main = new Handler(Looper.getMainLooper());
''',
              '''        final int targetLimit = Math.max(1, Math.min(MAX_LIMIT, requestedLimit));
        final String[] surfaceUrls = preferredSurfaceUrls(url);
        Handler main = new Handler(Looper.getMainLooper());
''',
              'surface declarations'
          )

          replace_once(
              '''            AtomicBoolean finished = new AtomicBoolean(false);
            int[] attempts = new int[] { 0 };
            boolean[] triedBasicFallback = new boolean[] { false };
''',
              '''            AtomicBoolean finished = new AtomicBoolean(false);
            int[] attempts = new int[] { 0 };
            int[] surfaceIndex = new int[] { 0 };
''',
              'surface state'
          )

          replace_once(
              '''                        if (
                            reliableSource && postCount == 0 && attempts[0] >= BASIC_FALLBACK_ATTEMPT &&
                            !triedBasicFallback[0] && basicFallbackUrl != null && !basicFallbackUrl.equals(mobileUrl)
                        ) {
                            // If Facebook's modern mobile SPA exposes no stable post anchors, try the
                            // simpler first-party mbasic surface using the same local Facebook session.
                            triedBasicFallback[0] = true;
                            attempts[0] = 0;
                            webView.loadUrl(basicFallbackUrl);
                            return;
                        }
''',
              '''                        boolean canTryNextSurface = surfaceIndex[0] + 1 < surfaceUrls.length;
                        boolean surfaceNeedsFallback = postCount == 0 && attempts[0] >= SURFACE_FALLBACK_ATTEMPT;
                        if (canTryNextSurface && surfaceNeedsFallback) {
                            // Start with the normal www Facebook surface because live authenticated
                            // validation shows it exposes stable article/post links. Fall back locally
                            // to m.facebook.com and then mbasic only when the current surface yields no posts.
                            surfaceIndex[0]++;
                            attempts[0] = 0;
                            webView.loadUrl(surfaceUrls[surfaceIndex[0]]);
                            return;
                        }
''',
              'fallback block'
          )

          replace_once(
              '''                    } catch (Exception error) {
                        if (attempts[0] < MAX_EXTRACTION_ATTEMPTS) {
                            main.postDelayed(extractionRunner[0], RETRY_DELAY_MS);
                            return;
                        }
                        finishError(main, timeoutHolder[0], webView, finished, callback, "Could not parse authenticated page content");
                    }
''',
              '''                    } catch (Exception error) {
                        if (attempts[0] >= SURFACE_FALLBACK_ATTEMPT && surfaceIndex[0] + 1 < surfaceUrls.length) {
                            surfaceIndex[0]++;
                            attempts[0] = 0;
                            webView.loadUrl(surfaceUrls[surfaceIndex[0]]);
                            return;
                        }
                        if (attempts[0] < MAX_EXTRACTION_ATTEMPTS) {
                            main.postDelayed(extractionRunner[0], RETRY_DELAY_MS);
                            return;
                        }
                        finishError(main, timeoutHolder[0], webView, finished, callback, "Could not parse authenticated page content");
                    }
''',
              'parse fallback'
          )

          replace_once(
              '            webView.loadUrl(mobileUrl);\n',
              '            webView.loadUrl(surfaceUrls[0]);\n',
              'initial surface load'
          )

          marker = '''    private static String preferMobileFacebookUrl(String rawUrl) {
'''
          helper = '''    private static String preferDesktopFacebookUrl(String rawUrl) {
        try {
            Uri uri = Uri.parse(rawUrl);
            String host = uri.getHost();
            if (host == null) return rawUrl;
            String normalized = host.toLowerCase();
            boolean facebook = normalized.equals("facebook.com") || normalized.endsWith(".facebook.com") ||
                normalized.equals("fb.com") || normalized.endsWith(".fb.com");
            if (!facebook || normalized.equals("fb.watch")) return rawUrl;
            return uri.buildUpon().authority("www.facebook.com").build().toString();
        } catch (Exception ignored) {
            return rawUrl;
        }
    }

    private static String[] preferredSurfaceUrls(String rawUrl) {
        java.util.ArrayList<String> urls = new java.util.ArrayList<>();
        String[] candidates = new String[] {
            preferDesktopFacebookUrl(rawUrl),
            preferMobileFacebookUrl(rawUrl),
            preferBasicFacebookUrl(rawUrl)
        };
        for (String candidate : candidates) {
            if (candidate != null && !candidate.isBlank() && !urls.contains(candidate)) urls.add(candidate);
        }
        if (urls.isEmpty()) urls.add(rawUrl);
        return urls.toArray(new String[0]);
    }

'''
          if source.count(marker) != 1:
              raise SystemExit('desktop helper insertion point not found exactly once')
          source = source.replace(marker, helper + marker, 1)

          collector_path.write_text(source)

          tests = test_path.read_text()
          needle = "  assert.match(collector, /setOffscreenPreRaster\\(true\\)/);\n"
          replacement = needle + "  assert.match(collector, /authority\\(\\\"www\\.facebook\\.com\\\"\\)/);\n  assert.match(collector, /preferredSurfaceUrls\\(url\\)/);\n  assert.match(collector, /webView\\.loadUrl\\(surfaceUrls\\[0\\]\\)/);\n"
          if tests.count(needle) != 1:
              raise SystemExit(f'architecture test insertion point count={tests.count(needle)}')
          test_path.write_text(tests.replace(needle, replacement, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and unit tests
        run: |
          npm run lint
          npm test

      - name: Validate exact Android extractor against live Facebook DOM
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 3 http://127.0.0.1:9222/json/version >/dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const BASE = 'http://127.0.0.1:9222';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const targets = await (await fetch(`${BASE}/json/list`)).json();
          const target = targets.find(t => {
            if (t.type !== 'page' || !t.webSocketDebuggerUrl) return false;
            try {
              const h = new URL(t.url).hostname.toLowerCase();
              return h === 'facebook.com' || h.endsWith('.facebook.com');
            } catch { return false; }
          });
          if (!target) throw new Error('NO_FACEBOOK_TAB');

          const java = fs.readFileSync('android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java', 'utf8');
          const match = java.match(/return """\n([\s\S]*?)\n\s*"""\n\s*\.replace\("__LIMIT__"/);
          if (!match) throw new Error('EXTRACTOR_TEXT_BLOCK_NOT_FOUND');
          const lines = match[1].split('\n');
          const nonBlank = lines.filter(x => x.trim());
          const indent = Math.min(...nonBlank.map(x => (x.match(/^\s*/) || [''])[0].length));
          let expression = lines.map(x => x.slice(Math.min(indent, x.length))).join('\n');
          expression = expression.replace('__LIMIT__', '10').replace('__REQUESTED__', JSON.stringify(target.url));

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('CDP websocket timeout')), 5000);
            socket.addEventListener('open', () => { clearTimeout(timer); resolve(); }, { once: true });
            socket.addEventListener('error', () => { clearTimeout(timer); reject(new Error('CDP websocket error')); }, { once: true });
          });
          let id = 0;
          const pending = new Map();
          socket.addEventListener('message', event => {
            let msg; try { msg = JSON.parse(event.data); } catch { return; }
            if (!pending.has(msg.id)) return;
            const p = pending.get(msg.id); pending.delete(msg.id);
            msg.error ? p.reject(new Error(msg.error.message)) : p.resolve(msg.result);
          });
          const cdp = (method, params = {}) => new Promise((resolve, reject) => {
            const next = ++id;
            const timer = setTimeout(() => { pending.delete(next); reject(new Error(`CDP timeout ${method}`)); }, 8000);
            pending.set(next, { resolve: v => { clearTimeout(timer); resolve(v); }, reject: e => { clearTimeout(timer); reject(e); } });
            socket.send(JSON.stringify({ id: next, method, params }));
          });
          const evaluate = async exp => {
            const out = await cdp('Runtime.evaluate', { expression: exp, returnByValue: true, awaitPromise: true });
            if (out.exceptionDetails) throw new Error('EXTRACTOR_EVALUATION_EXCEPTION');
            return out.result?.value;
          };

          await cdp('Runtime.enable');
          const attempts = [];
          for (let i = 0; i < 4; i++) {
            const raw = await evaluate(expression);
            const result = JSON.parse(raw);
            attempts.push({
              error: result.error || null,
              sourceOk: Boolean(result.source?.externalId && result.source?.displayName),
              posts: Array.isArray(result.posts) ? result.posts.length : 0,
              diagnostics: result.diagnostics || null
            });
            if ((result.posts?.length || 0) >= 10) break;
            await evaluate(`(() => { const h=Math.max(window.innerHeight||700,700); window.scrollBy(0,Math.round(h*1.7)); return window.scrollY; })()`);
            await sleep(1000);
          }
          socket.close();
          console.log('ANDROID_EXTRACTOR_LIVE_PARITY');
          console.log(JSON.stringify(attempts, null, 2));
          if (attempts.some(x => x.error === 'SESSION_REQUIRED' || x.error === 'SESSION_CHECKPOINT')) process.exit(3);
          if (!attempts.some(x => x.sourceOk && x.posts > 0)) {
            console.error('ANDROID_EXTRACTOR_NO_REAL_POSTS');
            process.exit(4);
          }
          console.log('ANDROID_EXTRACTOR_REAL_POSTS_FOUND');
          NODE

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android collector
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Commit validated fix to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/meta-surface-apply.yml
          git add android/app/src/main/java/com/mrscrap/socialradar/AuthenticatedWebCollector.java server/tests/architectureRegression.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: prefer validated Facebook desktop surface"
          git push origin HEAD:tmp/meta-surface-fix-20260908
