name: Android v159 Product UI Proof

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v159-product-ui-proof.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  build-install-prove:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      PKG: com.mrscrap.socialradar
      ANDROID_VERSION_CODE: '159'
      ANDROID_VERSION_NAME: '0.1.159-emulator-test'
    steps:
      - name: Checkout exact test lane preserving emulator data
        uses: actions/checkout@v4
        with:
          ref: test/android-headless-emulator-20260909
          fetch-depth: 1
          clean: false

      - name: Fail closed on committed v159 product source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mrscrap_source_identity_cache_v1' src/lib/sourceIdentityCache.ts
          grep -q 'dbSources.map(mergeCachedSourceIdentity)' src/context/RadarContext.tsx
          grep -q 'rememberSourceIdentity(healedIdentity)' src/context/RadarContext.tsx
          grep -q 'fresh.map(mergeCachedSourceIdentity)' src/components/ExtractedPostsModal.tsx
          grep -q 'btn-extracted-posts-home' src/screens/RadarHomeScreen.tsx
          grep -q 'data-extracted-post="1"' src/components/ExtractedPostsModal.tsx
          git diff --exit-code -- src/lib/sourceIdentityCache.ts src/context/RadarContext.tsx src/components/ExtractedPostsModal.tsx src/screens/RadarHomeScreen.tsx
          echo V159_COMMITTED_PRODUCT_SOURCE_GATE=PASS

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build v159
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x node_modules/.bin/vite ] || [ ! -x node_modules/.bin/cap ]; then npm install --no-audit --no-fund; fi
          npx vite build
          npx cap sync android
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"; sdk="$(realpath "$sdk")"
          test -d "$sdk/platforms/android-36"; test -d "$sdk/build-tools/36.0.0"
          printf 'sdk.dir=%s\n' "$sdk" > android/local.properties
          gradle="$HOME/.local/share/mrscrap-gradle/gradle-8.13/bin/gradle"; test -x "$gradle"
          "$gradle" -p android :app:assembleDebug --stacktrace
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"; test -s "$apk"
          echo "APK_SIZE=$(stat -c '%s' "$apk")"
          echo V159_BUILD_GATE=PASS

      - name: Install v159 preserving Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"; test -x "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"; test -n "$serial"
          test "$($adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | tail -n1)" = 1
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_BEFORE_V159_INSTALL=1
          tmp="/mnt/c/Users/${win_user}/AppData/Local/Temp/MR-SCRAP-emulator-test-159.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$tmp"
          out="$($adb -s "$serial" install -r "$(wslpath -w "$tmp")" 2>&1 | tr -d '\r')"; printf '%s\n' "$out"; printf '%s' "$out" | grep -q Success
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"; echo "INSTALLED_VERSION_CODE=$version"; test "$version" = 159
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_V159_INSTALL=1
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 12
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$pid"
          echo "ADB=$adb" >> "$GITHUB_ENV"; echo "SERIAL=$serial" >> "$GITHUB_ENV"; echo "WIN_USER=$win_user" >> "$GITHUB_ENV"; echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo V159_INSTALL_GATE=PASS

      - name: Prove source card identity and extracted media UI
        shell: bash
        run: |
          set -euo pipefail
          socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          [ -n "$socket" ] || socket="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | head -n1 || true)"; test -n "$socket"
          port=9240
          $ADB -s "$SERIAL" forward --remove tcp:$port >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:$port "localabstract:$socket" >/dev/null
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-v159-product-ui.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9240
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=420){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 12;$bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}}
          $expr=@'
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const out={facebook:false,source:false,name:false,avatar:false,avatarLoaded:false,cache:false,button:false,modal:false,error:false,cards:0,mediaCards:0,images:0,videos:0,loadedMedia:0};
            try{const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;const st=await cap?.status?.();out.facebook=st?.facebookConnected===true||st?.connected===true}catch{}
            let rows=[];for(let i=0;i<20;i++){try{const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(r.ok){rows=await r.json();if(Array.isArray(rows)&&rows.length)break}}catch{}await sleep(500)}
            const src=(Array.isArray(rows)?rows:[]).find(x=>x?.platform==='facebook');if(!src)return out;out.source=true;const handle=String(src.handle||'').replace(/^@/,'').trim().toLowerCase();
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'watchlist'}}));
            for(let i=0;i<240;i++){const card=document.getElementById('source-card-'+src.id);if(card){const n=String(card.querySelector('h3')?.textContent||'').trim();const img=card.querySelector('img');out.name=Boolean(n)&&n.replace(/^@/,'').trim().toLowerCase()!==handle;out.avatar=Boolean(img&&/^https?:\/\//i.test(String(img.getAttribute('src')||'')));out.avatarLoaded=Boolean(img&&img.complete&&img.naturalWidth>0);if(out.name&&out.avatar&&out.avatarLoaded)break}await sleep(500)}
            try{const c=JSON.parse(localStorage.getItem('mrscrap_source_identity_cache_v1')||'{}');out.cache=Boolean(c&&typeof c==='object'&&Object.keys(c).length>0)}catch{}
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));
            for(let i=0;i<80;i++){const b=document.getElementById('btn-extracted-posts-home');if(b){out.button=true;b.click();break}await sleep(250)}
            for(let i=0;i<80;i++){if(document.getElementById('modal-extracted-posts')){out.modal=true;break}await sleep(250)}
            if(out.modal){for(let i=0;i<330;i++){if(!document.getElementById('extracted-posts-loading'))break;await sleep(1000)}out.error=Boolean(document.getElementById('extracted-posts-error'));const cards=[...document.querySelectorAll('[data-extracted-post="1"]')];out.cards=cards.length;out.mediaCards=cards.filter(c=>Number(c.getAttribute('data-media-count')||'0')>0).length;const imgs=[...document.querySelectorAll('[data-extracted-image="1"]')];const vids=[...document.querySelectorAll('[data-extracted-video="1"]')];out.images=imgs.length;out.videos=vids.length;out.loadedMedia=imgs.filter(x=>x.complete&&x.naturalWidth>0).length+vids.filter(x=>x.readyState>=1).length;}
            return out;
          })()
          '@
          $r=Eval $expr 420
          Write-Output ('FACEBOOK_CONNECTED='+$(if($r.facebook){'1'}else{'0'}))
          Write-Output ('SOURCE_FOUND='+$(if($r.source){'1'}else{'0'}))
          Write-Output ('SOURCE_UI_REAL_NAME='+$(if($r.name){'1'}else{'0'}))
          Write-Output ('SOURCE_UI_REAL_AVATAR='+$(if($r.avatar){'1'}else{'0'}))
          Write-Output ('SOURCE_AVATAR_LOADED='+$(if($r.avatarLoaded){'1'}else{'0'}))
          Write-Output ('SOURCE_IDENTITY_CACHE_PRESENT='+$(if($r.cache){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_BUTTON='+$(if($r.button){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_MODAL='+$(if($r.modal){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POSTS_ERROR='+$(if($r.error){'1'}else{'0'}))
          Write-Output ('EXTRACTED_POST_CARDS='+[int]$r.cards)
          Write-Output ('EXTRACTED_MEDIA_CARDS='+[int]$r.mediaCards)
          Write-Output ('EXTRACTED_IMAGES='+[int]$r.images)
          Write-Output ('EXTRACTED_VIDEOS='+[int]$r.videos)
          Write-Output ('EXTRACTED_LOADED_MEDIA='+[int]$r.loadedMedia)
          if(!$r.facebook -or !$r.source -or !$r.name -or !$r.avatar -or !$r.avatarLoaded -or !$r.cache -or !$r.button -or !$r.modal -or $r.error -or [int]$r.cards -lt 1 -or [int]$r.mediaCards -lt 1 -or [int]$r.loadedMedia -lt 1){exit 250}
          Write-Output V159_PRODUCT_UI_GATE=PASS
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'

      - name: Prove cache and Facebook session survive restart
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 10
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"; printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_V159_RESTART=1
          echo V159_RESTART_GATE=PASS

      - name: Cleanup temporary proof files
        if: always()
        shell: bash
        run: |
          if [ -n "${ADB:-}" ] && [ -n "${SERIAL:-}" ]; then $ADB -s "$SERIAL" forward --remove tcp:9240 >/dev/null 2>&1 || true; fi
          rm -f "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/mrscrap-v159-product-ui.ps1" "/mnt/c/Users/${WIN_USER:-}/AppData/Local/Temp/MR-SCRAP-emulator-test-159.apk" 2>/dev/null || true
