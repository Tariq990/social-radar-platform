name: Android Headless Emulator Bootstrap

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-headless-emulator-bootstrap.yml]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Install Android CLI binary locally on Windows and inspect SDK support
        shell: bash
        run: |
          set -euo pipefail

          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          test -n "$win_user"

          cli_dir_wsl="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidCLI"
          cli_dir_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidCLI"
          sdk_dir_win="C:\\Users\\${win_user}\\AppData\\Local\\MRSCRAP\\AndroidSdk"
          mkdir -p "$cli_dir_wsl"

          /mnt/c/Windows/System32/curl.exe -fsSL \
            https://dl.google.com/android/cli/latest/windows_x86_64/android.exe \
            -o "${cli_dir_win}\\android.exe"

          android="${cli_dir_wsl}/android.exe"
          test -s "$android"
          echo ANDROID_CLI_PRESENT=1

          "$android" --version 2>&1 | tr -d '\r' | sed 's/^/ANDROID_CLI_VERSION=/'
          "$android" --sdk="$sdk_dir_win" info 2>&1 | tr -d '\r' | sed 's/^/ANDROID_INFO=/'

          "$android" --sdk="$sdk_dir_win" sdk list --all 2>&1 | tr -d '\r' |
            grep -Ei '(^|[ /])(emulator|platform-tools|system-images/android-3[5-7].*(x86_64|x86_6))' |
            head -n 40 |
            sed 's/^/SDK_MATCH=/' || true

          echo ANDROID_CLI_BOOTSTRAP=PASS
