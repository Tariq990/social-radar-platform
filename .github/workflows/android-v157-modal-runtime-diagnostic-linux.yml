name: Android v157 Modal Runtime Diagnostic Linux

on:
  push:
    branches: [test/android-headless-emulator-20260909]
    paths: [.github/workflows/android-v157-modal-runtime-diagnostic-linux.yml]

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar
    steps:
      - name: Capture modal failure without session data
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1;exit}')"
          test -n "$serial"
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"
          test "$version" = 157
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_PRESENT=1
          curl -fsS --max-time 30 https://mr-scrap-api-live.onrender.com/api/health >/dev/null || true
          $adb -s "$serial" shell am force-stop "$PKG" >/dev/null 2>&1 || true
          $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
          sleep 15
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' | awk '{print $1}')"
          test -n "$pid"
          socket="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' | grep -E "(_|^)${pid}$" | head -n1 || true)"
          test -n "$socket"
          port=9231
          $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true
          $adb -s "$serial" forward tcp:$port "localabstract:$socket" >/dev/null
          $adb -s "$serial" logcat -c >/dev/null 2>&1 || true
          ps1="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-v157-modal-linux.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop';$port=9231
          function Target { for($i=0;$i -lt 120;$i++){try{$rows=@(Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 2);$t=$rows|Where-Object{$_.type -eq 'page' -and [string]$_.url -like 'https://localhost*'}|Select-Object -First 1;if($t){return $t}}catch{};Start-Sleep -Milliseconds 250};throw 'app target missing' }
          function Eval([string]$expr,[int]$seconds=300){$t=Target;$u=[Uri]$t.webSocketDebuggerUrl;$ws=[System.Net.WebSockets.ClientWebSocket]::new();$cts=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds($seconds));$ws.ConnectAsync([Uri]("ws://127.0.0.1:$port"+$u.PathAndQuery),$cts.Token).GetAwaiter().GetResult()|Out-Null;$payload=@{id=1;method='Runtime.evaluate';params=@{expression=$expr;returnByValue=$true;awaitPromise=$true}}|ConvertTo-Json -Compress -Depth 12;$bytes=[Text.Encoding]::UTF8.GetBytes($payload);$ws.SendAsync([ArraySegment[byte]]::new($bytes),[System.Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()|Out-Null;$buf=New-Object byte[] 262144;$sb=[Text.StringBuilder]::new();while($true){$r=$ws.ReceiveAsync([ArraySegment[byte]]::new($buf),$cts.Token).GetAwaiter().GetResult();[void]$sb.Append([Text.Encoding]::UTF8.GetString($buf,0,$r.Count));if(!$r.EndOfMessage){continue};$m=$sb.ToString()|ConvertFrom-Json;$sb.Clear()|Out-Null;if($m.id -ne 1){continue};if($m.result.exceptionDetails){throw 'runtime eval exception'};$v=$m.result.result.value;try{$ws.Abort()}catch{};return $v}}
          $expr=@'
          (async()=>{
            const safe=v=>String(v||'').split('|')[0].replace(/[^A-Za-z0-9_.: -]/g,'_').slice(0,120);
            const out={connected:false,total:0,fb:0,eligible:0,button:false,error:false,errorCode:'NONE',cards:0,media:0,warnings:[]};
            const cap=globalThis.Capacitor?.Plugins?.AuthenticatedSocialSession;if(!cap)return out;
            let status={};try{status=await cap.status();out.connected=status?.facebookConnected===true||status?.connected===true}catch{}
            let rows=[];for(let i=0;i<10;i++){try{const r=await fetch('https://mr-scrap-api-live.onrender.com/api/sources',{credentials:'include'});if(r.ok){rows=await r.json();if(Array.isArray(rows)&&rows.length)break}}catch{};await new Promise(r=>setTimeout(r,600))}
            rows=Array.isArray(rows)?rows:[];out.total=rows.length;const fb=rows.filter(x=>x&&x.platform==='facebook'&&((x.connector_type||x.connectorType||'device_session')==='device_session'));out.fb=fb.length;out.eligible=fb.filter(x=>!(x.is_paused===true||x.isPaused===true)&&out.connected).length;
            const oldWarn=console.warn.bind(console);window.__modalWarn=[];console.warn=(...a)=>{try{if(String(a[0]||'').startsWith('[ExtractedPosts] Collection failed'))window.__modalWarn.push(safe(a[1]?.message||a[1]||'unknown'))}catch{};oldWarn(...a)};
            window.dispatchEvent(new CustomEvent('mrscrap:navigate',{detail:{screen:'radar'}}));for(let i=0;i<100&&!document.getElementById('btn-extracted-posts-home');i++)await new Promise(r=>setTimeout(r,200));const b=document.getElementById('btn-extracted-posts-home');out.button=Boolean(b);b?.click();
            for(let i=0;i<900;i++){const modal=document.getElementById('modal-extracted-posts'),loading=document.getElementById('extracted-posts-loading'),err=document.getElementById('extracted-posts-error'),cards=document.querySelectorAll('[data-extracted-post="1"]');if(modal&&!loading&&(err||cards.length)){out.error=Boolean(err);out.cards=cards.length;out.media=document.querySelectorAll('[data-extracted-image="1"],[data-extracted-video="1"]').length;const t=String(err?.textContent||'');out.errorCode=/اربط|Connect Facebook|Connect Instagram/i.test(t)?'NO_ELIGIBLE':/لم يتم استخراج|No real posts/i.test(t)?'NO_POSTS':t?'OTHER':'NONE';break}await new Promise(r=>setTimeout(r,250))}
            out.warnings=(window.__modalWarn||[]).slice(0,6);console.warn=oldWarn;return out;
          })()
          '@
          $r=Eval $expr 300
          Write-Output ('FACEBOOK_CONNECTED='+$(if($r.connected){'1'}else{'0'}));Write-Output ('SOURCE_TOTAL='+[int]$r.total);Write-Output ('FACEBOOK_DEVICE_SOURCES='+[int]$r.fb);Write-Output ('ELIGIBLE_FACEBOOK_SOURCES='+[int]$r.eligible);Write-Output ('MODAL_BUTTON='+$(if($r.button){'1'}else{'0'}));Write-Output ('MODAL_ERROR='+$(if($r.error){'1'}else{'0'}));Write-Output ('MODAL_ERROR_CODE='+[string]$r.errorCode);Write-Output ('MODAL_CARD_COUNT='+[int]$r.cards);Write-Output ('MODAL_MEDIA_COUNT='+[int]$r.media);Write-Output ('MODAL_WARNING_COUNT='+@($r.warnings).Count);foreach($w in @($r.warnings)){Write-Output ('MODAL_WARNING='+[string]$w)}
          PS
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$ps1")" | tr -d '\r'
          logs="$($adb -s "$serial" logcat -d -v brief MRSCRAP_FLOW:I MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' || true)"
          echo "COLLECT_ENTER_COUNT=$(printf '%s\n' "$logs" | grep -c 'event=collect_source_enter' || true)"
          echo "COLLECT_SUCCESS_COUNT=$(printf '%s\n' "$logs" | grep -c 'event=collect_source_success' || true)"
          echo "COLLECT_ERROR_COUNT=$(printf '%s\n' "$logs" | grep -c 'event=collect_source_error' || true)"
          printf '%s\n' "$logs" | grep 'event=collect_source_error' | sed -n 's/.* code=\([A-Z0-9_]*\).*/NATIVE_COLLECT_ERROR_CODE=\1/p' | tail -n1 || true
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q facebook_connected_at
          echo FACEBOOK_SESSION_AFTER_DIAGNOSTIC=1
          rm -f "$ps1" 2>/dev/null || true
          $adb -s "$serial" forward --remove tcp:$port >/dev/null 2>&1 || true
          echo V157_MODAL_RUNTIME_DIAGNOSTIC_COMPLETE=1
