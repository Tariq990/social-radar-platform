name: Android CDP Facebook Collector Proof

on:
  push:
    branches:
      - test/android-headless-emulator-20260909
    paths:
      - .github/workflows/android-cdp-facebook-collector-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrap-app-android-live-emulator
  cancel-in-progress: false

jobs:
  cdp-proof:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    env:
      PKG: com.mrscrap.socialradar

    steps:
      - name: Resolve live rebuilt app and preserved Facebook session
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/MRSCRAP/AndroidSdk/platform-tools/adb.exe"
          test -s "$adb"
          serial="$($adb devices 2>/dev/null | tr -d '\r' | awk '$1 ~ /^emulator-/ && $2=="device" {print $1; exit}')"
          test -n "$serial"
          pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
          if [ -z "$pid" ]; then
            $adb -s "$serial" shell am start -W -n "$PKG/.MainActivity" >/dev/null
            sleep 4
            pid="$($adb -s "$serial" shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)"
          fi
          test -n "$pid"
          version="$($adb -s "$serial" shell dumpsys package "$PKG" 2>/dev/null | tr -d '\r' | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n1)"
          echo "INSTALLED_VERSION_CODE=$version"
          test "$version" = '143'
          marker="$($adb -s "$serial" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          printf '%s' "$marker" | grep -q 'facebook_connected_at'
          echo FACEBOOK_SESSION_METADATA=1
          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "APP_PID=$pid" >> "$GITHUB_ENV"
          echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          echo LIVE_REBUILT_APP_GATE=PASS

      - name: Discover and forward the app WebView DevTools socket
        shell: bash
        run: |
          set -euo pipefail
          sockets="$($ADB -s "$SERIAL" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | sed -n 's/.*@\(webview_devtools_remote[^ ]*\)$/\1/p' || true)"
          count="$(printf '%s\n' "$sockets" | sed '/^$/d' | wc -l)"
          echo "WEBVIEW_DEVTOOLS_SOCKET_COUNT=$count"
          socket="$(printf '%s\n' "$sockets" | grep -E "${APP_PID}$|_${APP_PID}($|_)" | head -n1 || true)"
          if [ -z "$socket" ]; then
            socket="$(printf '%s\n' "$sockets" | head -n1 || true)"
          fi
          if [ -z "$socket" ]; then
            echo WEBVIEW_DEVTOOLS_SOCKET_FOUND=0
            exit 30
          fi
          echo WEBVIEW_DEVTOOLS_SOCKET_FOUND=1
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          $ADB -s "$SERIAL" forward tcp:9223 "localabstract:$socket" >/dev/null
          echo CDP_FORWARD_CREATED=1

      - name: Click Grab latest 10 through Windows-side WebView CDP
        shell: bash
        run: |
          set -euo pipefail
          $ADB -s "$SERIAL" logcat -c >/dev/null 2>&1 || true
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-cdp-click.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $targets = $null
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $targets = Invoke-RestMethod -Uri 'http://127.0.0.1:9223/json/list' -TimeoutSec 3
              if ($targets) { break }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $targets) { throw 'CDP target list unavailable on Windows localhost' }
          $pages = @($targets | Where-Object { $_.type -eq 'page' -and $_.webSocketDebuggerUrl })
          Write-Output ('CDP_PAGE_COUNT=' + $pages.Count)
          if ($pages.Count -lt 1) { throw 'No debuggable WebView page target' }
          $page = @($pages | Where-Object { [string]$_.url -like 'https://localhost*' } | Select-Object -First 1)
          if ($page.Count -eq 0) { $page = @($pages | Select-Object -First 1) }
          $wsUrl = [string]$page[0].webSocketDebuggerUrl
          $uri = [Uri]$wsUrl
          $wsUrl = 'ws://127.0.0.1:9223' + $uri.PathAndQuery
          Write-Output 'CDP_APP_PAGE_FOUND=1'

          $expression = @"
          (() => {
            const buttons = [...document.querySelectorAll('button')];
            const arabic = '\u0627\u062c\u0644\u0628 \u0622\u062e\u0631 10 \u0648\u062d\u0644\u0644\u0647\u0627';
            const target = buttons.find((button) => {
              const text = String(button.innerText || button.textContent || '').replace(/\s+/g, ' ').trim();
              return text.includes(arabic) || /Grab latest 10 and analyze/i.test(text);
            });
            if (!target) return {clicked:false, buttonCount:buttons.length};
            target.scrollIntoView({block:'center'});
            target.click();
            return {clicked:true, buttonCount:buttons.length};
          })()
          "@

          $ws = [System.Net.WebSockets.ClientWebSocket]::new()
          $cts = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(10))
          $ws.ConnectAsync([Uri]$wsUrl, $cts.Token).GetAwaiter().GetResult()
          $payload = @{ id = 1; method = 'Runtime.evaluate'; params = @{ expression = $expression; returnByValue = $true; awaitPromise = $true } } | ConvertTo-Json -Compress -Depth 8
          $bytes = [Text.Encoding]::UTF8.GetBytes($payload)
          $segment = [ArraySegment[byte]]::new($bytes)
          $ws.SendAsync($segment, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $cts.Token).GetAwaiter().GetResult()

          $buffer = New-Object byte[] 65536
          $builder = [Text.StringBuilder]::new()
          while ($true) {
            $received = $ws.ReceiveAsync([ArraySegment[byte]]::new($buffer), $cts.Token).GetAwaiter().GetResult()
            if ($received.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close) { throw 'CDP socket closed before response' }
            [void]$builder.Append([Text.Encoding]::UTF8.GetString($buffer, 0, $received.Count))
            if (-not $received.EndOfMessage) { continue }
            $message = $builder.ToString() | ConvertFrom-Json
            $builder.Clear() | Out-Null
            if ($message.id -ne 1) { continue }
            $value = $message.result.result.value
            $clicked = $false
            $buttonCount = -1
            if ($null -ne $value) {
              $clicked = [bool]$value.clicked
              if ($null -ne $value.buttonCount) { $buttonCount = [int]$value.buttonCount }
            }
            Write-Output ('CDP_BUTTON_COUNT=' + $buttonCount)
            Write-Output ('CDP_CLICKED=' + ($(if ($clicked) {'1'} else {'0'})))
            if (-not $clicked) { exit 32 }
            break
          }
          try { $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, 'done', [Threading.CancellationToken]::None).GetAwaiter().GetResult() } catch {}
          PS
          ps_win="$(wslpath -w "$ps1")"
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$ps_win" | tr -d '\r'
          echo REAL_WEBVIEW_CLICK_GATE=PASS

      - name: Prove Facebook collector terminal result
        shell: bash
        run: |
          set -euo pipefail
          success=''
          failure=''
          for i in $(seq 1 75); do
            events="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' || true)"
            success="$(printf '%s\n' "$events" | grep -E 'event=collect_source_success platform=facebook posts=[0-9]+' | tail -n1 || true)"
            failure="$(printf '%s\n' "$events" | grep -E 'event=collect_source_error platform=facebook code=' | tail -n1 || true)"
            if [ -n "$success" ] || [ -n "$failure" ]; then
              break
            fi
            sleep 1
          done

          echo '=== SAFE COLLECTOR TERMINAL TRACE ==='
          $ADB -s "$SERIAL" logcat -b all -d -v threadtime 2>/dev/null | tr -d '\r' \
            | grep -E 'MRSCRAP_(FLOW|COLLECTOR)' \
            | sed -E 's/(https?:\/\/)[^ ]+/\1[redacted]/g' \
            | tail -n 140 || true

          syntax_count="$($ADB -s "$SERIAL" logcat -b all -d -v brief 2>/dev/null | tr -d '\r' | grep -c 'Uncaught SyntaxError: Invalid or unexpected token' || true)"
          echo "INVALID_JS_SYNTAX_COUNT=$syntax_count"
          test "$syntax_count" -eq 0

          if [ -n "$failure" ]; then
            code="$(printf '%s' "$failure" | sed -n 's/.*code=\([^ ]*\).*/\1/p')"
            echo "FACEBOOK_COLLECTOR_FAILURE_CODE=${code:-unknown}"
            exit 34
          fi
          test -n "$success"
          posts="$(printf '%s' "$success" | sed -n 's/.*posts=\([0-9][0-9]*\).*/\1/p')"
          echo REQUESTED_POSTS=10
          echo "FACEBOOK_POSTS_COLLECTED=$posts"
          test -n "$posts"
          test "$posts" -gt 0
          echo FACEBOOK_REAL_COLLECTION_GATE=PASS

      - name: Preserve final session proof
        if: always()
        shell: bash
        run: |
          set +e
          marker="$($ADB -s "$SERIAL" shell "run-as $PKG cat shared_prefs/mrscrap_device_session_meta.xml 2>/dev/null" 2>/dev/null | tr -d '\r' || true)"
          if printf '%s' "$marker" | grep -q 'facebook_connected_at'; then
            echo FACEBOOK_SESSION_METADATA_FINAL=1
          else
            echo FACEBOOK_SESSION_METADATA_FINAL=0
          fi
          $ADB -s "$SERIAL" forward --remove tcp:9223 >/dev/null 2>&1 || true
          rm -f "/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-cdp-click.ps1" 2>/dev/null || true
          echo FACEBOOK_CDP_COLLECTOR_PROOF_COMPLETE=1
