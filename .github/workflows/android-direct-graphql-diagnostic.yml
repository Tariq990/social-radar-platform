name: Direct Android Facebook GraphQL Diagnostic

on:
  push:
    branches: [test/android-physical-fix-20260909]
    paths: [.github/workflows/android-direct-graphql-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-android-facebook-graphql-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Connect phone and forward WebView debugger
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-platform-tools/platform-tools/adb.exe"
          test -x "$adb"
          serial=""
          for i in $(seq 1 30); do
            serial="$($adb devices 2>/dev/null | tr -d '\r' | awk 'NR>1 && $2=="device" {print $1; exit}')"
            [ -n "$serial" ] && break
            sleep 1
          done
          test -n "$serial"
          echo "::add-mask::$serial"
          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_FLOW I || true
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_COLLECTOR I || true
          "$adb" -s "$serial" shell am start -n com.mrscrap.socialradar/.MainActivity >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell dumpsys package com.mrscrap.socialradar 2>/dev/null | tr -d '\r' | grep -E 'versionCode=|versionName=' | head -n4
          socket_name=""
          for i in $(seq 1 45); do
            pid="$($adb -s "$serial" shell pidof com.mrscrap.socialradar 2>/dev/null | tr -d '\r' | awk '{print $1}')"
            if [ -n "$pid" ]; then
              socket_name="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | grep -o "webview_devtools_remote_${pid}" | head -n1 || true)"
              [ -n "$socket_name" ] && break
            fi
            sleep 1
          done
          test -n "$socket_name"
          "$adb" -s "$serial" forward --remove tcp:19222 >/dev/null 2>&1 || true
          "$adb" -s "$serial" forward tcp:19222 "localabstract:${socket_name}" >/dev/null
          /mnt/c/Windows/System32/curl.exe -fsS http://127.0.0.1:19222/json -o NUL
          echo "PHONE_AND_CDP_FORWARD_READY"

      - name: Run direct native collector trace from Windows PowerShell
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-direct-graphql.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference = 'Stop'
          $Base = 'http://127.0.0.1:19222'
          $Source = 'https://www.facebook.com/tarik.ziad.3914'
          $DesktopUa = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          $ExpectedDoc = '27465012859856795'
          $ExpectedFriendly = 'ProfileCometTimelineFeedRefetchQuery'
          $script:NextId = 0

          function Get-Targets {
            @(Invoke-RestMethod -Uri "$Base/json" -TimeoutSec 3)
          }

          function New-Cdp([string]$Url) {
            $Url = $Url -replace '^ws://localhost:', 'ws://127.0.0.1:'
            $ws = [System.Net.WebSockets.ClientWebSocket]::new()
            $ws.Options.Proxy = $null
            $cts = [Threading.CancellationTokenSource]::new(5000)
            [void]$ws.ConnectAsync([Uri]$Url,$cts.Token).GetAwaiter().GetResult()
            $cts.Dispose()
            return $ws
          }

          function Send-Text($Ws,[string]$Text) {
            $bytes=[Text.Encoding]::UTF8.GetBytes($Text)
            $seg=[ArraySegment[byte]]::new($bytes)
            [void]$Ws.SendAsync($seg,[Net.WebSockets.WebSocketMessageType]::Text,$true,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          }

          function Receive-Text($Ws,[int]$TimeoutMs=500) {
            $cts=[Threading.CancellationTokenSource]::new($TimeoutMs)
            $ms=[IO.MemoryStream]::new()
            try {
              do {
                $buf=New-Object byte[] 65536
                $seg=[ArraySegment[byte]]::new($buf)
                $res=$Ws.ReceiveAsync($seg,$cts.Token).GetAwaiter().GetResult()
                if($res.MessageType -eq [Net.WebSockets.WebSocketMessageType]::Close){ return $null }
                if($res.Count -gt 0){$ms.Write($buf,0,$res.Count)}
              } while(-not $res.EndOfMessage)
              return [Text.Encoding]::UTF8.GetString($ms.ToArray())
            } catch [OperationCanceledException] { return $null }
            finally { $ms.Dispose(); $cts.Dispose() }
          }

          function Send-Cdp($Ws,[string]$Method,$Params=@{},[System.Collections.ArrayList]$Events=$null,[int]$TimeoutMs=5000) {
            $script:NextId++
            $id=$script:NextId
            Send-Text $Ws (@{id=$id;method=$Method;params=$Params}|ConvertTo-Json -Depth 20 -Compress)
            $deadline=[DateTime]::UtcNow.AddMilliseconds($TimeoutMs)
            while([DateTime]::UtcNow -lt $deadline){
              $raw=Receive-Text $Ws 400
              if(-not $raw){continue}
              try{$msg=$raw|ConvertFrom-Json -Depth 40}catch{continue}
              if($msg.id -eq $id){return $msg}
              if($Events -ne $null -and $msg.method){[void]$Events.Add($msg)}
            }
            throw "CDP_TIMEOUT_$Method"
          }

          $targets=Get-Targets
          $main=$targets|Where-Object { $_.type -eq 'page' -and ([string]$_.url).StartsWith('https://localhost') }|Select-Object -First 1
          if(-not $main){throw 'MAIN_CAPACITOR_TARGET_NOT_FOUND'}
          $baseline=@{}; $targets|Where-Object {$_.type -eq 'page'}|ForEach-Object {$baseline[[string]$_.id]=$true}
          $mainWs=New-Cdp ([string]$main.webSocketDebuggerUrl)
          [void](Send-Cdp $mainWs 'Runtime.enable')

          $expr=@"
          (() => window.Capacitor.nativePromise('AuthenticatedSocialSession','collectSource',{
            sourceId:'diagnostic-profile',url:'$Source',platform:'facebook',limit:10
          }).then(x=>({ok:true,count:Array.isArray(x?.posts)?x.posts.length:0})).catch(e=>({ok:false,error:String(e?.message||e||'unknown').split('|')[0]})))()
          "@
          [void](Send-Cdp $mainWs 'Runtime.evaluate' @{expression=$expr;awaitPromise=$false;returnByValue=$true})
          Write-Output 'NATIVE_COLLECTOR_INVOKED=1'

          $collector=$null
          $deadline=[DateTime]::UtcNow.AddSeconds(15)
          while([DateTime]::UtcNow -lt $deadline -and -not $collector){
            foreach($t in (Get-Targets)){
              if($t.type -eq 'page' -and -not $baseline.ContainsKey([string]$t.id)){$collector=$t;break}
            }
            if(-not $collector){Start-Sleep -Milliseconds 100}
          }
          if(-not $collector){throw 'COLLECTOR_WEBVIEW_NOT_FOUND'}
          Write-Output 'COLLECTOR_WEBVIEW_FOUND=1'

          $events=[Collections.ArrayList]::new()
          $ws=New-Cdp ([string]$collector.webSocketDebuggerUrl)
          [void](Send-Cdp $ws 'Runtime.enable' @{} $events)
          [void](Send-Cdp $ws 'Network.enable' @{} $events)
          [void](Send-Cdp $ws 'Page.enable' @{} $events)
          [void](Send-Cdp $ws 'Network.setUserAgentOverride' @{userAgent=$DesktopUa} $events)
          [void](Send-Cdp $ws 'Page.navigate' @{url=$Source} $events)
          Write-Output 'DESKTOP_UA_AND_RENAVIGATION_APPLIED=1'

          $reqId=$null; $http=$null; $contract=$null; $bodySummary=$null; $docStatuses=@()
          $deadline=[DateTime]::UtcNow.AddSeconds(35)
          while([DateTime]::UtcNow -lt $deadline -and -not $bodySummary){
            $raw=Receive-Text $ws 300
            if($raw){try{[void]$events.Add(($raw|ConvertFrom-Json -Depth 50))}catch{}}
            while($events.Count -gt 0){
              $msg=$events[0];$events.RemoveAt(0)
              $p=$msg.params
              if($msg.method -eq 'Network.requestWillBeSent'){
                $uri=$null;try{$uri=[Uri][string]$p.request.url}catch{}
                if($uri -and $uri.Host.EndsWith('facebook.com') -and $uri.AbsolutePath -eq '/api/graphql/'){
                  $reqId=[string]$p.requestId
                  $post=[string]$p.request.postData
                  if(-not $post){try{$r=Send-Cdp $ws 'Network.getRequestPostData' @{requestId=$reqId} $events 2500;$post=[string]$r.result.postData}catch{}}
                  $form=[Web.HttpUtility]::ParseQueryString($post)
                  $vars=$null;try{$vars=([string]$form['variables']|ConvertFrom-Json -Depth 40)}catch{}
                  $keys=@(); if($vars){$keys=@($vars.PSObject.Properties.Name)}
                  $sid=''; if($vars){$sid=[string]$vars.id}
                  $contract=[ordered]@{
                    doc_id_match=([string]$form['doc_id'] -eq $ExpectedDoc)
                    friendly_name_match=([string]$form['fb_api_req_friendly_name'] -eq $ExpectedFriendly)
                    variable_key_count=$keys.Count
                    source_id_numeric=($sid -match '^\d+$')
                    source_id_length=$sid.Length
                  }
                  Write-Output 'GRAPHQL_REQUEST_SEEN=1'
                }
              } elseif($msg.method -eq 'Network.responseReceived') {
                $resp=$p.response;$uri=$null;try{$uri=[Uri][string]$resp.url}catch{}
                if($uri -and $uri.Host.EndsWith('facebook.com') -and [string]$p.type -eq 'Document'){$docStatuses+= [int]$resp.status}
                if($reqId -and [string]$p.requestId -eq $reqId){$http=[int]$resp.status}
              } elseif($msg.method -eq 'Network.loadingFinished' -and $reqId -and [string]$p.requestId -eq $reqId) {
                try{
                  $r=Send-Cdp $ws 'Network.getResponseBody' @{requestId=$reqId} $events 3000
                  $body=[string]$r.result.body
                  if($r.result.base64Encoded){$body=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($body))}
                  $jsonLines=0;$errors=0;$codes=@{};$edges=0;$posts=0;$direct=0;$pageInfo=0
                  foreach($line in ($body -split "`r?`n")){
                    if(-not $line.Trim()){continue};$obj=$null;try{$obj=$line|ConvertFrom-Json -Depth 80}catch{continue};$jsonLines++
                    if($obj.errors){foreach($e in @($obj.errors)){$errors++;if($null -ne $e.code){$codes[[string]$e.code]=$true}}}
                    $data=$obj.data;if(-not $data){continue};if($data.page_info){$pageInfo++};$node=$data.node;if(-not $node){continue}
                    if($node.post_id){$direct++;$posts++}
                    $feed=$node.timeline_list_feed_units;if($feed){if($feed.page_info){$pageInfo++};if($feed.edges){$ee=@($feed.edges);$edges+=$ee.Count;foreach($edge in $ee){if($edge.node.post_id){$posts++}}}}
                  }
                  $bodySummary=[ordered]@{json_lines=$jsonLines;graphql_error_count=$errors;graphql_error_codes=@($codes.Keys|Sort-Object);timeline_edges=$edges;post_nodes_with_post_id=$posts;direct_post_nodes=$direct;page_info_blocks=$pageInfo}
                }catch{$bodySummary=[ordered]@{body_unavailable=$true}}
              }
            }
          }

          if(-not $contract){$contract=[ordered]@{request_seen=$false}}
          if(-not $bodySummary){$bodySummary=[ordered]@{not_captured=$true}}
          Write-Output ('GRAPHQL_CONTRACT=' + ($contract|ConvertTo-Json -Compress))
          Write-Output ('FACEBOOK_DOCUMENT_STATUSES=' + (@($docStatuses)|ConvertTo-Json -Compress))
          Write-Output ('GRAPHQL_HTTP_STATUS=' + $(if($null -eq $http){'NONE'}else{$http}))
          Write-Output ('GRAPHQL_RESPONSE_SUMMARY=' + ($bodySummary|ConvertTo-Json -Compress))

          try{$ws.Dispose()}catch{};try{$mainWs.Dispose()}catch{}
          PS
          win_ps1="C:\\Users\\${WIN_USER}\\AppData\\Local\\Temp\\mrscrap-direct-graphql.ps1"
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$win_ps1"

      - name: Capture safe native markers
        if: always()
        shell: bash
        run: |
          set +u
          echo "SAFE_NATIVE_MARKERS_BEGIN"
          if [ -n "${ADB:-}" ] && [ -n "${SERIAL:-}" ]; then
            "$ADB" -s "$SERIAL" logcat -d -v threadtime -s MRSCRAP_FLOW:I MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' | tail -n120 || true
            "$ADB" -s "$SERIAL" forward --remove tcp:19222 >/dev/null 2>&1 || true
          fi
          echo "SAFE_NATIVE_MARKERS_END"
