name: Direct Android Facebook GraphQL Diagnostic

on:
  push:
    branches: [test/android-physical-fix-20260909]
    paths: [.github/workflows/android-direct-graphql-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-android-facebook-graphql-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Connect physical APK 140 WebView debugger
        shell: bash
        run: |
          set -euo pipefail
          win_user="$(/mnt/c/Windows/System32/cmd.exe /d /c echo %USERNAME% 2>/dev/null | tr -d '\r' | tail -n1)"
          adb="/mnt/c/Users/${win_user}/AppData/Local/Temp/mrscrap-platform-tools/platform-tools/adb.exe"
          serial=""
          for i in $(seq 1 30); do
            serial="$($adb devices 2>/dev/null | tr -d '\r' | awk 'NR>1 && $2=="device" {print $1; exit}')"
            [ -n "$serial" ] && break
            sleep 1
          done
          test -n "$serial"
          echo "::add-mask::$serial"
          echo "ADB=$adb" >> "$GITHUB_ENV"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          echo "WIN_USER=$win_user" >> "$GITHUB_ENV"
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_FLOW I || true
          "$adb" -s "$serial" shell setprop log.tag.MRSCRAP_COLLECTOR I || true
          "$adb" -s "$serial" shell am start -n com.mrscrap.socialradar/.MainActivity >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell dumpsys package com.mrscrap.socialradar | tr -d '\r' | grep -E 'versionCode=|versionName=' | head -n4
          socket_name=""
          for i in $(seq 1 45); do
            pid="$($adb -s "$serial" shell pidof com.mrscrap.socialradar 2>/dev/null | tr -d '\r' | awk '{print $1}')"
            if [ -n "$pid" ]; then
              socket_name="$($adb -s "$serial" shell cat /proc/net/unix 2>/dev/null | tr -d '\r' | grep -o "webview_devtools_remote_${pid}" | head -n1 || true)"
              [ -n "$socket_name" ] && break
            fi
            sleep 1
          done
          test -n "$socket_name"
          "$adb" -s "$serial" forward --remove tcp:19222 >/dev/null 2>&1 || true
          "$adb" -s "$serial" forward tcp:19222 "localabstract:${socket_name}" >/dev/null
          /mnt/c/Windows/System32/curl.exe -fsS http://127.0.0.1:19222/json -o NUL
          echo PHONE_AND_CDP_FORWARD_READY

      - name: Inspect one native Facebook GraphQL request and response
        shell: bash
        run: |
          set -euo pipefail
          ps1="/mnt/c/Users/${WIN_USER}/AppData/Local/Temp/mrscrap-direct-graphql.ps1"
          cat > "$ps1" <<'PS'
          $ErrorActionPreference='Stop'
          $Base='http://127.0.0.1:19222'
          $Source='https://www.facebook.com/tarik.ziad.3914'
          $DesktopUa='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          $ExpectedDoc='27465012859856795'
          $ExpectedFriendly='ProfileCometTimelineFeedRefetchQuery'
          $script:NextId=0

          function Targets { @(Invoke-RestMethod -Uri "$Base/json" -TimeoutSec 3) }
          function Open-Ws([string]$u) {
            $u=$u -replace '^ws://localhost:','ws://127.0.0.1:'
            $w=[System.Net.WebSockets.ClientWebSocket]::new(); $w.Options.Proxy=$null
            [void]$w.ConnectAsync([Uri]$u,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
            return $w
          }
          function Send-Text($w,[string]$s) {
            $b=[Text.Encoding]::UTF8.GetBytes($s); $seg=[ArraySegment[byte]]::new($b)
            [void]$w.SendAsync($seg,[Net.WebSockets.WebSocketMessageType]::Text,$true,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          }
          function Recv($w) {
            $ms=[IO.MemoryStream]::new()
            try {
              do {
                $b=New-Object byte[] 65536; $seg=[ArraySegment[byte]]::new($b)
                $r=$w.ReceiveAsync($seg,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
                if($r.MessageType -eq [Net.WebSockets.WebSocketMessageType]::Close){return $null}
                if($r.Count){$ms.Write($b,0,$r.Count)}
              } while(-not $r.EndOfMessage)
              return [Text.Encoding]::UTF8.GetString($ms.ToArray())
            } finally {$ms.Dispose()}
          }
          function Cmd($w,[string]$m,$p=@{},[Collections.ArrayList]$q=$null) {
            $script:NextId++; $id=$script:NextId
            Send-Text $w (@{id=$id;method=$m;params=$p}|ConvertTo-Json -Depth 30 -Compress)
            while($true){
              $raw=Recv $w; if(-not $raw){throw "CDP_CLOSED_$m"}
              try{$x=$raw|ConvertFrom-Json -Depth 80}catch{continue}
              if($x.id -eq $id){return $x}
              if($q -ne $null -and $x.method){[void]$q.Add($x)}
            }
          }

          $ts=Targets
          $main=$ts|Where-Object {$_.type -eq 'page' -and ([string]$_.url).StartsWith('https://localhost')}|Select-Object -First 1
          if(-not $main){throw 'MAIN_CAPACITOR_TARGET_NOT_FOUND'}
          $baseline=@{}; $ts|Where-Object {$_.type -eq 'page'}|ForEach-Object {$baseline[[string]$_.id]=$true}
          $mw=Open-Ws ([string]$main.webSocketDebuggerUrl)
          [void](Cmd $mw 'Runtime.enable')
          $expr="(() => window.Capacitor.nativePromise('AuthenticatedSocialSession','collectSource',{sourceId:'diagnostic-profile',url:'$Source',platform:'facebook',limit:10}).catch(()=>null))()"
          [void](Cmd $mw 'Runtime.evaluate' @{expression=$expr;awaitPromise=$false;returnByValue=$true})
          Write-Output NATIVE_COLLECTOR_INVOKED=1

          $collector=$null; $until=[DateTime]::UtcNow.AddSeconds(15)
          while([DateTime]::UtcNow -lt $until -and -not $collector){
            foreach($t in (Targets)){
              if($t.type -eq 'page' -and -not $baseline.ContainsKey([string]$t.id)){$collector=$t;break}
            }
            if(-not $collector){Start-Sleep -Milliseconds 75}
          }
          if(-not $collector){throw 'COLLECTOR_WEBVIEW_NOT_FOUND'}
          Write-Output COLLECTOR_WEBVIEW_FOUND=1

          $q=[Collections.ArrayList]::new(); $w=Open-Ws ([string]$collector.webSocketDebuggerUrl)
          [void](Cmd $w 'Runtime.enable' @{} $q)
          [void](Cmd $w 'Network.enable' @{} $q)
          [void](Cmd $w 'Page.enable' @{} $q)
          [void](Cmd $w 'Network.setUserAgentOverride' @{userAgent=$DesktopUa} $q)
          [void](Cmd $w 'Page.navigate' @{url=$Source} $q)
          Write-Output DESKTOP_UA_AND_RENAVIGATION_APPLIED=1

          $req=$null; $http=$null; $contract=$null; $summary=$null; $docStatuses=@(); $sourceId=''
          while(-not $summary){
            if($q.Count -gt 0){$x=$q[0];$q.RemoveAt(0)} else {$x=(Recv $w|ConvertFrom-Json -Depth 80)}
            $p=$x.params
            if($x.method -eq 'Network.requestWillBeSent'){
              $u=$null; try{$u=[Uri][string]$p.request.url}catch{}
              if($u -and $u.Host.EndsWith('facebook.com') -and $u.AbsolutePath -eq '/api/graphql/'){
                $req=[string]$p.requestId; $post=[string]$p.request.postData
                if(-not $post){$r=Cmd $w 'Network.getRequestPostData' @{requestId=$req} $q; $post=[string]$r.result.postData}
                $form=[Web.HttpUtility]::ParseQueryString($post)
                $vars=$null; try{$vars=([string]$form['variables']|ConvertFrom-Json -Depth 80)}catch{}
                $keys=@(); if($vars){$keys=@($vars.PSObject.Properties.Name);$sourceId=[string]$vars.id}
                $contract=[ordered]@{
                  doc_id_match=([string]$form['doc_id'] -eq $ExpectedDoc)
                  friendly_name_match=([string]$form['fb_api_req_friendly_name'] -eq $ExpectedFriendly)
                  variable_key_count=$keys.Count
                  source_id_numeric=($sourceId -match '^\d+$')
                  source_id_length=$sourceId.Length
                }
                Write-Output GRAPHQL_REQUEST_SEEN=1
              }
            } elseif($x.method -eq 'Network.responseReceived'){
              $resp=$p.response; $u=$null; try{$u=[Uri][string]$resp.url}catch{}
              if($u -and $u.Host.EndsWith('facebook.com') -and [string]$p.type -eq 'Document'){$docStatuses += [int]$resp.status}
              if($req -and [string]$p.requestId -eq $req){$http=[int]$resp.status}
            } elseif($x.method -eq 'Network.loadingFinished' -and $req -and [string]$p.requestId -eq $req){
              $r=Cmd $w 'Network.getResponseBody' @{requestId=$req} $q
              $body=[string]$r.result.body
              if($r.result.base64Encoded){$body=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($body))}
              $jsonLines=0;$errors=0;$codes=@{};$edges=0;$edgeNodes=0;$posts=0;$direct=0;$pageInfo=0;$dataBlocks=0;$nodeBlocks=0;$nodeIdMatch=$false;$dataKeys=@{};$nodeTypes=@{}
              foreach($line in ($body -split "`r?`n")){
                if(-not $line.Trim()){continue}; $o=$null; try{$o=$line|ConvertFrom-Json -Depth 100}catch{continue}; $jsonLines++
                if($o.errors){foreach($e in @($o.errors)){$errors++;if($null -ne $e.code){$codes[[string]$e.code]=$true}}}
                $d=$o.data; if(-not $d){continue}; $dataBlocks++; foreach($k in $d.PSObject.Properties.Name){$dataKeys[$k]=$true}
                if($d.page_info){$pageInfo++}; $n=$d.node; if(-not $n){continue}; $nodeBlocks++
                if($n.id -and $sourceId -and ([string]$n.id -eq $sourceId)){$nodeIdMatch=$true}
                if($n.__typename){$nodeTypes[[string]$n.__typename]=$true}
                if($n.post_id){$direct++;$posts++}
                $f=$n.timeline_list_feed_units
                if($f){if($f.page_info){$pageInfo++};if($f.edges){$ee=@($f.edges);$edges+=$ee.Count;foreach($e in $ee){if($e.node){$edgeNodes++};if($e.node.post_id){$posts++}}}}
              }
              $summary=[ordered]@{
                response_bytes=[Text.Encoding]::UTF8.GetByteCount($body)
                json_lines=$jsonLines
                graphql_error_count=$errors
                graphql_error_codes=@($codes.Keys|Sort-Object)
                data_blocks=$dataBlocks
                data_keys=@($dataKeys.Keys|Sort-Object)
                node_blocks=$nodeBlocks
                node_id_matches_requested=$nodeIdMatch
                node_typenames=@($nodeTypes.Keys|Sort-Object)
                timeline_edges=$edges
                timeline_edge_nodes=$edgeNodes
                post_nodes_with_post_id=$posts
                direct_post_nodes=$direct
                page_info_blocks=$pageInfo
              }
            }
          }
          Write-Output ('GRAPHQL_CONTRACT=' + ($contract|ConvertTo-Json -Compress))
          Write-Output ('FACEBOOK_DOCUMENT_STATUSES=' + (@($docStatuses)|ConvertTo-Json -Compress))
          Write-Output ('GRAPHQL_HTTP_STATUS=' + $(if($null -eq $http){'NONE'}else{$http}))
          Write-Output ('GRAPHQL_RESPONSE_SUMMARY=' + ($summary|ConvertTo-Json -Compress))
          try{$w.Dispose()}catch{};try{$mw.Dispose()}catch{}
          PS
          win_ps1="C:\\Users\\${WIN_USER}\\AppData\\Local\\Temp\\mrscrap-direct-graphql.ps1"
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$win_ps1"

      - name: Capture safe native markers
        if: always()
        shell: bash
        run: |
          set +u
          echo SAFE_NATIVE_MARKERS_BEGIN
          if [ -n "${ADB:-}" ] && [ -n "${SERIAL:-}" ]; then
            "$ADB" -s "$SERIAL" logcat -d -v threadtime -s MRSCRAP_FLOW:I MRSCRAP_COLLECTOR:I '*:S' 2>/dev/null | tr -d '\r' | tail -n80 || true
            "$ADB" -s "$SERIAL" forward --remove tcp:19222 >/dev/null 2>&1 || true
          fi
          echo SAFE_NATIVE_MARKERS_END
