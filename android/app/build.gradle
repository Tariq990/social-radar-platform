apply plugin: 'com.android.application'

def mrScrapBackendOrigin = System.getenv('VITE_API_BASE_URL') ?: 'https://mr-scrap-api-live.onrender.com'

android {
    namespace = 'com.mrscrap.socialradar'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.mrscrap.socialradar'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '0.1.0'
        buildConfigField 'String', 'MR_SCRAP_BACKEND_ORIGIN', groovy.json.JsonOutput.toJson(mrScrapBackendOrigin)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        alphaDebug {
            // Stable alpha-only key so sideloaded test builds can update one another. This is not
            // the future Play Store / production signing key and must never be reused for release.
            storeFile file('mr-scrap-alpha.keystore')
            storePassword 'android'
            keyAlias 'mrscrapalpha'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.alphaDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:$workManagerVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-push-notifications')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception ignored) {
    logger.info('google-services.json not found; FCM delivery is disabled for this build.')
}
