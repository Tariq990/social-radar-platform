apply plugin: 'com.android.application'

def alphaKeystorePath = System.getenv('ANDROID_ALPHA_KEYSTORE_PATH')
def alphaStorePassword = System.getenv('ANDROID_ALPHA_STORE_PASSWORD')
def alphaKeyAlias = System.getenv('ANDROID_ALPHA_KEY_ALIAS')
def alphaKeyPassword = System.getenv('ANDROID_ALPHA_KEY_PASSWORD')
def alphaSigningConfigured = [alphaKeystorePath, alphaStorePassword, alphaKeyAlias, alphaKeyPassword].every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace = 'com.mrscrap.socialradar'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.mrscrap.socialradar'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (alphaSigningConfigured) {
            alphaDebug {
                // Alpha-only material is supplied at build time from CI/local environment.
                // Production/Play Store signing must use a separate key and release process.
                storeFile file(alphaKeystorePath)
                storePassword alphaStorePassword
                keyAlias alphaKeyAlias
                keyPassword alphaKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (alphaSigningConfigured) {
                signingConfig signingConfigs.alphaDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:$workManagerVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-push-notifications')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception ignored) {
    logger.info('google-services.json not found; FCM delivery is disabled for this build.')
}
